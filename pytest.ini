[pytest]
testpaths = tests
# Keep the disposable base directly under the checkout: pytest does not create
# missing parent directories for --basetemp on a fresh CI checkout.
addopts = --basetemp=.test-tmp-pytest
cache_dir = .remediation/pytest-cache

# backend/tests exercises the retired, absent `api` package, not PolitiTrack.
# Retained for historical provenance; operational tests live in tests/.
