name: Phase 5 repair Vault admin bucket metadata

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase5_repair_vault_admin_bucket_metadata.yml"
      - "deploy/runtime-v2/repair_vault_admin_bucket_metadata.sh"
      - "deploy/runtime-v2/terraform/vault_admin_bucket_metadata.tf"
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase5_repair_vault_admin_bucket_metadata.yml"
      - "deploy/runtime-v2/repair_vault_admin_bucket_metadata.sh"
      - "deploy/runtime-v2/terraform/vault_admin_bucket_metadata.tf"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-v2-live-controller
  cancel-in-progress: false

jobs:
  validate-repair-definition:
    if: github.repository_id == '1349678672'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out proposed revision
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Validate least-privilege Terraform and workflow boundaries
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/runtime-v2/repair_vault_admin_bucket_metadata.sh
          terraform -chdir=deploy/runtime-v2/terraform fmt -check
          terraform -chdir=deploy/runtime-v2/terraform init -backend=false -lockfile=readonly
          terraform -chdir=deploy/runtime-v2/terraform validate
          python - <<'PY'
          from pathlib import Path

          terraform = Path("deploy/runtime-v2/terraform/vault_admin_bucket_metadata.tf").read_text()
          controller = Path("deploy/runtime-v2/repair_vault_admin_bucket_metadata.sh").read_text()
          workflow = Path(".github/workflows/phase5_repair_vault_admin_bucket_metadata.yml").read_text()

          required_terraform = (
              'resource "google_storage_bucket_iam_member" "vault_admin_bucket_metadata"',
              'bucket = google_storage_bucket.vault[0].name',
              'role   = "roles/storage.bucketViewer"',
              'member = "serviceAccount:${google_service_account.admin.email}"',
          )
          required_control = (
              "polititrack-filing-vault-497412818801",
              "polititrack-admin-v2@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com",
              "roles/storage.bucketViewer",
              "phase4_live_shadow_validation_v6.yml",
              "runtime-v2-live-controller",
          )
          combined = controller + "\n" + workflow
          for token in required_terraform:
              if token not in terraform:
                  raise SystemExit(f"Terraform repair is missing: {token}")
          for token in required_control:
              if token not in combined:
                  raise SystemExit(f"Repair control is missing: {token}")

          forbidden_commands = (
              "gcloud run jobs " + "execute",
              "gcloud scheduler jobs " + "resume",
              "gcloud scheduler jobs " + "run",
              "make_web_" + "public",
          )
          for token in forbidden_commands:
              if token in controller:
                  raise SystemExit(f"Repair controller contains forbidden execution: {token}")

          forbidden_terraform_roles = (
              "roles/storage." + "admin",
              "roles/storage." + "objectAdmin",
              "roles/storage." + "objectUser",
              "roles/storage." + "legacyBucketOwner",
              "roles/storage." + "legacyBucketWriter",
          )
          for token in forbidden_terraform_roles:
              if token in terraform:
                  raise SystemExit(f"Terraform repair grants broader access: {token}")
          PY

  apply-bucket-metadata-binding:
    needs: validate-repair-definition
    if: >-
      github.repository_id == '1349678672' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PROJECT_ID: project-38008d5f-4918-46e6-920
      PROJECT_NUMBER: "497412818801"
      REGION: us-central1
      WIF_PROVIDER: projects/497412818801/locations/global/workloadIdentityPools/polititrack-github-phase3/providers/phase3-main
      DEPLOYER_SERVICE_ACCOUNT: polititrack-phase3-deployer@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com
      VAULT_BUCKET: polititrack-filing-vault-497412818801
      ADMIN_SERVICE_ACCOUNT: polititrack-admin-v2@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com
      REQUIRED_ROLE: roles/storage.bucketViewer
      WEB_SERVICE: polititrack-web
      SQL_INSTANCE: polititrack-runtime-v2
      EVIDENCE_DIR: phase5-vault-admin-repair
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Authenticate as constrained deployer
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Apply and independently verify the exact bucket-scoped grant
        shell: bash
        run: bash deploy/runtime-v2/repair_vault_admin_bucket_metadata.sh

      - name: Upload repair evidence
        uses: actions/upload-artifact@v6
        with:
          name: phase5-vault-admin-bucket-metadata-repair
          path: phase5-vault-admin-repair/
          if-no-files-found: error
          retention-days: 90

  dispatch-phase4-v6:
    needs:
      - validate-repair-definition
      - apply-bucket-metadata-binding
    if: >-
      github.repository_id == '1349678672' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch the unchanged canonical Phase 4 v6 gate
        shell: bash
        run: |
          set -euo pipefail
          live_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          [[ "${live_sha}" == "${GITHUB_SHA}" ]] || {
            echo "Canonical main advanced after the IAM repair; refusing dispatch." >&2
            exit 1
          }
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run phase4_live_shadow_validation_v6.yml \
            --repo "${GITHUB_REPOSITORY}" --ref main
          run_id=""
          for attempt in $(seq 1 18); do
            run_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/phase4_live_shadow_validation_v6.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
              --jq ".workflow_runs | map(select(.head_sha == \"${GITHUB_SHA}\" and .created_at >= \"${dispatched_at}\")) | sort_by(.created_at) | last | .id // empty")"
            [[ -n "${run_id}" ]] && break
            sleep 5
          done
          [[ -n "${run_id}" ]] || {
            echo "Phase 4 v6 dispatch was not independently observed." >&2
            exit 1
          }
          echo "Dispatched Phase 4 v6 run ${run_id} for ${GITHUB_SHA}."
          {
            echo "### Phase 4 v6 dispatch"
            echo "- Canonical revision: \`${GITHUB_SHA}\`"
            echo "- Run ID: \`${run_id}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
