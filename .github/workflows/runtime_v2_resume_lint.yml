name: Validate Runtime v2 recovery resume controller

on:
  push:
    branches:
      - fix/runtime-v2-resume-build-and-rollout
    paths:
      - ".github/workflows/runtime_v2_resume_lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository_id == '1349678672'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/runtime-v2-resume-build-and-rollout
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install PyYAML==6.0.3 pytest==9.0.2
      - name: Parse workflow and embedded Bash
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          import yaml

          path = Path('.github/workflows/runtime_v2_production_recovery_resume.yml')
          workflow = yaml.safe_load(path.read_text(encoding='utf-8'))
          if not isinstance(workflow, dict) or 'jobs' not in workflow:
              raise SystemExit('Resume controller is not valid workflow YAML')
          scripts = []
          for job in workflow['jobs'].values():
              for step in job.get('steps', []):
                  script = step.get('run')
                  if isinstance(script, str):
                      scripts.append((step.get('name', '<unnamed>'), script))
          if not scripts:
              raise SystemExit('Resume controller has no executable scripts')
          for index, (name, script) in enumerate(scripts, 1):
              with tempfile.NamedTemporaryFile('w', suffix='.sh', delete=False) as handle:
                  handle.write(script)
                  script_path = handle.name
              result = subprocess.run(['bash', '-n', script_path], text=True, capture_output=True)
              if result.returncode:
                  raise SystemExit(f'Bash syntax failure in step {index} {name}: {result.stderr}')
          print(f'Validated {len(scripts)} embedded Bash scripts')
          PY
      - name: Verify continuation invariants
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/runtime_v2_production_recovery_resume.yml
          grep -Fq 'acdaa3ae-b4ca-42c4-a71d-c8954f83e299' "$workflow"
          grep -Fq '72c1ca8c74a7af4b11f2e677c7a296d5e2358578' "$workflow"
          grep -Fq 'gcloud builds describe "${BUILD_ID}"' "$workflow"
          grep -Fq '.substitutions._SOURCE_REVISION == $source' "$workflow"
          grep -Fq 'pause_producer_schedulers' "$workflow"
          grep -Fq 'configure_runtime production' "$workflow"
          grep -Fq 'execute_producer ai post-phase5-recovery' "$workflow"
          grep -Fq 'runtime_v2_natural_schedule_certified' "$workflow"
          grep -Fq 'remove_execution_authority' "$workflow"
          ! grep -Fq 'gcloud builds submit' "$workflow"
          ! grep -Eq -- '--allow-unauthenticated|allUsers|terraform[[:space:]]+apply' "$workflow"
      - name: Run existing production-control tests
        run: |
          python -m pytest -q \
            tests/test_phase5_failed_promotion_retry.py \
            tests/test_phase5_scheduler_resume_receipt.py \
            tests/test_phase5_retry_workflow_failure_safety.py
      - name: Verify repository safety contract
        run: bash verify.sh
