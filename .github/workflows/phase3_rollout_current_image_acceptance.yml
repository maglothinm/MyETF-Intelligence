name: Phase 3 rollout current image and accept

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase3_rollout_current_image_acceptance.yml"

permissions:
  contents: read
  id-token: write

jobs:
  rollout-and-accept:
    if: github.repository_id == '1349678672' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PROJECT_ID: project-38008d5f-4918-46e6-920
      PROJECT_NUMBER: "497412818801"
      REGION: us-central1
      STATE_BUCKET: project-38008d5f-4918-46e6-920-polititrack-tfstate
      RECONCILIATION_VARS: ../phase3-reconciliation.tfvars.json
      BUILD_ID: 1db569db-57a1-46fe-a061-0547ac6779b2
      BUILD_SOURCE_REVISION: 080a3df0f0b912f702a30148cedc831b833a81db
      IMAGE_DIGEST: sha256:b9758a697338ffdeb7505473819aec70247ac23ed46b15af5b78701ed1f61f9b
      IMMUTABLE_IMAGE: us-central1-docker.pkg.dev/project-38008d5f-4918-46e6-920/polititrack/runtime-v2@sha256:b9758a697338ffdeb7505473819aec70247ac23ed46b15af5b78701ed1f61f9b
      WIF_PROVIDER: projects/497412818801/locations/global/workloadIdentityPools/polititrack-github-phase3/providers/phase3-main
      DEPLOYER_SERVICE_ACCOUNT: polititrack-phase3-deployer@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com
      ADMIN_JOB: polititrack-admin
      WEB_SERVICE: polititrack-web
      SQL_INSTANCE: polititrack-runtime-v2
      LOG_BUCKET: _Default
      LOG_VIEW: _Default
      LOG_LOCATION: global
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v7

      - name: Authenticate as constrained Phase 3 deployer
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Verify immutable source, cloud boundary, and inert controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase3-image-rollout

          actual_number="$(gcloud projects describe "${PROJECT_ID}" --format='value(projectNumber)')"
          [[ "${actual_number}" == "${PROJECT_NUMBER}" ]] || {
            echo "Immutable project boundary mismatch." >&2
            exit 1
          }

          gcloud builds describe "${BUILD_ID}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format=json > phase3-image-rollout/build.json
          jq -e --arg source "${BUILD_SOURCE_REVISION}" \
            '.status == "SUCCESS" and .substitutions._SOURCE_REVISION == $source' \
            phase3-image-rollout/build.json >/dev/null || {
              echo "Pinned Cloud Build is not a successful exact-source build." >&2
              exit 1
            }
          resolved_digest="$(gcloud artifacts docker images describe "${IMMUTABLE_IMAGE}" \
            --project "${PROJECT_ID}" \
            --format='value(image_summary.digest)')"
          [[ "${resolved_digest}" == "${IMAGE_DIGEST}" ]] || {
            echo "Pinned Artifact Registry digest does not resolve exactly." >&2
            exit 1
          }

          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('deploy/runtime-v2/phase3-reconciliation.tfvars.json').read_text(encoding='utf-8'))
          expected_image = 'us-central1-docker.pkg.dev/project-38008d5f-4918-46e6-920/polititrack/runtime-v2@sha256:b9758a697338ffdeb7505473819aec70247ac23ed46b15af5b78701ed1f61f9b'
          expected_revision = '080a3df0f0b912f702a30148cedc831b833a81db'
          if config.get('image') != expected_image:
              raise SystemExit('Canonical Phase 3 tfvars are not pinned to the authorized immutable image.')
          env = config.get('runtime_environment') or {}
          if env.get('SOURCE_REVISION') != expected_revision:
              raise SystemExit('Canonical Phase 3 SOURCE_REVISION does not match the image source.')
          if env.get('POLITITRACK_MODE') != 'shadow':
              raise SystemExit('Runtime v2 is not pinned to shadow mode.')
          if config.get('schedules_enabled') is not False:
              raise SystemExit('Runtime v2 schedules are not disabled.')
          if config.get('public_dashboard_enabled') is not False:
              raise SystemExit('Runtime v2 public dashboard is enabled.')
          PY

          for scheduler in polititrack-legislative polititrack-executive polititrack-ai polititrack-dashboard polititrack-vault-lifecycle; do
            state="$(gcloud scheduler jobs describe "${scheduler}" --project "${PROJECT_ID}" --location "${REGION}" --format='value(state)')"
            [[ "${state}" == "PAUSED" ]] || {
              echo "Scheduler ${scheduler} is not paused." >&2
              exit 1
            }
          done

          gcloud sql instances describe "${SQL_INSTANCE}" --project "${PROJECT_ID}" --format=json > phase3-image-rollout/sql-before.json
          jq -e '.settings.ipConfiguration.ipv4Enabled == false and any(.ipAddresses[]?; .type == "PRIVATE")' \
            phase3-image-rollout/sql-before.json >/dev/null || {
              echo "Cloud SQL is not private-only with a private address." >&2
              exit 1
            }
          web_policy="$(gcloud run services get-iam-policy "${WEB_SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format=json)"
          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers")' <<<"${web_policy}" >/dev/null; then
            echo "Runtime v2 web service has public allUsers access." >&2
            exit 1
          fi

      - name: Initialize exact Terraform backend
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=deploy/runtime-v2/terraform init \
            -reconfigure \
            -lockfile=readonly \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="prefix=runtime-v2"

      - name: Create and machine-approve update-only image plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          plan_file="${RUNNER_TEMP}/phase3-current-image.tfplan"
          plan_json="${RUNNER_TEMP}/phase3-current-image-plan.json"
          set +e
          terraform -chdir=deploy/runtime-v2/terraform plan \
            -no-color \
            -detailed-exitcode \
            -lock-timeout=5m \
            -var-file="${RECONCILIATION_VARS}" \
            -out="${plan_file}" \
            > phase3-image-rollout/terraform-plan.txt 2>&1
          plan_rc=$?
          set -e
          cat phase3-image-rollout/terraform-plan.txt
          [[ "${plan_rc}" -eq 2 ]] || {
            echo "Expected only the pinned image rollout, but Terraform detailed exit code was ${plan_rc}." >&2
            exit 1
          }
          terraform -chdir=deploy/runtime-v2/terraform show -json "${plan_file}" > "${plan_json}"

          PLAN_JSON="${plan_json}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path(os.environ['PLAN_JSON']).read_text(encoding='utf-8'))
          target_image = 'us-central1-docker.pkg.dev/project-38008d5f-4918-46e6-920/polititrack/runtime-v2@sha256:b9758a697338ffdeb7505473819aec70247ac23ed46b15af5b78701ed1f61f9b'
          source_revision = '080a3df0f0b912f702a30148cedc831b833a81db'
          expected = {
              'google_cloud_run_v2_job.admin',
              'google_cloud_run_v2_job.import["ai"]',
              'google_cloud_run_v2_job.import["executive"]',
              'google_cloud_run_v2_job.import["legislative"]',
              'google_cloud_run_v2_job.producer["ai"]',
              'google_cloud_run_v2_job.producer["dashboard"]',
              'google_cloud_run_v2_job.producer["executive"]',
              'google_cloud_run_v2_job.producer["legislative"]',
              'google_cloud_run_v2_job.vault_lifecycle[0]',
              'google_cloud_run_v2_service.web',
          }
          changed = []
          for resource in data.get('resource_changes', []):
              actions = resource.get('change', {}).get('actions', [])
              if actions != ['no-op']:
                  changed.append(resource)
          addresses = {resource['address'] for resource in changed}
          if addresses != expected:
              raise SystemExit(
                  'Image rollout address mismatch. unexpected=' + repr(sorted(addresses - expected))
                  + ' missing=' + repr(sorted(expected - addresses))
              )
          for resource in changed:
              address = resource['address']
              actions = resource.get('change', {}).get('actions', [])
              if actions != ['update']:
                  raise SystemExit(f'{address} is not an in-place update: {actions}')
              after = resource.get('change', {}).get('after') or {}
              images = []
              env = {}
              def walk(value):
                  if isinstance(value, dict):
                      for key, child in value.items():
                          if key == 'image' and isinstance(child, str):
                              images.append(child)
                          walk(child)
                      name = value.get('name')
                      if isinstance(name, str) and isinstance(value.get('value'), str):
                          env[name] = value['value']
                  elif isinstance(value, list):
                      for child in value:
                          walk(child)
              walk(after)
              if target_image not in images:
                  raise SystemExit(f'{address} is not pinned to the authorized immutable image.')
              if env.get('PRIVATE_IP') != 'true':
                  raise SystemExit(f'{address} is not private-IP enabled.')
              if address.startswith('google_cloud_run_v2_job.producer['):
                  if env.get('POLITITRACK_MODE') != 'shadow':
                      raise SystemExit(f'{address} is not in shadow mode.')
                  if env.get('SOURCE_REVISION') != source_revision:
                      raise SystemExit(f'{address} has the wrong source revision.')

          Path('phase3-image-rollout/changed-addresses.txt').write_text(
              '\n'.join(sorted(addresses)) + '\n', encoding='utf-8'
          )
          Path('phase3-image-rollout/plan-policy.json').write_text(
              json.dumps({
                  'result': 'update_only_image_plan_approved',
                  'changed_count': len(changed),
                  'changed_addresses': sorted(addresses),
                  'actions': ['update'],
                  'immutable_image': target_image,
                  'source_revision': source_revision,
                  'producer_mode': 'shadow',
                  'producer_private_ip': True,
                  'scheduler_changes': False,
                  'database_changes': False,
                  'iam_changes': False,
                  'secret_changes': False,
              }, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(Path('phase3-image-rollout/plan-policy.json').read_text(encoding='utf-8'))
          PY

          plan_sha="$(sha256sum "${plan_file}" | awk '{print $1}')"
          echo "plan_file=${plan_file}" >> "${GITHUB_OUTPUT}"
          echo "plan_json=${plan_json}" >> "${GITHUB_OUTPUT}"
          echo "plan_sha=${plan_sha}" >> "${GITHUB_OUTPUT}"

      - name: Apply the exact machine-approved binary plan
        shell: bash
        env:
          PLAN_FILE: ${{ steps.plan.outputs.plan_file }}
          PLAN_SHA: ${{ steps.plan.outputs.plan_sha }}
        run: |
          set -euo pipefail
          live_sha="$(sha256sum "${PLAN_FILE}" | awk '{print $1}')"
          [[ "${live_sha}" == "${PLAN_SHA}" ]] || {
            echo "Saved image rollout plan hash changed before apply." >&2
            exit 1
          }
          terraform -chdir=deploy/runtime-v2/terraform apply \
            -no-color \
            -auto-approve \
            -lock-timeout=5m \
            "${PLAN_FILE}" \
            > phase3-image-rollout/terraform-apply.txt 2>&1
          cat phase3-image-rollout/terraform-apply.txt

      - name: Verify rollout and execute one read-only status probe
        id: acceptance
        shell: bash
        env:
          PLAN_SHA: ${{ steps.plan.outputs.plan_sha }}
        run: |
          set -euo pipefail
          member="serviceAccount:${DEPLOYER_SERVICE_ACCOUNT}"

          cleanup_temporary_access() {
            set +e
            gcloud logging views remove-iam-policy-binding "${LOG_VIEW}" \
              --bucket "${LOG_BUCKET}" \
              --location "${LOG_LOCATION}" \
              --project "${PROJECT_ID}" \
              --member "${member}" \
              --role roles/logging.viewAccessor \
              --quiet >/dev/null 2>&1
            gcloud projects remove-iam-policy-binding "${PROJECT_ID}" \
              --member "${member}" \
              --role roles/logging.admin \
              --condition=None \
              --quiet >/dev/null 2>&1
            gcloud run jobs remove-iam-policy-binding "${ADMIN_JOB}" \
              --project "${PROJECT_ID}" \
              --region "${REGION}" \
              --member "${member}" \
              --role roles/run.jobsExecutorWithOverrides \
              --quiet >/dev/null 2>&1
          }
          trap cleanup_temporary_access EXIT
          cleanup_temporary_access

          jobs=(
            polititrack-admin
            polititrack-legislative
            polititrack-executive
            polititrack-ai
            polititrack-dashboard
            polititrack-import-legislative
            polititrack-import-executive
            polititrack-import-ai
            polititrack-vault-lifecycle
          )
          for job in "${jobs[@]}"; do
            gcloud run jobs describe "${job}" --project "${PROJECT_ID}" --region "${REGION}" --format=json > "phase3-image-rollout/${job}.json"
            image="$(jq -r 'first(.. | objects | select(has("containers")) | .containers[0].image) // empty' "phase3-image-rollout/${job}.json")"
            [[ "${image}" == "${IMMUTABLE_IMAGE}" ]] || {
              echo "${job} does not use the authorized immutable image." >&2
              exit 1
            }
            private_ip="$(jq -r '[.. | objects | select(has("containers")) | .containers[0].env[]? | select(.name == "PRIVATE_IP") | .value][0] // empty' "phase3-image-rollout/${job}.json")"
            [[ "${private_ip}" == "true" ]] || {
              echo "${job} is not private-IP enabled." >&2
              exit 1
            }
          done

          admin_container="$(jq -c 'first(.. | objects | select(has("containers")) | .containers[0])' phase3-image-rollout/polititrack-admin.json)"
          [[ "$(jq -c '.command // []' <<<"${admin_container}")" == '["python"]' ]] || {
            echo "Admin command changed during image rollout." >&2
            exit 1
          }
          [[ "$(jq -c '.args // []' <<<"${admin_container}")" == '["-m","runtime_v2","init-db","--with-vault"]' ]] || {
            echo "Admin arguments changed during image rollout." >&2
            exit 1
          }

          gcloud run services describe "${WEB_SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format=json > phase3-image-rollout/web.json
          web_image="$(jq -r 'first(.. | objects | select(has("containers")) | .containers[0].image) // empty' phase3-image-rollout/web.json)"
          [[ "${web_image}" == "${IMMUTABLE_IMAGE}" ]] || {
            echo "Runtime v2 web service does not use the authorized immutable image." >&2
            exit 1
          }

          for scheduler in polititrack-legislative polititrack-executive polititrack-ai polititrack-dashboard polititrack-vault-lifecycle; do
            state="$(gcloud scheduler jobs describe "${scheduler}" --project "${PROJECT_ID}" --location "${REGION}" --format='value(state)')"
            [[ "${state}" == "PAUSED" ]] || {
              echo "Scheduler ${scheduler} changed state during rollout." >&2
              exit 1
            }
          done
          gcloud sql instances describe "${SQL_INSTANCE}" --project "${PROJECT_ID}" --format=json > phase3-image-rollout/sql-after.json
          jq -e '.settings.ipConfiguration.ipv4Enabled == false and any(.ipAddresses[]?; .type == "PRIVATE")' \
            phase3-image-rollout/sql-after.json >/dev/null || {
              echo "Cloud SQL lost its private-only boundary." >&2
              exit 1
            }
          web_policy="$(gcloud run services get-iam-policy "${WEB_SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format=json)"
          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers")' <<<"${web_policy}" >/dev/null; then
            echo "Runtime v2 web service became public." >&2
            exit 1
          fi

          gcloud run jobs add-iam-policy-binding "${ADMIN_JOB}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --member "${member}" \
            --role roles/run.jobsExecutorWithOverrides \
            --quiet >/dev/null
          gcloud projects add-iam-policy-binding "${PROJECT_ID}" \
            --member "${member}" \
            --role roles/logging.admin \
            --condition=None \
            --quiet >/dev/null
          gcloud logging views add-iam-policy-binding "${LOG_VIEW}" \
            --bucket "${LOG_BUCKET}" \
            --location "${LOG_LOCATION}" \
            --project "${PROJECT_ID}" \
            --member "${member}" \
            --role roles/logging.viewAccessor \
            --quiet >/dev/null

          logging_ready=false
          for attempt in $(seq 1 18); do
            if gcloud logging read 'resource.type="cloud_run_job"' --project "${PROJECT_ID}" --limit=1 --format=json >/dev/null 2> phase3-image-rollout/logging-ready-error.txt; then
              logging_ready=true
              break
            fi
            echo "Log-view IAM not effective yet (attempt ${attempt}/18)."
            sleep 10
          done
          [[ "${logging_ready}" == "true" ]] || {
            cat phase3-image-rollout/logging-ready-error.txt >&2 || true
            echo "Cloud Logging access did not propagate." >&2
            exit 1
          }

          previous_execution="$(gcloud run jobs describe "${ADMIN_JOB}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.latestCreatedExecution.name)')"
          set +e
          gcloud run jobs execute "${ADMIN_JOB}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --args=-m,runtime_v2,status \
            --wait \
            --format=json > phase3-image-rollout/status-execute.json 2> phase3-image-rollout/status-execute-error.txt
          execute_rc=$?
          set -e
          status_execution="$(gcloud run jobs describe "${ADMIN_JOB}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.latestCreatedExecution.name)')"
          [[ -n "${status_execution}" && "${status_execution}" != "${previous_execution}" ]] || {
            cat phase3-image-rollout/status-execute-error.txt >&2 || true
            echo "A new read-only status execution was not created." >&2
            exit 1
          }
          gcloud run jobs executions describe "${status_execution}" --project "${PROJECT_ID}" --region "${REGION}" --format=json > phase3-image-rollout/status-execution.json

          status_found=false
          for attempt in $(seq 1 24); do
            gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${ADMIN_JOB}\" AND resource.labels.location=\"${REGION}\" AND labels.\"run.googleapis.com/execution_name\"=\"${status_execution}\"" \
              --project "${PROJECT_ID}" \
              --order=asc \
              --limit=300 \
              --format=json > phase3-image-rollout/status-logs.json
            jq -c '[.[] | .textPayload? | select(type == "string") | fromjson? | select(type == "object" and has("heads") and has("latest_runs"))][0] // empty' \
              phase3-image-rollout/status-logs.json > phase3-image-rollout/status.json
            if [[ -s phase3-image-rollout/status.json ]]; then
              status_found=true
              break
            fi
            echo "Waiting for durable status JSON (attempt ${attempt}/24)."
            sleep 5
          done

          if [[ "${execute_rc}" -ne 0 ]]; then
            cat phase3-image-rollout/status-execute-error.txt >&2 || true
            jq -r '.[] | .textPayload? // .jsonPayload.message? // empty' phase3-image-rollout/status-logs.json >&2 || true
            echo "Read-only status execution failed after image rollout." >&2
            exit 1
          fi
          jq -e 'any(.status.conditions[]?; .type == "Completed" and .status == "True")' \
            phase3-image-rollout/status-execution.json >/dev/null || {
              echo "Read-only status execution did not complete successfully." >&2
              exit 1
            }
          [[ "${status_found}" == "true" ]] || {
            echo "Read-only status execution produced no durable-state JSON." >&2
            exit 1
          }

          cleanup_temporary_access
          trap - EXIT

          project_policy="$(gcloud projects get-iam-policy "${PROJECT_ID}" --format=json)"
          if jq -e --arg member "${member}" '[.bindings[]? | select(.role == "roles/logging.admin") | .members[]?] | any(. == $member)' <<<"${project_policy}" >/dev/null; then
            echo "Temporary Logging Admin remains." >&2
            exit 1
          fi
          view_policy="$(gcloud logging views get-iam-policy "${LOG_VIEW}" --bucket "${LOG_BUCKET}" --location "${LOG_LOCATION}" --project "${PROJECT_ID}" --format=json)"
          if jq -e --arg member "${member}" '[.bindings[]? | select(.role == "roles/logging.viewAccessor") | .members[]?] | any(. == $member)' <<<"${view_policy}" >/dev/null; then
            echo "Temporary log-view accessor remains." >&2
            exit 1
          fi
          admin_policy="$(gcloud run jobs get-iam-policy "${ADMIN_JOB}" --project "${PROJECT_ID}" --region "${REGION}" --format=json)"
          if jq -e --arg member "${member}" '[.bindings[]? | select(.role == "roles/run.jobsExecutorWithOverrides") | .members[]?] | any(. == $member)' <<<"${admin_policy}" >/dev/null; then
            echo "Temporary admin execution authority remains." >&2
            exit 1
          fi

          python deploy/runtime-v2/validate_phase3_status.py \
            --status phase3-image-rollout/status.json \
            --status-execution "${status_execution}" \
            --source-revision "${GITHUB_SHA}" \
            --output phase3-image-rollout/phase3-acceptance.json

          STATUS_EXECUTION="${status_execution}" PLAN_SHA="${PLAN_SHA}" python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('phase3-image-rollout/phase3-acceptance.json')
          receipt = json.loads(path.read_text(encoding='utf-8'))
          receipt.update({
              'accepted_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'cloud_build_id': '1db569db-57a1-46fe-a061-0547ac6779b2',
              'image_source_revision': '080a3df0f0b912f702a30148cedc831b833a81db',
              'immutable_image': 'us-central1-docker.pkg.dev/project-38008d5f-4918-46e6-920/polititrack/runtime-v2@sha256:b9758a697338ffdeb7505473819aec70247ac23ed46b15af5b78701ed1f61f9b',
              'image_digest': 'sha256:b9758a697338ffdeb7505473819aec70247ac23ed46b15af5b78701ed1f61f9b',
              'terraform_plan_sha256': os.environ['PLAN_SHA'],
              'terraform_changed_resources': 10,
              'terraform_actions': ['update'],
              'temporary_execution_authority_granted': True,
              'temporary_execution_authority_removed': True,
              'temporary_logging_authority_removed': True,
              'runtime_job_execution': False,
              'read_only_status_execution': os.environ['STATUS_EXECUTION'],
              'scheduler_execution': False,
              'production_authority_transferred': False,
              'phase4_started': False,
          })
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(path.read_text(encoding='utf-8'))
          PY

          receipt_sha="$(sha256sum phase3-image-rollout/phase3-acceptance.json | awk '{print $1}')"
          receipt_uri="gs://${STATE_BUCKET}/phase3-acceptance/final-${GITHUB_RUN_ID}.json"
          gcloud storage cp phase3-image-rollout/phase3-acceptance.json "${receipt_uri}" --quiet
          roundtrip="${RUNNER_TEMP}/phase3-final-acceptance.json"
          gcloud storage cp "${receipt_uri}" "${roundtrip}" --quiet
          roundtrip_sha="$(sha256sum "${roundtrip}" | awk '{print $1}')"
          rm -f "${roundtrip}"
          [[ "${roundtrip_sha}" == "${receipt_sha}" ]] || {
            echo "Final Phase 3 acceptance receipt GCS round-trip mismatch." >&2
            exit 1
          }
          echo "status_execution=${status_execution}" >> "${GITHUB_OUTPUT}"
          echo "receipt_sha=${receipt_sha}" >> "${GITHUB_OUTPUT}"
          echo "receipt_uri=${receipt_uri}" >> "${GITHUB_OUTPUT}"

      - name: Delete local binary plan and plan JSON
        if: always()
        shell: bash
        env:
          PLAN_FILE: ${{ steps.plan.outputs.plan_file }}
          PLAN_JSON: ${{ steps.plan.outputs.plan_json }}
        run: |
          rm -f "${PLAN_FILE:-}" "${PLAN_JSON:-}"

      - name: Upload final Phase 3 readiness evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase3-final-readiness
          path: |
            phase3-image-rollout/build.json
