name: Source OCR isolated test dependencies
on:
  push:
    branches: [codex/source-upload-ocr-20260917]
    paths: [.github/workflows/source_ocr_test_deps.yml]
permissions:
  contents: read
jobs:
  dependencies:
    if: github.repository_id == '1349678672'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip download --no-deps --only-binary=:all: --dest /tmp/ocr-wheels 'Flask>=3.0.2,<4' 'Werkzeug>=3.1,<4' 'blinker>=1.9,<2' 'openai>=2.45.0,<3' 'jiter>=0.10,<1' 'distro>=1.8,<2' 'pg8000>=1.31,<2' 'scramp>=1.4,<2' 'asn1crypto>=1.5,<2'
      - uses: actions/upload-artifact@v4
        with:
          name: source-ocr-test-wheels
          path: /tmp/ocr-wheels/
          retention-days: 1
