name: Investor Edge tests

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "schemas/**"
      - "docs/protected-state-migration.json"
      - ".github/workflows/**"
      - "requirements-*.txt"
      - "pytest.ini"
      - "verify.sh"
      - "MANIFEST.sha256"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "schemas/**"
      - "docs/protected-state-migration.json"
      - ".github/workflows/**"
      - "requirements-*.txt"
      - "pytest.ini"
      - "verify.sh"
      - "MANIFEST.sha256"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ai.txt
            requirements-tracker.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements-ai.txt pytest==9.0.2
      - name: Run all active offline tests
        run: python -m pytest -q
      - name: Verify recovery tombstone, workflow safety, syntax and generated assets
        shell: bash
        run: bash verify.sh
