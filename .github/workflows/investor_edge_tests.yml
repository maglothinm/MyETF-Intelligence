      - "tests/test_government_trade_tracker.py"
      - "tests/test_historical_transaction_bootstrap.py"
      - "tests/test_senate_client.py"
      - "tests/test_legislative_healthcheck.py"
      - "tests/test_legislative_resilient_orchestrator.py"
      - "tests/test_legislative_resilient_integration.py"
      - ".github/workflows/legislative_trade_tracker_v2.yml"
      - "config/investor_edge.yml"
      - "config/signal_rules.yml"
      - "config/ai-retry-adjudication-*.json"
      - "schemas/ai_filing_analysis.schema.json"
      - "tests/test_investor_edge.py"
      - "tests/test_investor_edge_core.py"
      - "tests/test_investor_edge_surfaces.py"
      - "tests/test_ai_filing_analyst.py"
      - "tests/test_ai_filing_analyst_hardened.py"
      - "tests/test_ai_retry_guard.py"
      - "tests/test_validate_ai_publication.py"
      - "tests/test_trade_dashboard.py"
      - "tests/test_filing_vault*.py"
      - "tests/filing_vault_dom.test.cjs"
      - "tests/filing_pdf_dom.test.cjs"
      - "tests/filing_resolution_dom.test.cjs"
      - "tests/test_create_manual_test_filing.py"
      - "requirements-ai.txt"
      - "requirements-tracker.txt"
      - "requirements-vault.txt"
      - ".env.filing-vault.example"
      - "config/filing-vault/**"
      - ".env.tracker.example"
      - "README.md"
      - "README_AI_FILING_ANALYST.md"
      - "README_INVESTOR_EDGE.md"
      - "README_REPORTING_DASHBOARD.md"
      - "README_WALLBOARD_PRIVATE_REPO.md"
      - ".github/workflows/ai_filing_analyst.yml"
      - ".github/workflows/manual_test.yml"
      - ".github/workflows/publish_trade_dashboard.yml"
      - ".github/workflows/investor_edge_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ai.txt
            requirements-tracker.txt
            requirements-vault.txt
      - name: Set up Node for isolated DOM fixtures
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements-ai.txt --requirement requirements-vault.txt pytest==9.0.2
          npm install --prefix .remediation/ui-test-tools --no-save --package-lock=false --ignore-scripts --no-audit --no-fund jsdom@26.1.0 axe-core@4.10.3
      - name: Run Investor Edge, Filing Vault and integration tests
        env:
          POLITITRACK_TEST_NODE: node
          POLITITRACK_TEST_NODE_MODULES: ${{ github.workspace }}/.remediation/ui-test-tools/node_modules
        run: |
          python -m pytest -q \
            tests/test_collector_freshness.py \
            tests/test_scheduler_evidence.py \
            tests/test_monitor_disclosures.py \
            tests/test_government_trade_tracker.py \
            tests/test_historical_transaction_bootstrap.py \
            tests/test_senate_client.py \
            tests/test_legislative_healthcheck.py \
            tests/test_legislative_resilient_orchestrator.py \
            tests/test_legislative_resilient_integration.py \
            tests/test_oge_disclosures.py \
            tests/test_investor_edge.py \
            tests/test_investor_edge_core.py \
            tests/test_investor_edge_surfaces.py \
            tests/test_ai_filing_analyst.py \
            tests/test_ai_filing_analyst_hardened.py \
            tests/test_ai_retry_guard.py \
            tests/test_validate_ai_publication.py \
            tests/test_trade_dashboard.py \
            tests/test_filing_vault.py \
            tests/test_filing_vault_providers.py \
            tests/test_filing_vault_ui.py \
            tests/test_create_manual_test_filing.py
          node --test tests/filing_resolution_dom.test.cjs
          node --test tests/scheduler_dispatch.test.mjs
      - name: Verify repository safety contract
        shell: bash
        run: bash verify.sh
