name: Investor Edge tests

on:
  pull_request:
    paths:
      - "scripts/investor_edge.py"
      - "scripts/ai_filing_analyst.py"
      - "scripts/build_trade_dashboard.py"
      - "config/investor_edge.yml"
      - "tests/test_investor_edge.py"
      - "README_INVESTOR_EDGE.md"
      - ".github/workflows/investor_edge_tests.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/investor_edge.py"
      - "scripts/ai_filing_analyst.py"
      - "scripts/build_trade_dashboard.py"
      - "config/investor_edge.yml"
      - "tests/test_investor_edge.py"
      - "README_INVESTOR_EDGE.md"
      - ".github/workflows/investor_edge_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ai.txt
            requirements-tracker.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements-ai.txt pytest==9.0.2
      - name: Run Investor Edge and integration tests
        run: |
          python -m pytest -q \
            tests/test_investor_edge.py \
            tests/test_ai_filing_analyst.py \
            tests/test_trade_dashboard.py
