name: Investor Edge tests

on:
  # Keep the sole required CI context available for every pull request.
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ai.txt
            requirements-tracker.txt
            requirements-vault.txt
      - name: Set up Node for isolated DOM fixtures
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements-ai.txt --requirement requirements-vault.txt pytest==9.0.2
          npm install --prefix .remediation/ui-test-tools --no-save --package-lock=false --ignore-scripts --no-audit --no-fund jsdom@26.1.0 axe-core@4.10.3
      - name: Run Investor Edge, Filing Vault and integration tests
        env:
          POLITITRACK_TEST_NODE: node
          POLITITRACK_TEST_NODE_MODULES: ${{ github.workspace }}/.remediation/ui-test-tools/node_modules
        run: |
          python -m pytest -q
          node --test tests/filing_resolution_dom.test.cjs
          node --test tests/scheduler_dispatch.test.mjs
      - name: Verify repository safety contract
        shell: bash
        run: bash verify.sh
