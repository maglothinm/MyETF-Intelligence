name: Issue 121 one-shot implementation installer

on:
  push:
    branches:
      - codex/issue-121-ai-analyst-recovery

permissions:
  contents: write

env:
  EXPECTED_BUNDLE_SHA256: 44fa946924e8eee222d3e44631503f5e55f1e6ec51a5009ba2a2fb11f0754234

jobs:
  install:
    if: >-
      github.repository_id == '1349678672' &&
      github.ref_name == 'codex/issue-121-ai-analyst-recovery' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          ref: codex/issue-121-ai-analyst-recovery
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ai.txt
            requirements-tracker.txt

      - name: Verify and install the implementation bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(find _issue121_bundle -maxdepth 1 -type f -name 'chunk-*' | wc -l)" -eq 7
          LC_ALL=C cat _issue121_bundle/chunk-* > "$RUNNER_TEMP/issue121.b64"
          base64 --decode "$RUNNER_TEMP/issue121.b64" > "$RUNNER_TEMP/issue121.tar.gz"
          echo "${EXPECTED_BUNDLE_SHA256}  ${RUNNER_TEMP}/issue121.tar.gz" | sha256sum --check --strict

          mkdir -p "$RUNNER_TEMP/issue121-extracted"
          python - "$RUNNER_TEMP/issue121.tar.gz" "$RUNNER_TEMP/issue121-extracted" <<'PY'
          from pathlib import Path, PurePosixPath
          import sys, tarfile

          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2]).resolve()
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe bundle path: {member.name}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsafe bundle member: {member.name}')
              handle.extractall(destination, members=members, filter='data')
          PY
          (
            cd "$RUNNER_TEMP/issue121-extracted"
            grep -v 'BUNDLE_MANIFEST.sha256$' BUNDLE_MANIFEST.sha256 | sha256sum --check --strict
          )

          test -f scripts/ai_filing_analyst.py
          test ! -e scripts/ai_filing_analyst_legacy.py
          cp scripts/ai_filing_analyst.py scripts/ai_filing_analyst_legacy.py
          rm "$RUNNER_TEMP/issue121-extracted/BUNDLE_MANIFEST.sha256"
          cp -a "$RUNNER_TEMP/issue121-extracted/." .
          rm -rf _issue121_bundle
          rm .github/workflows/issue121_bundle_installer.yml

          python -m py_compile \
            scripts/ai_filing_analyst.py \
            scripts/ai_filing_analyst_legacy.py \
            scripts/ai_filing_analyst_hardened.py \
            scripts/ai_retry_guard.py \
            scripts/validate_ai_publication.py
          python -m pip install --requirement requirements-ai.txt pytest==9.0.2
          python -m pytest -q \
            tests/test_ai_filing_analyst_hardened.py \
            tests/test_ai_retry_guard.py \
            tests/test_validate_ai_publication.py
          git diff --check

      - name: Commit exact installed implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/issue-121-ai-analyst-recovery
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/codex/issue-121-ai-analyst-recovery)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'Installer produced no changes.' >&2; exit 1; }
          git commit -m 'Harden AI analyst state publication and retry recovery (#121)'
          git push origin HEAD:codex/issue-121-ai-analyst-recovery
