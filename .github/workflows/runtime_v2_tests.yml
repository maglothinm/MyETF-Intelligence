name: Runtime v2 safety tests

on:
  pull_request:
    paths:
      - "runtime_v2/**"
      - "migrations/20260901_runtime_v2.sql"
      - "deploy/runtime-v2/**"
      - "requirements-runtime-v2.txt"
      - "tests/test_runtime_v2.py"
      - "tests/test_runtime_v2_shadow_mode.py"
      - "tests/test_runtime_v2_bootstrap_safety.py"
      - "tests/test_dashboard_insights.py"
      - ".github/workflows/runtime_v2_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime-v2.txt
      - name: Install Runtime v2 dependencies
        run: python -m pip install --requirement requirements-runtime-v2.txt
      - name: Compile Runtime v2 package
        run: python -m compileall -q runtime_v2
      - name: Parse Phase 3 PowerShell bootstrap
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'deploy/runtime-v2/bootstrap.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Run Runtime v2 focused tests
        run: |
          python -m pytest -q \
            tests/test_runtime_v2.py \
            tests/test_runtime_v2_shadow_mode.py \
            tests/test_runtime_v2_bootstrap_safety.py \
            tests/test_dashboard_insights.py
      - name: Verify repository safety contract
        shell: bash
        run: bash verify.sh
