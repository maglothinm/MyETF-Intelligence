name: Runtime v2 safety tests

on:
  pull_request:
    paths:
      - "runtime_v2/**"
      - "migrations/20260901_runtime_v2.sql"
      - "deploy/runtime-v2/**"
      - "docs/runtime-v2/phase3/**"
      - "requirements-runtime-v2.txt"
      - "tests/test_runtime_v2.py"
      - "tests/test_runtime_v2_shadow_mode.py"
      - "tests/test_runtime_v2_bootstrap_safety.py"
      - "tests/test_runtime_v2_database.py"
      - "tests/test_runtime_v2_terraform_safety.py"
      - "tests/test_runtime_v2_phase3_receipts.py"
      - "tests/test_phase3_cloud_discovery.py"
      - "tests/test_phase3_gcp_auth_inventory.py"
      - "tests/test_phase3_wif_bootstrap.py"
      - "tests/test_phase3_execution_identities.py"
      - "tests/test_phase3_terraform_plan.py"
      - "tests/test_phase3_prepare_apply_plan.py"
      - "tests/test_phase3_apply_saved_plan.py"
      - "tests/test_phase3_data_plane_audit.py"
      - "tests/test_dashboard_insights.py"
      - ".github/workflows/phase3_cloud_discovery.yml"
      - ".github/workflows/phase3_gcp_auth_inventory.yml"
      - ".github/workflows/phase3_terraform_plan.yml"
      - ".github/workflows/phase3_prepare_apply_plan.yml"
      - ".github/workflows/phase3_apply_saved_plan.yml"
      - ".github/workflows/phase3_data_plane_audit.yml"
      - ".github/workflows/runtime_v2_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime-v2.txt
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - name: Install Runtime v2 dependencies
        run: python -m pip install --requirement requirements-runtime-v2.txt
      - name: Compile Runtime v2 package
        run: python -m compileall -q runtime_v2
      - name: Parse Phase 3 PowerShell entry scripts
        shell: pwsh
        run: |
          foreach ($path in @(
            'deploy/runtime-v2/bootstrap.ps1',
            'deploy/runtime-v2/initialize-github-wif.ps1',
            'deploy/runtime-v2/initialize-phase3-execution-identities.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              exit 1
            }
          }
      - name: Check Terraform formatting
        run: terraform -chdir=deploy/runtime-v2/terraform fmt -check
      - name: Verify Windows and Linux provider checksums
        run: |
          terraform -chdir=deploy/runtime-v2/terraform providers lock \
            -platform=linux_amd64 \
            -platform=windows_amd64
          git diff --exit-code -- deploy/runtime-v2/terraform/.terraform.lock.hcl
      - name: Initialize Terraform without backend
        run: terraform -chdir=deploy/runtime-v2/terraform init -backend=false -lockfile=readonly
      - name: Validate Terraform configuration
        run: terraform -chdir=deploy/runtime-v2/terraform validate
      - name: Run Runtime v2 focused tests
        run: |
          python -m pytest -q \
            tests/test_runtime_v2.py \
            tests/test_runtime_v2_shadow_mode.py \
            tests/test_runtime_v2_bootstrap_safety.py \
            tests/test_runtime_v2_database.py \
            tests/test_runtime_v2_terraform_safety.py \
            tests/test_runtime_v2_phase3_receipts.py \
            tests/test_phase3_cloud_discovery.py \
            tests/test_phase3_gcp_auth_inventory.py \
            tests/test_phase3_wif_bootstrap.py \
            tests/test_phase3_execution_identities.py \
            tests/test_phase3_terraform_plan.py \
            tests/test_phase3_prepare_apply_plan.py \
            tests/test_phase3_apply_saved_plan.py \
            tests/test_phase3_data_plane_audit.py \
            tests/test_dashboard_insights.py
      - name: Verify repository safety contract
        shell: bash
        run: bash verify.sh
