name: Phase 3 Terraform reconciliation plan

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase3_terraform_plan.yml"
      - "deploy/runtime-v2/terraform/moved.tf"

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    if: github.repository_id == '1349678672' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_ID: project-38008d5f-4918-46e6-920
      PROJECT_NUMBER: "497412818801"
      REGION: us-central1
      STATE_BUCKET: project-38008d5f-4918-46e6-920-polititrack-tfstate
      WIF_PROVIDER: projects/497412818801/locations/global/workloadIdentityPools/polititrack-github-phase3/providers/phase3-main
      DEPLOYER_SERVICE_ACCOUNT: polititrack-phase3-deployer@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com
      EXISTING_IMAGE: us-central1-docker.pkg.dev/project-38008d5f-4918-46e6-920/polititrack/runtime-v2@sha256:82b691179c422aba5c3ffa205e1a2d548f8cd6e8e9ed8ac2b5df5f7f8c71a565
    steps:
      - name: Check out canonical repository
        uses: actions/checkout@v7

      - name: Authenticate as constrained Phase 3 deployer
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Verify immutable cloud boundary
        shell: bash
        run: |
          set -euo pipefail
          actual_number="$(gcloud projects describe "${PROJECT_ID}" --format='value(projectNumber)')"
          if [[ "${actual_number}" != "${PROJECT_NUMBER}" ]]; then
            echo "Project ID no longer maps to the expected immutable project number." >&2
            exit 1
          fi
          echo "Phase 3 plan boundary verified: ${PROJECT_ID}/${PROJECT_NUMBER}"

      - name: Initialize existing Terraform state
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=deploy/runtime-v2/terraform init -reconfigure \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="prefix=runtime-v2"

      - name: Inventory tracked state
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=deploy/runtime-v2/terraform state list | tee phase3-state-list.txt

      - name: Write configuration-preserving Phase 3 variables
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = {
              "project_id": os.environ["PROJECT_ID"],
              "region": os.environ["REGION"],
              "image": os.environ["EXISTING_IMAGE"],
              "runtime_secrets": {
                  "OPENAI_API_KEY": "polititrack-openai-api-key",
                  "FINNHUB_API_KEY": "polititrack-finnhub-api-key",
                  "ALPHAVANTAGE_API_KEY": "polititrack-alphavantage-api-key",
              },
              "runtime_environment": {
                  "AI_ANALYSIS_ENABLED": "true",
                  "AI_FETCH_DOCUMENT_TEXT": "true",
                  "AI_MAX_ANALYSES_PER_RUN": "20",
                  "AI_OPENAI_MIN_REQUEST_INTERVAL_SECONDS": "65",
                  "AI_PAPER_TRADING_ONLY": "true",
                  "AI_REQUIRE_PUSHOVER": "false",
                  "AI_WEB_SEARCH_ENABLED": "true",
                  "ALLOW_EMPTY_SOURCES": "false",
                  "DASHBOARD_URL": "https://polititrack-web-s6icmprjvq-uc.a.run.app",
                  "DISCLOSURE_TERMS_ACKNOWLEDGED": "TRUE",
                  "INVESTOR_EDGE_ENABLED": "true",
                  "NOTIFY_ALL_FILINGS": "true",
                  "NOTIFY_EQUITY_ONLY": "true",
                  "NOTIFY_PENDING_REVIEWS": "true",
                  "OPENAI_MODEL": "gpt-5.6-terra",
                  "OPENAI_REASONING_EFFORT": "medium",
                  "POLITITRACK_MODE": "shadow",
                  "REQUIRE_PUSHOVER": "false",
                  "SEC_USER_AGENT": "MyETF-Intelligence research contact maglothinm@gmail.com",
                  "SOURCE_REVISION": "c20958f6c22077411d3787bc8aa74c08c0b26fc3",
              },
              "vault_enabled": True,
              "schedules_enabled": False,
              "public_dashboard_enabled": False,
              "dashboard_allowed_origins": "",
              "vault_acknowledged_sources": "",
              "vault_agency_hosts": "",
          }
          Path("deploy/runtime-v2/terraform/phase3-plan.auto.tfvars.json").write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create redacted reconciliation plan
        id: plan
        shell: bash
        run: |
          set +e
          terraform -chdir=deploy/runtime-v2/terraform plan \
            -no-color \
            -detailed-exitcode \
            -lock-timeout=5m \
            > phase3-terraform-plan.txt 2>&1
          status=$?
          set -e
          cat phase3-terraform-plan.txt
          if [[ "$status" -eq 0 ]]; then
            echo "plan_result=no_changes" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -eq 2 ]]; then
            echo "plan_result=changes_present" >> "$GITHUB_OUTPUT"
          else
            echo "plan_result=failed" >> "$GITHUB_OUTPUT"
            exit "$status"
          fi

      - name: Write plan receipt
        shell: bash
        run: |
          set -euo pipefail
          state_sha="$(sha256sum phase3-state-list.txt | awk '{print $1}')"
          plan_sha="$(sha256sum phase3-terraform-plan.txt | awk '{print $1}')"
          cat > phase3-terraform-plan-receipt.txt <<EOF
          schema_version=2
          repository_id=${GITHUB_REPOSITORY_ID}
          repository=${GITHUB_REPOSITORY}
          source_revision=${GITHUB_SHA}
          project_id=${PROJECT_ID}
          project_number=${PROJECT_NUMBER}
          region=${REGION}
          workload_identity_provider=${WIF_PROVIDER}
          service_account=${DEPLOYER_SERVICE_ACCOUNT}
          terraform_mode=plan_only
          plan_result=${{ steps.plan.outputs.plan_result }}
          mode=shadow
          schedules_enabled=false
          public_dashboard_enabled=false
          vault_enabled=true
          runtime_environment_preserved=true
          state_address_moves=true
          runtime_job_execution=false
          state_import=false
          terraform_apply=false
          binary_plan_uploaded=false
          raw_state_uploaded=false
          state_list_sha256=${state_sha}
          redacted_plan_sha256=${plan_sha}
          EOF
          cat phase3-terraform-plan-receipt.txt

      - name: Remove ephemeral variable file
        if: always()
        shell: bash
        run: rm -f deploy/runtime-v2/terraform/phase3-plan.auto.tfvars.json

      - name: Upload redacted plan evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase3-terraform-plan-${{ github.run_id }}
          path: |
            phase3-state-list.txt
            phase3-terraform-plan.txt
            phase3-terraform-plan-receipt.txt
          if-no-files-found: error
          retention-days: 30
