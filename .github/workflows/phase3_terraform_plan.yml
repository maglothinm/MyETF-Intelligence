name: Phase 3 Terraform reconciliation plan

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase3_terraform_plan.yml"
      - "deploy/runtime-v2/phase3-reconciliation.tfvars.json"
      - "deploy/runtime-v2/terraform/moved.tf"

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    if: github.repository_id == '1349678672' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_ID: project-38008d5f-4918-46e6-920
      PROJECT_NUMBER: "497412818801"
      REGION: us-central1
      STATE_BUCKET: project-38008d5f-4918-46e6-920-polititrack-tfstate
      RECONCILIATION_VARS: ../phase3-reconciliation.tfvars.json
      WIF_PROVIDER: projects/497412818801/locations/global/workloadIdentityPools/polititrack-github-phase3/providers/phase3-main
      DEPLOYER_SERVICE_ACCOUNT: polititrack-phase3-deployer@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com
    steps:
      - name: Check out canonical repository
        uses: actions/checkout@v7

      - name: Authenticate as constrained Phase 3 deployer
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Verify immutable cloud boundary
        shell: bash
        run: |
          set -euo pipefail
          actual_number="$(gcloud projects describe "${PROJECT_ID}" --format='value(projectNumber)')"
          if [[ "${actual_number}" != "${PROJECT_NUMBER}" ]]; then
            echo "Project ID no longer maps to the expected immutable project number." >&2
            exit 1
          fi
          echo "Phase 3 plan boundary verified: ${PROJECT_ID}/${PROJECT_NUMBER}"

      - name: Initialize existing Terraform state
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=deploy/runtime-v2/terraform init -reconfigure -lockfile=readonly \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="prefix=runtime-v2"

      - name: Inventory tracked state
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=deploy/runtime-v2/terraform state list | tee phase3-state-list.txt

      - name: Create redacted reconciliation plan
        id: plan
        shell: bash
        run: |
          set +e
          terraform -chdir=deploy/runtime-v2/terraform plan \
            -no-color \
            -detailed-exitcode \
            -lock-timeout=5m \
            -var-file="${RECONCILIATION_VARS}" \
            > phase3-terraform-plan.txt 2>&1
          status=$?
          set -e
          cat phase3-terraform-plan.txt
          if [[ "$status" -eq 0 ]]; then
            echo "plan_result=no_changes" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -eq 2 ]]; then
            echo "plan_result=changes_present" >> "$GITHUB_OUTPUT"
          else
            echo "plan_result=failed" >> "$GITHUB_OUTPUT"
            exit "$status"
          fi

      - name: Write plan receipt
        shell: bash
        run: |
          set -euo pipefail
          state_sha="$(sha256sum phase3-state-list.txt | awk '{print $1}')"
          plan_sha="$(sha256sum phase3-terraform-plan.txt | awk '{print $1}')"
          config_sha="$(sha256sum deploy/runtime-v2/phase3-reconciliation.tfvars.json | awk '{print $1}')"
          lock_sha="$(sha256sum deploy/runtime-v2/terraform/.terraform.lock.hcl | awk '{print $1}')"
          moved_sha="$(sha256sum deploy/runtime-v2/terraform/moved.tf | awk '{print $1}')"
          cat > phase3-terraform-plan-receipt.txt <<EOF
          schema_version=3
          repository_id=${GITHUB_REPOSITORY_ID}
          repository=${GITHUB_REPOSITORY}
          source_revision=${GITHUB_SHA}
          project_id=${PROJECT_ID}
          project_number=${PROJECT_NUMBER}
          region=${REGION}
          workload_identity_provider=${WIF_PROVIDER}
          service_account=${DEPLOYER_SERVICE_ACCOUNT}
          terraform_mode=plan_only
          plan_result=${{ steps.plan.outputs.plan_result }}
          mode=shadow
          schedules_enabled=false
          public_dashboard_enabled=false
          vault_enabled=true
          runtime_environment_preserved=true
          state_address_moves=true
          runtime_job_execution=false
          state_import=false
          terraform_apply=false
          binary_plan_uploaded=false
          raw_state_uploaded=false
          reconciliation_config_sha256=${config_sha}
          terraform_lock_sha256=${lock_sha}
          moved_tf_sha256=${moved_sha}
          state_list_sha256=${state_sha}
          redacted_plan_sha256=${plan_sha}
          EOF
          cat phase3-terraform-plan-receipt.txt

      - name: Upload redacted plan evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase3-terraform-plan-${{ github.run_id }}
          path: |
            phase3-state-list.txt
            phase3-terraform-plan.txt
            phase3-terraform-plan-receipt.txt
          if-no-files-found: error
          retention-days: 30
