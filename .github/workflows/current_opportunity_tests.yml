name: Current Opportunity offline tests

on:
  pull_request:
    paths:
      - "scripts/opportunity_*.py"
      - "scripts/ai_filing_analyst*.py"
      - "scripts/build_trade_dashboard.py"
      - "scripts/dashboard_assets/**"
      - "runtime_v2/**"
      - "config/opportunity_rules.yml"
      - "schemas/opportunity*.json"
      - "requirements-ai.txt"
      - "tests/*opportunity*"
      - ".github/workflows/current_opportunity_tests.yml"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-runtime-v2.txt pytest==8.4.2
          npm install --prefix .test-tools --no-save --package-lock=false --ignore-scripts --no-audit --no-fund jsdom@26.1.0 axe-core@4.10.3
      - name: Deterministic feature and regression tests
        run: |
          python -m pytest -q tests/test_opportunity_*.py tests/test_ai_filing_analyst.py tests/test_ai_filing_analyst_hardened.py tests/test_investor_edge.py tests/test_investor_edge_core.py tests/test_investor_edge_surfaces.py tests/test_trade_dashboard.py tests/test_dashboard_insights.py tests/test_runtime_v2.py tests/test_runtime_v2_atomic_commit.py tests/test_runtime_v2_shadow_mode.py tests/test_validate_ai_publication.py --junitxml=test-results.xml
      - name: Build TEST replay and verify dashboard DOM
        env:
          POLITITRACK_TEST_NODE_MODULES: ${{ github.workspace }}/.test-tools/node_modules
          OPPORTUNITY_FIXTURE_JSON: ${{ github.workspace }}/test-output/dashboard/data/current-opportunities.json
        run: |
          python tests/opportunity_shadow_fixture.py --output test-output
          node --test tests/opportunity_dom.test.cjs
      - name: Retain isolated review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-opportunity-TEST-python-${{ matrix.python }}
          path: |
            test-results.xml
            test-output/
          retention-days: 14
          if-no-files-found: error
