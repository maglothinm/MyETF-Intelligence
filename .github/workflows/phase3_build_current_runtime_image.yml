name: Phase 3 build current Runtime image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase3_build_current_runtime_image.yml"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: github.repository_id == '1349678672' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: project-38008d5f-4918-46e6-920
      PROJECT_NUMBER: "497412818801"
      REGION: us-central1
      REPOSITORY: polititrack
      IMAGE_NAME: runtime-v2
      CLOUD_BUILD_BUCKET: project-38008d5f-4918-46e6-920_cloudbuild
      WIF_PROVIDER: projects/497412818801/locations/global/workloadIdentityPools/polititrack-github-phase3/providers/phase3-main
      DEPLOYER_SERVICE_ACCOUNT: polititrack-phase3-deployer@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com
      BUILDER_SERVICE_ACCOUNT: polititrack-phase3-builder@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com
      CURRENT_DEPLOYED_DIGEST: sha256:82b691179c422aba5c3ffa205e1a2d548f8cd6e8e9ed8ac2b5df5f7f8c71a565
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v7

      - name: Authenticate as constrained Phase 3 deployer
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Reconcile builder Cloud Build bucket metadata access
        shell: bash
        run: |
          set -euo pipefail
          actual_number="$(gcloud projects describe "${PROJECT_ID}" --format='value(projectNumber)')"
          [[ "${actual_number}" == "${PROJECT_NUMBER}" ]] || { echo "Immutable project boundary mismatch." >&2; exit 1; }
          gcloud storage buckets add-iam-policy-binding "gs://${CLOUD_BUILD_BUCKET}" \
            --member "serviceAccount:${BUILDER_SERVICE_ACCOUNT}" \
            --role roles/storage.bucketViewer \
            --quiet >/dev/null

      - name: Authenticate as isolated Phase 3 builder
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.BUILDER_SERVICE_ACCOUNT }}

      - name: Build and resolve immutable image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase3-image-build

          actual_number="$(gcloud projects describe "${PROJECT_ID}" --format='value(projectNumber)')"
          [[ "${actual_number}" == "${PROJECT_NUMBER}" ]] || { echo "Immutable project boundary mismatch." >&2; exit 1; }

          python - <<'PY'
          from pathlib import Path
          text = Path('runtime_v2/database.py').read_text(encoding='utf-8')
          required = (
              'def _use_private_ip',
              'IPTypes.PRIVATE if _use_private_ip(config) else IPTypes.PUBLIC',
          )
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit('Current source lacks private Cloud SQL routing: ' + ', '.join(missing))
          PY

          tag="${GITHUB_SHA:0:12}"
          tagged_image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${tag}"
          gcloud builds submit . \
            --project "${PROJECT_ID}" \
            --config deploy/runtime-v2/cloudbuild.yaml \
            --substitutions "_REGION=${REGION},_REPOSITORY=${REPOSITORY},_IMAGE=${IMAGE_NAME},_TAG=${tag}" \
            --quiet \
            --format=json > phase3-image-build/cloud-build.json

          digest="$(gcloud artifacts docker images describe "${tagged_image}" --project "${PROJECT_ID}" --format='value(image_summary.digest)')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Cloud Build did not produce a resolvable immutable digest." >&2; exit 1; }
          [[ "${digest}" != "${CURRENT_DEPLOYED_DIGEST}" ]] || { echo "Fresh build unexpectedly resolved to the stale deployed digest." >&2; exit 1; }

          immutable_image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}@${digest}"
          database_sha="$(sha256sum runtime_v2/database.py | awk '{print $1}')"
          dockerfile_sha="$(sha256sum deploy/runtime-v2/Dockerfile | awk '{print $1}')"
          requirements_sha="$(sha256sum requirements-runtime-v2.txt | awk '{print $1}')"

          jq -n \
            --arg repository_id "${GITHUB_REPOSITORY_ID}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg source_revision "${GITHUB_SHA}" \
            --arg project_id "${PROJECT_ID}" \
            --arg project_number "${PROJECT_NUMBER}" \
            --arg image "${immutable_image}" \
            --arg digest "${digest}" \
            --arg database_sha256 "${database_sha}" \
            --arg dockerfile_sha256 "${dockerfile_sha}" \
            --arg requirements_sha256 "${requirements_sha}" \
            '{
              result: "phase3_current_runtime_image_built",
              repository_id: ($repository_id | tonumber),
              repository: $repository,
              source_revision: $source_revision,
              project_id: $project_id,
              project_number: ($project_number | tonumber),
              immutable_image: $image,
              image_digest: $digest,
              database_sha256: $database_sha256,
              dockerfile_sha256: $dockerfile_sha256,
              requirements_sha256: $requirements_sha256,
              builder_bucket_metadata_access: "roles/storage.bucketViewer",
              deployed: false,
              runtime_job_execution: false,
              scheduler_execution: false,
              production_authority_transferred: false,
              phase4_started: false
            }' > phase3-image-build/build-receipt.json
          cat phase3-image-build/build-receipt.json

      - name: Upload immutable image receipt
        uses: actions/upload-artifact@v6
        with:
          name: phase3-current-runtime-image
          path: |
            phase3-image-build/build-receipt.json
            phase3-image-build/cloud-build.json
          if-no-files-found: error
          retention-days: 90
