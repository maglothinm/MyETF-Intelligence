name: PR154 isolated integration inspection

on:
  push:
    branches: [integration/pr154-20260919]
    paths:
      - .github/workflows/pr154_integration_check.yml
      - integration-evidence/reconcile_pr154.py

permissions:
  contents: write

concurrency:
  group: pr154-isolated-integration-inspection
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository_id == '1349678672' && github.ref == 'refs/heads/integration/pr154-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare isolated merge tooling
        run: |
          python -m pip install PyYAML
          python -m py_compile integration-evidence/reconcile_pr154.py
      - name: Reconcile only the inspected conflicts and safety boundaries
        run: python integration-evidence/reconcile_pr154.py resolve
      - name: Install merged-source test dependencies
        run: |
          python -m pip install -r "$RUNNER_TEMP/pr154-reconciled/requirements-runtime-v2.txt" pytest==8.4.2
          npm install --prefix .test-tools --no-save --package-lock=false --ignore-scripts --no-audit --no-fund jsdom@26.1.0 axe-core@4.10.3
      - name: Run deterministic integration, regression and DOM tests
        run: python integration-evidence/reconcile_pr154.py test
      - name: Record evidence and create an unreferenced tested candidate only
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python integration-evidence/reconcile_pr154.py publish
      - name: Retain isolated TEST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr154-integration-TEST-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pr154-manifest.json
            ${{ runner.temp }}/pr154-tests.json
            ${{ runner.temp }}/pr154-tests.xml
            ${{ runner.temp }}/pr154-validation.log
            ${{ runner.temp }}/pr154-TEST-fixture/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
