name: PR154 isolated integration inspection

on:
  push:
    branches: [integration/pr154-20260919]
    paths:
      - .github/workflows/pr154_integration_check.yml
      - integration-evidence/reconcile_pr154.py

permissions:
  contents: write
  actions: read

concurrency:
  group: pr154-isolated-integration-inspection
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository_id == '1349678672' && github.ref == 'refs/heads/integration/pr154-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare isolated merge tooling
        run: |
          python -m pip install PyYAML
          python -m py_compile integration-evidence/reconcile_pr154.py
      - name: Reconcile only the inspected conflicts and safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          python integration-evidence/reconcile_pr154.py resolve 2>&1 | tee "$RUNNER_TEMP/pr154-resolution.log"
      - name: Install merged-source test dependencies
        run: |
          python -m pip install -r "$RUNNER_TEMP/pr154-reconciled/requirements-runtime-v2.txt" pytest==8.4.2
          npm install --prefix .test-tools --no-save --package-lock=false --ignore-scripts --no-audit --no-fund jsdom@26.1.0 axe-core@4.10.3
      - name: Run deterministic integration, regression and DOM tests
        run: python integration-evidence/reconcile_pr154.py test
      - name: Retain reconciliation log and read workflow activation state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'integration-evidence')
          import reconcile_pr154 as helper
          log = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr154-resolution.log'
          if log.is_file():
              helper.put_evidence('integration-evidence/resolution.log', log.read_text())
          workflows = helper.api('actions/workflows?per_page=100')
          result = {'run_id': os.environ['GITHUB_RUN_ID'], 'total_count': workflows['total_count'], 'workflows': [{k: w[k] for k in ('id', 'name', 'path', 'state')} for w in workflows['workflows']]}
          assert len(result['workflows']) == result['total_count']
          helper.put_evidence('integration-evidence/workflow-states.json', json.dumps(result, indent=2) + '\n')
          PY
      - name: Record evidence and create an unreferenced tested candidate only
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python integration-evidence/reconcile_pr154.py publish
      - name: Retain isolated TEST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr154-integration-TEST-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pr154-manifest.json
            ${{ runner.temp }}/pr154-tests.json
            ${{ runner.temp }}/pr154-tests.xml
            ${{ runner.temp }}/pr154-validation.log
            ${{ runner.temp }}/pr154-resolution.log
            ${{ runner.temp }}/pr154-TEST-fixture/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
