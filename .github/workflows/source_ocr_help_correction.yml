name: OCR health help compatibility correction
on:
  push:
    branches: [codex/source-upload-ocr-20260917]
    paths: [.github/workflows/source_ocr_help_correction.yml]
permissions:
  contents: write
jobs:
  correction:
    if: github.repository_id == '1349678672' && github.ref == 'refs/heads/codex/source-upload-ocr-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/source-upload-ocr-20260917
          fetch-depth: 0
      - name: Apply exact source-only wording correction
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9aece5983c577e8c73933f333360058335cf61c7 HEAD
          python - <<'PY'
          import pathlib,hashlib
          path=pathlib.Path('scripts/dashboard_assets/common.js')
          data=path.read_bytes()
          assert hashlib.sha256(data).hexdigest()=='c1dfbe883736d3714a6d5d7ba19113dd49de81732e9383fc5f63ebd73a8e32a1'
          old=b'All required PolitiTrack collectors, the AI analyst and enabled OCR stages have confirmed healthy outcomes within their freshness windows.'
          new=b'All required PolitiTrack collectors, the AI analyst and enabled OCR stages have completed successfully within their freshness windows; OCR also requires confirmed state commit and temporary-file cleanup.'
          assert data.count(old)==1
          data=data.replace(old,new)
          assert hashlib.sha256(data).hexdigest()=='30965891450b8dfda8002f1649118500591f4eaa720127fe5c1de4ec6061323b'
          path.write_bytes(data)
          PY
          node --check scripts/dashboard_assets/common.js
          node --test tests/source_ocr_health.test.cjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/dashboard_assets/common.js
          git commit -m 'fix(ocr): preserve shared status-help wording while requiring OCR commit and cleanup'
          git push origin HEAD:refs/heads/codex/source-upload-ocr-20260917
