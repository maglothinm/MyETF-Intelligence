name: Validate Runtime v2 natural AI helper context

on:
  push:
    branches:
      - fix/natural-ai-certification-context
    paths:
      - ".github/workflows/runtime_v2_natural_ai_context_lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository_id == '1349678672'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/natural-ai-certification-context
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install PyYAML==6.0.3 pytest==9.0.2
      - name: Parse corrected workflow and executable blocks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          import yaml

          path = Path('.github/workflows/runtime_v2_natural_ai_certification.yml')
          text = path.read_text(encoding='utf-8')
          workflow = yaml.safe_load(text)
          job = (workflow.get('jobs') or {}).get('certify') or {}
          env = job.get('env') or {}
          if 'github.sha' not in str(env.get('CONTROL_REVISION') or ''):
              raise SystemExit('Natural certification lacks CONTROL_REVISION binding')
          if env.get('PRIVATE_WEB_AUDIENCE') != 'https://polititrack-web-497412818801.us-central1.run.app':
              raise SystemExit('Natural certification lacks the exact private web audience')
          scripts = []
          python_blocks = []
          for step in job.get('steps', []):
              script = step.get('run')
              if not isinstance(script, str):
                  continue
              scripts.append((step.get('name', '<unnamed>'), script))
              lines = script.splitlines()
              index = 0
              while index < len(lines):
                  if "<<'PY'" not in lines[index]:
                      index += 1
                      continue
                  start = index + 1
                  end = start
                  while end < len(lines) and lines[end] != 'PY':
                      end += 1
                  if end == len(lines):
                      raise SystemExit(f'Unclosed Python heredoc in {step.get("name")}')
                  python_blocks.append((step.get('name', '<unnamed>'), '\n'.join(lines[start:end]) + '\n'))
                  index = end + 1
          for index, (name, script) in enumerate(scripts, 1):
              with tempfile.NamedTemporaryFile('w', suffix='.sh', delete=False) as handle:
                  handle.write(script)
                  script_path = handle.name
              result = subprocess.run(['bash', '-n', script_path], text=True, capture_output=True)
              if result.returncode:
                  raise SystemExit(f'Bash syntax failure in step {index} {name}: {result.stderr}')
          for index, (name, source) in enumerate(python_blocks, 1):
              compile(source, f'<{name}:{index}>', 'exec')
          if text.count('verify_execution_authority_removed || status=1') != 1:
              raise SystemExit('Execution-authority verification is not confined to attempted cleanup')
          marker = text.index('if [[ -f "${EVIDENCE_DIR}/execution-authority-attempted" ]]')
          verifier = text.index('verify_execution_authority_removed || status=1')
          closing = text.index('fi', marker)
          if not (marker < verifier < closing):
              raise SystemExit('Execution-authority verification is outside its attempt guard')
          print(f'Validated {len(scripts)} Bash scripts and {len(python_blocks)} Python blocks')
          PY
      - name: Run existing Runtime v2 and Phase 5 safety tests
        run: |
          python -m pytest -q \
            tests/test_runtime_v2_scheduler_concurrency.py \
            tests/test_phase5_failed_promotion_retry.py \
            tests/test_phase5_scheduler_resume_receipt.py \
            tests/test_phase5_retry_workflow_failure_safety.py
      - name: Verify repository safety contract
        run: bash verify.sh
