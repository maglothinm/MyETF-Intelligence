name: Phase 3 schema convergence closeout safety tests

on:
  pull_request:
    paths:
      - ".github/workflows/phase3_converge_schema_and_close.yml"
      - ".github/workflows/phase3_schema_converge_closeout_tests.yml"
      - "deploy/runtime-v2/converge-phase3-schema-and-close.sh"
      - "deploy/runtime-v2/gcs_status_probe.py"
      - "tests/test_phase3_schema_converge_closeout.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Parse probe and shell
        run: |
          python -m py_compile deploy/runtime-v2/gcs_status_probe.py
          bash -n deploy/runtime-v2/converge-phase3-schema-and-close.sh
      - name: Install pytest
        run: python -m pip install "pytest>=8.3,<9"
      - name: Run focused safety tests
        run: python -m pytest -q tests/test_phase3_schema_converge_closeout.py
