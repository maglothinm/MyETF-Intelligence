name: Phase 3 private-IP repair safety tests

on:
  pull_request:
    paths:
      - ".github/workflows/phase3_repair_private_ip_and_accept.yml"
      - ".github/workflows/phase3_repair_private_ip_tests.yml"
      - "tests/test_phase3_repair_private_ip_and_accept.py"
      - "deploy/runtime-v2/validate_phase3_status.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime-v2.txt
      - name: Install Runtime v2 dependencies
        run: python -m pip install --requirement requirements-runtime-v2.txt
      - name: Compile Runtime v2 package
        run: python -m compileall -q runtime_v2
      - name: Run private-IP repair safety tests
        run: python -m pytest -q tests/test_phase3_repair_private_ip_and_accept.py tests/test_phase3_current_state_acceptance.py tests/test_phase3_harvest_current_status.py
      - name: Verify repository safety contract
        run: bash verify.sh
