name: One-time production cutover acceptance

on:
  # Removed immediately after the verified cutover sequence completes.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cutover_production_acceptance.yml"

permissions:
  actions: write
  contents: read

jobs:
  verify-production-chain:
    name: Verify canonical production chain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Dispatch and verify exact canonical workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_REPOSITORY_ID: "1349678672"
        run: |
          set -euo pipefail

          repository_id="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}" \
              --jq '.id'
          )"
          if [[ "$repository_id" != "$EXPECTED_REPOSITORY_ID" ]]; then
            echo "Repository identity mismatch: ${repository_id}; refusing acceptance." >&2
            exit 1
          fi

          expected_sha="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" \
              --jq '.object.sha'
          )"
          if [[ "$expected_sha" != "$GITHUB_SHA" ]]; then
            echo "Acceptance commit ${GITHUB_SHA} is not live ${DEFAULT_BRANCH} head ${expected_sha}." >&2
            exit 1
          fi

          dispatch_and_wait() {
            local workflow_file="$1"
            local workflow_name="$2"
            local dispatched_after run_id payload status conclusion

            dispatched_after="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/dispatches" \
              -f "ref=${DEFAULT_BRANCH}" \
              >/dev/null

            run_id=""
            for _ in {1..30}; do
              run_id="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?event=workflow_dispatch&branch=${DEFAULT_BRANCH}&per_page=30" \
                  --jq ".workflow_runs
                    | map(select(
                        .name == \"${workflow_name}\"
                        and .head_sha == \"${expected_sha}\"
                        and .created_at >= \"${dispatched_after}\"
                      ))
                    | sort_by(.id)
                    | last
                    | .id // empty"
              )"
              [[ -n "$run_id" ]] && break
              sleep 2
            done
            if [[ -z "$run_id" ]]; then
              echo "No workflow_dispatch run appeared for ${workflow_name}." >&2
              exit 1
            fi

            for _ in {1..180}; do
              payload="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
              )"
              status="$(jq -r '.status' <<< "$payload")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$payload")"
              [[ "$status" == "completed" ]] && break
              sleep 10
            done
            if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
              echo "${workflow_name} run ${run_id} ended ${status}/${conclusion}." >&2
              exit 1
            fi

            echo "${workflow_name}: run ${run_id} succeeded at ${expected_sha}."
            echo "- ${workflow_name}: [run ${run_id}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}) — success" >> "$GITHUB_STEP_SUMMARY"
          }

          dispatch_and_wait \
            legislative_trade_tracker_v2.yml \
            "Legislative purchase tracker v2"
          dispatch_and_wait \
            executive_trade_tracker.yml \
            "Executive purchase tracker"
          dispatch_and_wait \
            ai_filing_analyst.yml \
            "AI filing analyst and paper portfolio"
          dispatch_and_wait \
            publish_trade_dashboard.yml \
            "Publish government trade dashboard"
