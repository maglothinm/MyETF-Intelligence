name: Validate Runtime v2 scheduler reactivation rollback arming

on:
  push:
    branches:
      - fix/reactivate-runtime-v2-schedulers-v3
    paths:
      - ".github/workflows/runtime_v2_scheduler_reactivation_v3_lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository_id == '1349678672'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/reactivate-runtime-v2-schedulers-v3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install PyYAML==6.0.3 pytest==9.0.2
      - name: Parse workflow and verify rollback arming
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          import yaml

          path = Path('.github/workflows/runtime_v2_scheduler_reactivation.yml')
          text = path.read_text(encoding='utf-8')
          workflow = yaml.safe_load(text)
          if not isinstance(workflow, dict) or 'jobs' not in workflow:
              raise SystemExit('Scheduler reactivation is not valid workflow YAML')
          permissions = workflow.get('permissions') or {}
          if permissions.get('actions') != 'read':
              raise SystemExit('Scheduler reactivation lacks Actions read permission')
          job = workflow['jobs'].get('reactivate') or {}
          token_binding = str((job.get('env') or {}).get('GH_TOKEN') or '')
          if 'github.token' not in token_binding:
              raise SystemExit('Scheduler reactivation lacks GH_TOKEN binding')
          marker = text.index('touch "${EVIDENCE_DIR}/live-mutation-started"')
          grant = text.index('phase5_retry_grant_scheduler_control')
          if marker >= grant:
              raise SystemExit('Live-mutation marker does not precede JIT Scheduler control')
          required = (
              'phase5_retry_remove_scheduler_control || status=1',
              'phase5_retry_verify_scheduler_control_removed || status=1',
              'phase5_retry_remove_role_viewer || status=1',
              'phase5_retry_verify_role_viewer_removed || status=1',
          )
          for value in required:
              if value not in text:
                  raise SystemExit('Cleanup is missing: ' + value)
          scripts = []
          for step in job.get('steps', []):
              script = step.get('run')
              if isinstance(script, str):
                  scripts.append((step.get('name', '<unnamed>'), script))
          for index, (name, script) in enumerate(scripts, 1):
              with tempfile.NamedTemporaryFile('w', suffix='.sh', delete=False) as handle:
                  handle.write(script)
                  script_path = handle.name
              result = subprocess.run(['bash', '-n', script_path], text=True, capture_output=True)
              if result.returncode:
                  raise SystemExit(f'Bash syntax failure in step {index} {name}: {result.stderr}')
          print(f'Validated {len(scripts)} embedded Bash scripts and JIT rollback arming')
          PY
      - name: Run existing Scheduler activation safety tests
        run: |
          python -m pytest -q \
            tests/test_phase5_failed_promotion_retry.py \
            tests/test_phase5_scheduler_resume_receipt.py \
            tests/test_phase5_retry_workflow_failure_safety.py
      - name: Verify repository safety contract
        run: bash verify.sh
