name: Phase 3 converge schema and close

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase3_converge_schema_and_close.yml"
      - "deploy/runtime-v2/converge-phase3-schema-and-close.sh"
      - "deploy/runtime-v2/gcs_status_probe.py"

concurrency:
  group: phase3-converge-schema-and-close
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  converge-and-close:
    if: github.repository_id == '1349678672' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROJECT_ID: project-38008d5f-4918-46e6-920
      PROJECT_NUMBER: "497412818801"
      REGION: us-central1
      STATE_BUCKET: project-38008d5f-4918-46e6-920-polititrack-tfstate
      WIF_PROVIDER: projects/497412818801/locations/global/workloadIdentityPools/polititrack-github-phase3/providers/phase3-main
      DEPLOYER_SERVICE_ACCOUNT: polititrack-phase3-deployer@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com
      ADMIN_JOB: polititrack-admin
      ADMIN_SERVICE_ACCOUNT: polititrack-admin-v2@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com
      WEB_SERVICE: polititrack-web
      SQL_INSTANCE: polititrack-runtime-v2
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Authenticate as constrained Phase 3 deployer
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Apply additive schema migration and close Phase 3
        shell: bash
        run: bash deploy/runtime-v2/converge-phase3-schema-and-close.sh

      - name: Upload schema and closeout evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase3-schema-convergence-closeout
          path: |
            ${{ runner.temp }}/phase3-schema-converge-${{ github.run_id }}/schema-probe.json
            ${{ runner.temp }}/phase3-schema-converge-${{ github.run_id }}/execute-error.txt
            ${{ runner.temp }}/phase3-closeout-gcs-v2-${{ github.run_id }}/probe.json
            ${{ runner.temp }}/phase3-closeout-gcs-v2-${{ github.run_id }}/status.json
            ${{ runner.temp }}/phase3-closeout-gcs-v2-${{ github.run_id }}/status-execution.json
            ${{ runner.temp }}/phase3-closeout-gcs-v2-${{ github.run_id }}/phase3-acceptance.json
            ${{ runner.temp }}/phase3-closeout-gcs-v2-${{ github.run_id }}/phase3-acceptance.sha256
          if-no-files-found: warn
          retention-days: 90
