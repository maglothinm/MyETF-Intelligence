name: Apply Runtime v2 scheduler concurrency repair

on:
  push:
    branches:
      - fix/runtime-v2-scheduler-concurrency
    paths:
      - .github/workflows/runtime_v2_concurrency_repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-v2-scheduler-concurrency-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository_id == '1349678672'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUNTIME_V2_TEST_POSTGRES: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: runtime-v2-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: fix/runtime-v2-scheduler-concurrency

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime-v2.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Install Runtime v2 dependencies
        run: python -m pip install --requirement requirements-runtime-v2.txt

      - name: Apply audited repair
        run: python scripts/apply_runtime_v2_scheduler_repair.py

      - name: Normalize Terraform
        run: terraform -chdir=deploy/runtime-v2/terraform fmt

      - name: Compile Runtime v2 package
        run: python -m compileall -q runtime_v2

      - name: Run scheduler concurrency regression tests
        run: python -m pytest -q tests/test_runtime_v2_scheduler_concurrency.py

      - name: Run Runtime v2 package tests
        run: python -m pytest -q tests/test_runtime_v2*.py

      - name: Initialize and validate Terraform
        run: |
          terraform -chdir=deploy/runtime-v2/terraform init -backend=false -lockfile=readonly
          terraform -chdir=deploy/runtime-v2/terraform validate

      - name: Remove temporary repair controls
        run: |
          rm -f scripts/apply_runtime_v2_scheduler_repair.py
          rm -f .github/workflows/runtime_v2_concurrency_repair.yml

      - name: Verify repository safety contract
        shell: bash
        run: bash verify.sh

      - name: Check patch hygiene
        shell: bash
        run: |
          git add -N tests/test_runtime_v2_scheduler_concurrency.py
          git diff --check
          git status --short

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime_v2/store.py runtime_v2/cli.py \
            deploy/runtime-v2/terraform/main.tf \
            tests/test_runtime_v2_scheduler_concurrency.py \
            .github/workflows/runtime_v2_tests.yml \
            scripts/apply_runtime_v2_scheduler_repair.py \
            .github/workflows/runtime_v2_concurrency_repair.yml
          git diff --cached --check
          git commit -m "Fix Runtime v2 scheduler concurrency"
          git push origin HEAD:fix/runtime-v2-scheduler-concurrency
