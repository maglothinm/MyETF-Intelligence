name: Phase 3 converge readiness

on:
  pull_request:
    paths:
      - ".github/workflows/phase3_converge_readiness.yml"
      - "deploy/runtime-v2/converge-phase3-readiness.sh"
      - "tests/test_phase3_converge_readiness.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase3_converge_readiness.yml"

concurrency:
  group: phase3-readiness-convergence
  cancel-in-progress: false

jobs:
  static-safety:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Parse convergence controller
        run: bash -n deploy/runtime-v2/converge-phase3-readiness.sh
      - name: Run convergence safety tests
        run: python -m pytest -q tests/test_phase3_converge_readiness.py

  converge:
    if: github.event_name == 'push' && github.repository_id == '1349678672' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      PROJECT_ID: project-38008d5f-4918-46e6-920
      PROJECT_NUMBER: "497412818801"
      REGION: us-central1
      STATE_BUCKET: project-38008d5f-4918-46e6-920-polititrack-tfstate
      WIF_PROVIDER: projects/497412818801/locations/global/workloadIdentityPools/polititrack-github-phase3/providers/phase3-main
      DEPLOYER_SERVICE_ACCOUNT: polititrack-phase3-deployer@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com
      ADMIN_JOB: polititrack-admin
      WEB_SERVICE: polititrack-web
      SQL_INSTANCE: polititrack-runtime-v2
      LOG_BUCKET: _Default
      LOG_VIEW: _Default
      LOG_LOCATION: global
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v7

      - name: Authenticate as constrained Phase 3 deployer
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Converge and validate Phase 3 readiness
        run: bash deploy/runtime-v2/converge-phase3-readiness.sh

      - name: Create immutable Phase 4 readiness tag
        shell: bash
        run: |
          set -euo pipefail
          target="$(git ls-remote origin refs/tags/phase3-ready | awk '{print $1}')"
          if [[ -n "${target}" ]]; then
            [[ "${target}" == "${GITHUB_SHA}" ]] || {
              echo "Existing phase3-ready tag points to ${target}, not ${GITHUB_SHA}." >&2
              exit 1
            }
          else
            git tag phase3-ready "${GITHUB_SHA}"
            git push origin refs/tags/phase3-ready
          fi

      - name: Upload immutable Phase 3 readiness evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase3-converged-readiness
          path: |
            ${{ runner.temp }}/polititrack-phase3-converge-${{ github.run_id }}/phase3-acceptance.json
            ${{ runner.temp }}/polititrack-phase3-converge-${{ github.run_id }}/phase3-acceptance.sha256
            ${{ runner.temp }}/polititrack-phase3-converge-${{ github.run_id }}/phase4-ready.txt
            ${{ runner.temp }}/polititrack-phase3-converge-${{ github.run_id }}/status.json
            ${{ runner.temp }}/polititrack-phase3-converge-${{ github.run_id }}/status-execution.json
            ${{ runner.temp }}/polititrack-phase3-converge-${{ github.run_id }}/private-ip-reconciliation.txt
          if-no-files-found: warn
          retention-days: 90
