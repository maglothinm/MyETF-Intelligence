name: AI filing analyst and paper portfolio

on:
  workflow_dispatch:
    inputs:
      reanalyze_existing:
        description: "Reanalyze the newest already-processed purchases with the current model and rules"
        required: false
        default: false
        type: boolean
      suppress_alerts:
        description: "Write analyses and paper positions without sending candidate Pushover alerts"
        required: false
        default: false
        type: boolean
      max_analyses:
        description: "Maximum purchases to analyze in this run"
        required: false
        default: "20"
        type: string
  workflow_run:
    workflows:
      - Legislative purchase tracker
      - Executive purchase tracker
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: ai-filing-analyst
  cancel-in-progress: false

env:
  AI_DIR: ".trade-tracker/ai"
  AI_ANALYSIS_ENABLED: ${{ vars.AI_ANALYSIS_ENABLED || 'false' }}
  AI_PAPER_TRADING_ONLY: "true"
  AI_WEB_SEARCH_ENABLED: ${{ vars.AI_WEB_SEARCH_ENABLED || 'true' }}
  AI_FETCH_DOCUMENT_TEXT: ${{ vars.AI_FETCH_DOCUMENT_TEXT || 'true' }}
  AI_MAX_ANALYSES_PER_RUN: ${{ vars.AI_MAX_ANALYSES_PER_RUN || '20' }}
  AI_OPENAI_MIN_REQUEST_INTERVAL_SECONDS: ${{ vars.AI_OPENAI_MIN_REQUEST_INTERVAL_SECONDS || '65' }}
  AI_REQUIRE_PUSHOVER: ${{ vars.AI_REQUIRE_PUSHOVER || 'true' }}
  OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
  OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'medium' }}
  SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
  ALPHAVANTAGE_ENTITLEMENT: ${{ vars.ALPHAVANTAGE_ENTITLEMENT }}
  DASHBOARD_URL: ${{ vars.DASHBOARD_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

jobs:
  analyze:
    if: >-
      vars.AI_ANALYSIS_ENABLED == 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch &&
          (
            github.event.workflow_run.event == 'schedule' ||
            github.event.workflow_run.event == 'workflow_dispatch'
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Signal analyst start
        continue-on-error: true
        shell: bash
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.AI_HEALTHCHECKS_PING_URL }}
        run: |
          if [[ -n "$HEALTHCHECKS_PING_URL" ]]; then
            curl --fail --silent --show-error --max-time 20 --retry 3 \
              "${HEALTHCHECKS_PING_URL%/}/start" >/dev/null
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ai.txt
            requirements-tracker.txt

      - name: Install document-processing dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils tesseract-ocr

      - name: Install tracker and analyst dependencies
        shell: bash
        run: python -m pip install --requirement requirements-ai.txt pytest==9.0.2

      - name: Restore latest Legislative and Executive tracker artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tracker-input

          restore_tracker_artifact() {
            local branch="$1"
            local artifact_name="$2"
            local artifact_id
            artifact_id="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" \
                --jq '[.artifacts[] | select(.expired == false)] | max_by(.created_at) | .id // empty'
            )"
            if [[ -z "$artifact_id" ]]; then
              echo "No unexpired ${artifact_name} artifact is available." >&2
              exit 1
            fi
            local temp_dir
            temp_dir="$(mktemp -d)"
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              > "${temp_dir}/state.zip"
            mkdir -p "${temp_dir}/unpacked"
            unzip -q "${temp_dir}/state.zip" -d "${temp_dir}/unpacked"
            local state_file
            state_file="$(find "${temp_dir}/unpacked" -type f -name state.json -print -quit)"
            if [[ -z "$state_file" ]]; then
              echo "Artifact ${artifact_id} (${artifact_name}) contains no state.json." >&2
              exit 1
            fi
            mkdir -p "tracker-input/${branch}"
            cp -R "$(dirname "$state_file")/." "tracker-input/${branch}/"
            echo "Restored ${branch} tracker artifact ${artifact_id}."
          }

          restore_tracker_artifact legislative legislative-tracker-state
          restore_tracker_artifact executive executive-tracker-state

      - name: Restore AI state cache
        uses: actions/cache/restore@v5
        with:
          path: .trade-tracker/ai
          key: ai-analysis-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ai-analysis-${{ runner.os }}-

      - name: Restore durable AI artifact when cache is unavailable
        if: ${{ hashFiles('.trade-tracker/ai/state.json') == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=ai-analysis-state&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | max_by(.created_at) | .id // empty'
          )"
          if [[ -z "$artifact_id" ]]; then
            echo "No prior ai-analysis-state artifact is available; creating first AI state."
            exit 0
          fi
          temp_dir="$(mktemp -d)"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "$temp_dir/state.zip"
          mkdir -p "$temp_dir/unpacked"
          unzip -q "$temp_dir/state.zip" -d "$temp_dir/unpacked"
          state_file="$(find "$temp_dir/unpacked" -type f -name state.json -print -quit)"
          if [[ -z "$state_file" ]]; then
            echo "The latest AI artifact contains no state.json." >&2
            exit 1
          fi
          rm -rf .trade-tracker/ai
          mkdir -p .trade-tracker/ai
          cp -R "$(dirname "$state_file")/." .trade-tracker/ai/
          echo "Restored AI state artifact ${artifact_id}."

      - name: Run offline tests
        shell: bash
        env:
          AI_OPENAI_MIN_REQUEST_INTERVAL_SECONDS: "0"
        run: |
          export GITHUB_STEP_SUMMARY=/tmp/myetf-offline-test-summary
          python -m pytest -q \
            tests/test_monitor_disclosures.py \
            tests/test_government_trade_tracker.py \
            tests/test_oge_disclosures.py \
            tests/test_ai_filing_analyst.py \
            tests/test_trade_dashboard.py

      - name: Analyze new filing purchases
        id: analyst
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          REANALYZE_EXISTING: ${{ github.event_name == 'workflow_dispatch' && inputs.reanalyze_existing || false }}
          SUPPRESS_ALERTS: ${{ github.event_name == 'workflow_dispatch' && inputs.suppress_alerts || false }}
          MAX_ANALYSES_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.max_analyses || '' }}
        run: |
          set -euo pipefail
          args=(
            --legislative-dir tracker-input/legislative
            --executive-dir tracker-input/executive
            --ai-dir .trade-tracker/ai
          )
          if [[ "$REANALYZE_EXISTING" == "true" ]]; then
            args+=(--reanalyze-existing)
          fi
          if [[ "$SUPPRESS_ALERTS" == "true" ]]; then
            args+=(--suppress-alerts)
          fi
          if [[ -n "$MAX_ANALYSES_INPUT" ]]; then
            args+=(--max-analyses "$MAX_ANALYSES_INPUT")
          fi
          python scripts/ai_filing_analyst.py "${args[@]}"

      - name: Save AI state cache
        if: ${{ always() && hashFiles('.trade-tracker/ai/state.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: .trade-tracker/ai
          key: ai-analysis-${{ runner.os }}-${{ github.run_id }}

      - name: Upload durable AI state
        if: ${{ always() && hashFiles('.trade-tracker/ai/state.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-analysis-state
          path: .trade-tracker/ai
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Upload AI outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-analysis-output-${{ github.run_id }}
          path: |
            ai-analysis-result.json
            ai-latest-analyses.csv
            ai-paper-portfolio.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Signal analyst success
        if: ${{ always() && !failure() && steps.analyst.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.AI_HEALTHCHECKS_PING_URL }}
        run: |
          if [[ -n "$HEALTHCHECKS_PING_URL" ]]; then
            curl --fail --silent --show-error --max-time 20 --retry 3 \
              "${HEALTHCHECKS_PING_URL%/}" >/dev/null
          fi

      - name: Signal analyst failure
        if: ${{ always() && failure() }}
        continue-on-error: true
        shell: bash
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.AI_HEALTHCHECKS_PING_URL }}
        run: |
          if [[ -n "$HEALTHCHECKS_PING_URL" ]]; then
            if [[ -f ai-analysis-result.json ]]; then
              curl --fail --silent --show-error --max-time 20 --retry 3 \
                --data-binary @ai-analysis-result.json \
                "${HEALTHCHECKS_PING_URL%/}/fail" >/dev/null || true
            else
              curl --fail --silent --show-error --max-time 20 --retry 3 \
                --data "AI workflow failed before ai-analysis-result.json was created" \
                "${HEALTHCHECKS_PING_URL%/}/fail" >/dev/null || true
            fi
          fi

      - name: Send Pushover failure notification
        if: ${{ always() && failure() }}
        continue-on-error: true
        shell: bash
        env:
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          if [[ -n "$PUSHOVER_API_TOKEN" && -n "$PUSHOVER_USER_KEY" ]]; then
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            curl --fail --silent --show-error --max-time 20 --retry 3 \
              --form-string "token=$PUSHOVER_API_TOKEN" \
              --form-string "user=$PUSHOVER_USER_KEY" \
              --form-string "title=MyETF AI filing analyst failed" \
              --form-string "message=The filing collectors remain independent. Open the AI workflow for the failed analysis and retry details." \
              --form-string "url=$run_url" \
              --form-string "url_title=Open failed AI workflow" \
              https://api.pushover.net/1/messages.json >/dev/null
          fi
