name: Phase 3 closeout through private GCS evidence

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase3_closeout_gcs.yml"
      - "deploy/runtime-v2/closeout-phase3-gcs.sh"
      - "deploy/runtime-v2/gcs_status_probe.py"

concurrency:
  group: phase3-closeout-gcs
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  close:
    if: github.repository_id == '1349678672' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PROJECT_ID: project-38008d5f-4918-46e6-920
      PROJECT_NUMBER: "497412818801"
      REGION: us-central1
      STATE_BUCKET: project-38008d5f-4918-46e6-920-polititrack-tfstate
      WIF_PROVIDER: projects/497412818801/locations/global/workloadIdentityPools/polititrack-github-phase3/providers/phase3-main
      DEPLOYER_SERVICE_ACCOUNT: polititrack-phase3-deployer@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com
      ADMIN_JOB: polititrack-admin
      ADMIN_SERVICE_ACCOUNT: polititrack-admin-v2@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com
      WEB_SERVICE: polititrack-web
      SQL_INSTANCE: polititrack-runtime-v2
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify private GCS closeout controller
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/runtime-v2/closeout-phase3-gcs.sh
          python -m py_compile deploy/runtime-v2/gcs_status_probe.py
          python - <<'PY'
          from pathlib import Path
          text = Path("deploy/runtime-v2/closeout-phase3-gcs.sh").read_text(encoding="utf-8")
          forbidden = (
              "gcloud logging read",
              "roles/logging.admin",
              "roles/logging.viewAccessor",
              "gcloud scheduler jobs run",
              "gcloud scheduler jobs resume",
              "runtime_v2,run",
              "import-gcs",
              "secrets versions access",
              "terraform apply",
              "gcloud run deploy",
              "gcloud sql instances patch",
          )
          for value in forbidden:
              assert value not in text, value
          assert text.count("gcloud run jobs execute") == 1
          assert "gcs_status_probe.py" in text
          assert "roles/storage.objectCreator" in text
          assert "roles/run.jobsExecutorWithOverrides" in text
          assert "git push --atomic" in text
          PY

      - name: Authenticate as constrained Phase 3 deployer
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Close Phase 3 with private GCS evidence
        shell: bash
        run: bash deploy/runtime-v2/closeout-phase3-gcs.sh

      - name: Upload private GCS closeout evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase3-closeout-gcs
          path: |
            ${{ runner.temp }}/phase3-closeout-gcs-${{ github.run_id }}/probe.json
            ${{ runner.temp }}/phase3-closeout-gcs-${{ github.run_id }}/status.json
            ${{ runner.temp }}/phase3-closeout-gcs-${{ github.run_id }}/status-execution.json
            ${{ runner.temp }}/phase3-closeout-gcs-${{ github.run_id }}/phase3-acceptance.json
            ${{ runner.temp }}/phase3-closeout-gcs-${{ github.run_id }}/phase3-acceptance.sha256
            ${{ runner.temp }}/phase3-closeout-gcs-${{ github.run_id }}/admin-before.json
            ${{ runner.temp }}/phase3-closeout-gcs-${{ github.run_id }}/admin-final.json
            ${{ runner.temp }}/phase3-closeout-gcs-${{ github.run_id }}/execute-error.txt
          if-no-files-found: warn
          retention-days: 90
