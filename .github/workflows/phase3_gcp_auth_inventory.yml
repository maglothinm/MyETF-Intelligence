name: Phase 3 GCP auth inventory

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase3_gcp_auth_inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    if: github.repository_id == '1349678672' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      S_GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      S_GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
      S_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      S_GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      S_GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      S_GCP_WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
      S_GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      S_GCP_RUNTIME_SERVICE_ACCOUNT: ${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}
      S_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      S_GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      S_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      S_GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      V_GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      V_GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      V_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      V_GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      V_GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      V_GCP_WIF_SERVICE_ACCOUNT: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      V_GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      V_GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      V_GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
    steps:
      - name: Record presence only
        shell: bash
        run: |
          set -euo pipefail
          report=phase3-gcp-auth-inventory.txt
          : > "$report"
          printf '%s\n' \
            "schema_version=1" \
            "repository_id=${GITHUB_REPOSITORY_ID}" \
            "repository=${GITHUB_REPOSITORY}" \
            "source_revision=${GITHUB_SHA}" >> "$report"

          for name in \
            S_GCP_PROJECT_ID S_GCP_PROJECT_NUMBER \
            S_GCP_WORKLOAD_IDENTITY_PROVIDER S_GCP_WIF_PROVIDER \
            S_GCP_SERVICE_ACCOUNT S_GCP_WIF_SERVICE_ACCOUNT \
            S_GCP_DEPLOY_SERVICE_ACCOUNT S_GCP_RUNTIME_SERVICE_ACCOUNT \
            S_GOOGLE_CREDENTIALS S_GCP_CREDENTIALS S_GCP_SA_KEY \
            S_GOOGLE_APPLICATION_CREDENTIALS_JSON \
            V_GCP_PROJECT_ID V_GCP_PROJECT_NUMBER \
            V_GCP_WORKLOAD_IDENTITY_PROVIDER V_GCP_WIF_PROVIDER \
            V_GCP_SERVICE_ACCOUNT V_GCP_WIF_SERVICE_ACCOUNT \
            V_GCP_DEPLOY_SERVICE_ACCOUNT V_GCP_RUNTIME_SERVICE_ACCOUNT \
            V_GOOGLE_CLOUD_PROJECT; do
            value="${!name-}"
            if [[ -n "$value" ]]; then
              printf '%s=present\n' "$name" >> "$report"
            else
              printf '%s=absent\n' "$name" >> "$report"
            fi
          done

          cat "$report"

      - name: Upload presence-only inventory
        uses: actions/upload-artifact@v4
        with:
          name: phase3-gcp-auth-inventory-${{ github.run_id }}
          path: phase3-gcp-auth-inventory.txt
          if-no-files-found: error
          retention-days: 7
