name: Executive purchase tracker

on:
  schedule:
    # Twice hourly, staggered from Legislative and the busy :00/:30 boundaries.
    - cron: "13,43 * * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Non-secret dispatch label (does not bypass production safeguards)"
        required: false
        default: workflow_dispatch
        type: choice
        options:
          - workflow_dispatch
          - external_scheduler

permissions:
  actions: read
  contents: read

concurrency:
  # All trigger sources serialize through this one protected-state writer.
  group: executive-purchase-tracker
  cancel-in-progress: false

env:
  POLITITRACK_TRIGGER_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger_source || github.event_name }}
  STATE_FILE: ".trade-tracker/executive/state.json"
  LEDGER_FILE: ".trade-tracker/executive/purchases.jsonl"
  TRANSACTIONS_FILE: ".trade-tracker/executive/transactions.jsonl"
  FILINGS_FILE: ".trade-tracker/executive/filings.jsonl"
  RUN_HISTORY_FILE: ".trade-tracker/executive/runs.jsonl"
  PENDING_FILE: ".trade-tracker/executive/pending-review.jsonl"
  RESULT_FILE: "executive-result.json"
  LATEST_CSV: "executive-latest-purchases.csv"
  LATEST_TRANSACTIONS_CSV: "executive-latest-transactions.csv"
  LATEST_FILINGS_CSV: "executive-latest-filings.csv"
  OGE_LISTINGS_FILE: "oge-listings.json"
  REQUIRE_PUSHOVER: "false"
  NOTIFY_EQUITY_ONLY: "true"
  NOTIFY_PENDING_REVIEWS: "true"
  NOTIFY_ALL_FILINGS: "true"
  DASHBOARD_URL: ${{ vars.DASHBOARD_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
  ALLOW_EMPTY_SOURCES: "false"
  DISCLOSURE_TERMS_ACKNOWLEDGED: ${{ vars.DISCLOSURE_TERMS_ACKNOWLEDGED }}

jobs:
  track:
    if: github.repository_id == '1349678672' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Signal tracker start
        continue-on-error: true
        shell: bash
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.EXECUTIVE_HEALTHCHECKS_PING_URL }}
        run: |
          if [[ -n "$HEALTHCHECKS_PING_URL" ]]; then
            healthchecks_base="${HEALTHCHECKS_PING_URL%/}"
            healthchecks_base="${healthchecks_base%/start}"
            healthchecks_base="${healthchecks_base%/fail}"
            healthchecks_base="${healthchecks_base%/}"
            curl --fail --silent --show-error --max-time 20 --retry 3 \
              "${healthchecks_base}/start" >/dev/null
          fi
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-tracker.txt

      - name: Install PDF and OCR system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils tesseract-ocr

      - name: Install tracker dependencies
        shell: bash
        run: python -m pip install --requirement requirements-tracker.txt pytest==9.0.2

      - name: Install Chromium for OGE discovery
        shell: bash
        run: python -m playwright install --with-deps chromium

      - name: Restore authoritative Executive state artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          consumer_sha="$(git rev-parse HEAD)"
          receipt="${{ runner.temp }}/executive-state-receipt.json"
          python scripts/protected_state.py restore \
            --pipeline executive --destination .trade-tracker/executive \
            --receipt "$receipt" --consumer-sha "$consumer_sha"
          GITHUB_SHA="$consumer_sha" python scripts/collect_workflow_evidence.py \
            --guard-branch executive \
            --producer-run "$(jq -r '.selected.producer.run_id' "$receipt")" \
            --producer-attempt "$(jq -r '.selected.producer.run_attempt' "$receipt")"

      - name: Run offline tests
        shell: bash
        run: |
          export GITHUB_STEP_SUMMARY=/tmp/polititrack-offline-test-summary
          python -m pytest -q \
            tests/test_protected_state.py \
            tests/test_workflow_contract.py \
            tests/test_monitor_disclosures.py \
            tests/test_government_trade_tracker.py \
            tests/test_historical_transaction_bootstrap.py \
            tests/test_oge_disclosures.py \
            tests/test_trade_dashboard.py

      - name: Discover OGE Form 278-T listings
        id: discovery
        shell: bash
        run: python scripts/oge_disclosures.py --output oge-listings.json

      - name: Track executive-branch purchases
        id: tracker
        shell: bash
        env:
          BOOTSTRAP_ALERTS: "false"
          ALLOW_STATE_INITIALIZATION: "false"
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: python scripts/government_trade_tracker.py --branch executive --oge-listings-file oge-listings.json

      - name: Validate continuity and seal protected Executive state
        id: state_seal
        if: ${{ steps.tracker.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/protected_state.py seal \
            --pipeline executive --directory .trade-tracker/executive \
            --receipt "${{ runner.temp }}/executive-state-receipt.json" \
            --consumer-sha "$(git rev-parse HEAD)"

      - name: Upload durable tracker state
        if: ${{ steps.state_seal.outcome == 'success' && hashFiles('.trade-tracker/executive/state.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: executive-tracker-state
          path: .trade-tracker/executive
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Upload run outputs and diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: executive-purchase-output-${{ github.run_id }}
          path: |
            oge-listings.json
            executive-result.json
            executive-latest-purchases.csv
            executive-latest-transactions.csv
            executive-latest-filings.csv
            oge-diagnostics/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      - name: Signal tracker success
        if: ${{ always() && !failure() && steps.tracker.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.EXECUTIVE_HEALTHCHECKS_PING_URL }}
        run: |
          if [[ -n "$HEALTHCHECKS_PING_URL" ]]; then
            healthchecks_base="${HEALTHCHECKS_PING_URL%/}"
            healthchecks_base="${healthchecks_base%/start}"
            healthchecks_base="${healthchecks_base%/fail}"
            healthchecks_base="${healthchecks_base%/}"
            curl --fail --silent --show-error --max-time 20 --retry 3 \
              "$healthchecks_base" >/dev/null
          fi

      - name: Signal tracker failure
        if: ${{ always() && failure() }}
        continue-on-error: true
        shell: bash
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.EXECUTIVE_HEALTHCHECKS_PING_URL }}
        run: |
          if [[ -n "$HEALTHCHECKS_PING_URL" ]]; then
            healthchecks_base="${HEALTHCHECKS_PING_URL%/}"
            healthchecks_base="${healthchecks_base%/start}"
            healthchecks_base="${healthchecks_base%/fail}"
            healthchecks_base="${healthchecks_base%/}"
            if [[ -f executive-result.json ]]; then
              curl --fail --silent --show-error --max-time 20 --retry 3 \
                --data-binary @executive-result.json \
                "${healthchecks_base}/fail" >/dev/null || true
            else
              curl --fail --silent --show-error --max-time 20 --retry 3 \
                --data "Workflow failed before executive-result.json was created" \
                "${healthchecks_base}/fail" >/dev/null || true
            fi
          fi

      - name: Send Pushover failure notification
        if: ${{ always() && failure() }}
        continue-on-error: true
        shell: bash
        env:
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          if [[ -n "$PUSHOVER_API_TOKEN" && -n "$PUSHOVER_USER_KEY" ]]; then
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            curl --fail --silent --show-error --max-time 20 --retry 3 \
              --form-string "token=$PUSHOVER_API_TOKEN" \
              --form-string "user=$PUSHOVER_USER_KEY" \
              --form-string "title=Executive purchase tracker failed" \
              --form-string "message=Open the GitHub Actions run for logs, OGE diagnostics, and the result artifact." \
              --form-string "url=$run_url" \
              --form-string "url_title=Open failed workflow" \
              https://api.pushover.net/1/messages.json >/dev/null
          fi
