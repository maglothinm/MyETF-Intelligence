name: Recover AI filing analyst

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover_ai_filing_analyst.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: recover-ai-filing-analyst
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository_id == '1349678672' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Enable AI filing analyst workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_endpoint="/repos/${GITHUB_REPOSITORY}/actions/workflows/ai_filing_analyst.yml"
          state_before="$(gh api "$workflow_endpoint" --jq '.state')"
          echo "AI analyst workflow state before recovery: ${state_before}"

          if [[ "$state_before" != "active" ]]; then
            gh api --method PUT "${workflow_endpoint}/enable"
          fi

          state_after="$(gh api "$workflow_endpoint" --jq '.state')"
          echo "AI analyst workflow state after recovery: ${state_after}"
          if [[ "$state_after" != "active" ]]; then
            echo "AI analyst workflow did not become active." >&2
            exit 1
          fi

          {
            echo "### AI analyst recovery"
            echo "- Workflow state before: \`${state_before}\`"
            echo "- Workflow state after: \`${state_after}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch one-record live smoke test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ai_filing_analyst.yml/dispatches" \
            --raw-field ref="$DEFAULT_BRANCH" \
            --field 'inputs[reanalyze_existing]=true' \
            --field 'inputs[suppress_alerts]=true' \
            --field 'inputs[investor_edge_enabled]=true' \
            --raw-field 'inputs[max_analyses]=1'

          echo "- Live smoke test dispatched with one historical purchase and alerts suppressed." >> "$GITHUB_STEP_SUMMARY"
