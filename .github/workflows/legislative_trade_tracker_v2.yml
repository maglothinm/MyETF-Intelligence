name: Legislative purchase tracker v2

# CONTROLLED VALIDATION MODE — recurring and external schedules remain paused.
# The only permitted invocation is a deliberately acknowledged manual run, and
# every producer subprocess is forced into notification-suppressed mode.
on:
  workflow_dispatch:
    inputs:
      validation_acknowledged:
        description: "Run the notification-suppressed controlled validation"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  # All trigger sources serialize through this one protected-state writer.
  group: legislative-purchase-tracker-v2
  cancel-in-progress: false

env:
  POLITITRACK_TRIGGER_SOURCE: workflow_dispatch
  POLITITRACK_CONTROLLED_VALIDATION: "true"
  STATE_FILE: ".trade-tracker/legislative/state.json"
  LEDGER_FILE: ".trade-tracker/legislative/purchases.jsonl"
  TRANSACTIONS_FILE: ".trade-tracker/legislative/transactions.jsonl"
  FILINGS_FILE: ".trade-tracker/legislative/filings.jsonl"
  RUN_HISTORY_FILE: ".trade-tracker/legislative/runs.jsonl"
  PENDING_FILE: ".trade-tracker/legislative/pending-review.jsonl"
  RESULT_FILE: "legislative-result.json"
  SOURCE_STATUS_FILE: ".trade-tracker/legislative/source-status.json"
  RESTORE_RECEIPT_FILE: ".trade-tracker/legislative/restore-receipt.json"
  CONTROLLED_VALIDATION_RECEIPT_FILE: ".trade-tracker/legislative/controlled-validation-receipt.json"
  POLITITRACK_REQUIRE_RESTORE_RECEIPT: "true"
  LATEST_CSV: "legislative-latest-purchases.csv"
  LATEST_TRANSACTIONS_CSV: "legislative-latest-transactions.csv"
  LATEST_FILINGS_CSV: "legislative-latest-filings.csv"
  SENATE_LOOKBACK_DAYS: "180"
  REQUIRE_PUSHOVER: "false"
  NOTIFY_EQUITY_ONLY: "true"
  NOTIFY_PENDING_REVIEWS: "true"
  NOTIFY_ALL_FILINGS: "true"
  DASHBOARD_URL: ${{ vars.DASHBOARD_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
  ALLOW_EMPTY_SOURCES: "false"
  DISCLOSURE_TERMS_ACKNOWLEDGED: ${{ vars.DISCLOSURE_TERMS_ACKNOWLEDGED }}

jobs:
  track:
    if: >-
      github.repository_id == '1349678672' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref_name == github.event.repository.default_branch &&
      inputs.validation_acknowledged == true
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Record runner region
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, ProxyHandler, build_opener
          context = {key: os.environ.get(key, "unknown") for key in
                     ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "RUNNER_OS", "RUNNER_ARCH", "RUNNER_ENVIRONMENT")}
          try:
              request = Request("http://169.254.169.254/metadata/instance/compute/location?api-version=2021-02-01&format=text",
                                headers={"Metadata": "true"})
              with build_opener(ProxyHandler({})).open(request, timeout=2) as response:
                  region = response.read(80).decode("ascii").strip()
              context["azure_region"] = region if region.isalnum() else "unavailable"
          except Exception:
              context["azure_region"] = "unavailable"
          print("Runner context: " + json.dumps(context, sort_keys=True))
          PY

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-tracker.txt

      - name: Install PDF and OCR system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils tesseract-ocr

      - name: Install tracker dependencies
        shell: bash
        run: python -m pip install --requirement requirements-tracker.txt pytest==9.0.2

      - name: Restore authoritative Legislative state artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          artifact_name="legislative-tracker-state"
          workflow_file="legislative_trade_tracker_v2.yml"
          workflow_name="Legislative purchase tracker v2"
          authoritative_job="track"
          destination=".trade-tracker/legislative"
          consumer_sha="$(git rev-parse HEAD)"
          live_default_sha="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" \
              --jq '.object.sha'
          )"
          if [[ "$consumer_sha" != "$live_default_sha" ]]; then
            echo "This queued tracker checked out ${consumer_sha}, but ${DEFAULT_BRANCH} is now ${live_default_sha}; refusing stale-code execution." >&2
            exit 1
          fi

          artifact_id=""
          producer_run_id=""
          producer_attempt=""
          producer_workflow_id=""
          producer_head_sha=""
          while IFS=$'\t' read -r candidate_artifact_id candidate_run_id candidate_created_at; do
            [[ -n "$candidate_artifact_id" && -n "$candidate_run_id" && -n "$candidate_created_at" ]] || continue
            run_payload="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}"
            )"
            current_run_attempt="$(jq -r '.run_attempt // 1' <<< "$run_payload")"
            [[ "$current_run_attempt" =~ ^[1-9][0-9]*$ ]] || continue

            for ((candidate_attempt = current_run_attempt; candidate_attempt >= 1; candidate_attempt--)); do
              attempt_payload="$run_payload"
              if (( candidate_attempt != current_run_attempt )); then
                attempt_payload="$(
                  gh api \
                    -H "Accept: application/vnd.github+json" \
                    "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/attempts/${candidate_attempt}"
                )"
              fi
              run_started_at="$(jq -r '.run_started_at // ""' <<< "$attempt_payload")"
              next_attempt_started_at=""
              if (( candidate_attempt < current_run_attempt )); then
                next_attempt_started_at="$(
                  gh api \
                    -H "Accept: application/vnd.github+json" \
                    "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/attempts/$((candidate_attempt + 1))" \
                    --jq '.run_started_at // ""'
                )"
              fi
              if [[ \
                -z "$run_started_at" || \
                "$candidate_created_at" < "$run_started_at" || \
                ( -n "$next_attempt_started_at" && ( "$candidate_created_at" > "$next_attempt_started_at" || "$candidate_created_at" == "$next_attempt_started_at" ) ) \
              ]]; then
                continue
              fi

              run_name="$(jq -r '.name // ""' <<< "$attempt_payload")"
              run_path="$(jq -r '.path // ""' <<< "$attempt_payload")"
              run_path="${run_path%%@*}"
              run_branch="$(jq -r '.head_branch // ""' <<< "$attempt_payload")"
              run_conclusion="$(jq -r '.conclusion // ""' <<< "$attempt_payload")"
              run_repository_id="$(jq -r '.repository.id // ""' <<< "$attempt_payload")"
              run_head_sha="$(jq -r '.head_sha // ""' <<< "$attempt_payload")"
              workflow_id="$(jq -r '.workflow_id // ""' <<< "$attempt_payload")"
              if [[ \
                "$run_name" != "$workflow_name" || \
                "$run_path" != ".github/workflows/${workflow_file}" || \
                "$run_branch" != "$DEFAULT_BRANCH" || \
                "$run_conclusion" != "success" || \
                "$run_repository_id" != "$GITHUB_REPOSITORY_ID" || \
                -z "$run_head_sha" || \
                -z "$workflow_id" \
              ]]; then
                continue
              fi
              successful_state_jobs="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/attempts/${candidate_attempt}/jobs?per_page=100" \
                  --jq "[.jobs[] | select(.name == \"${authoritative_job}\" and .conclusion == \"success\")] | length"
              )"
              (( successful_state_jobs > 0 )) || continue
              compare_status="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/compare/${run_head_sha}...${consumer_sha}" \
                  --jq '.status'
              )"
              if [[ "$compare_status" == "ahead" || "$compare_status" == "identical" ]]; then
                artifact_id="$candidate_artifact_id"
                producer_run_id="$candidate_run_id"
                producer_attempt="$candidate_attempt"
                producer_workflow_id="$workflow_id"
                producer_head_sha="$run_head_sha"
                break 2
              fi
            done
          done < <(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" \
              --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse[] | [.id, .workflow_run.id, .created_at] | @tsv'
          )
          if [[ -z "$artifact_id" ]]; then
            echo "No authoritative ${artifact_name} artifact is available; refusing to initialize protected state." >&2
            exit 1
          fi
          if [[ \
            ! "$artifact_id" =~ ^[1-9][0-9]*$ || \
            ! "$producer_run_id" =~ ^[1-9][0-9]*$ || \
            ! "$producer_attempt" =~ ^[1-9][0-9]*$ || \
            ! "$producer_workflow_id" =~ ^[1-9][0-9]*$ || \
            ! "$producer_head_sha" =~ ^[0-9a-f]{40}$ || \
            ! "$GITHUB_REPOSITORY_ID" =~ ^[1-9][0-9]*$ \
          ]]; then
            echo "Selected predecessor identity is incomplete or malformed." >&2
            exit 1
          fi

          artifact_payload="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          )"
          artifact_api_digest="$(jq -r '.digest // ""' <<< "$artifact_payload")"
          artifact_created_at="$(jq -r '.created_at // ""' <<< "$artifact_payload")"
          artifact_unexpired="$(jq -r '.expired == false' <<< "$artifact_payload")"
          if [[ \
            "$(jq -r '.id // ""' <<< "$artifact_payload")" != "$artifact_id" || \
            "$(jq -r '.name // ""' <<< "$artifact_payload")" != "$artifact_name" || \
            "$artifact_unexpired" != "true" || \
            "$(jq -r '.workflow_run.id // ""' <<< "$artifact_payload")" != "$producer_run_id" || \
            "$(jq -r '.workflow_run.repository_id // ""' <<< "$artifact_payload")" != "$GITHUB_REPOSITORY_ID" || \
            "$(jq -r '.workflow_run.head_branch // ""' <<< "$artifact_payload")" != "$DEFAULT_BRANCH" || \
            "$(jq -r '.workflow_run.head_sha // ""' <<< "$artifact_payload")" != "$producer_head_sha" || \
            "$artifact_api_digest" != sha256:* || \
            ! "${artifact_api_digest#sha256:}" =~ ^[0-9a-f]{64}$ || \
            -z "$artifact_created_at" \
          ]]; then
            echo "Artifact ${artifact_id} metadata does not preserve the selected predecessor binding." >&2
            exit 1
          fi

          later_writers=""
          run_page=1
          while :; do
            runs_payload="$(
              gh api --method GET \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/${producer_workflow_id}/runs" \
                -f branch="$DEFAULT_BRANCH" \
                -f per_page=100 \
                -f page="$run_page"
            )"
            page_count="$(jq '.workflow_runs | length' <<< "$runs_payload")"
            while IFS= read -r later_run_id; do
              [[ -n "$later_run_id" ]] || continue
              later_run_payload="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${later_run_id}"
              )"
              later_run_name="$(jq -r '.name // ""' <<< "$later_run_payload")"
              later_run_path="$(jq -r '.path // ""' <<< "$later_run_payload")"
              later_run_path="${later_run_path%%@*}"
              later_run_branch="$(jq -r '.head_branch // ""' <<< "$later_run_payload")"
              later_repository_id="$(jq -r '.repository.id // ""' <<< "$later_run_payload")"
              if [[ \
                "$later_run_name" != "$workflow_name" || \
                "$later_run_path" != ".github/workflows/${workflow_file}" || \
                "$later_run_branch" != "$DEFAULT_BRANCH" || \
                "$later_repository_id" != "$GITHUB_REPOSITORY_ID" \
              ]]; then
                continue
              fi
              later_attempt_count="$(jq -r '.run_attempt // 1' <<< "$later_run_payload")"
              [[ "$later_attempt_count" =~ ^[1-9][0-9]*$ ]] || continue
              first_later_attempt=1
              if (( later_run_id == producer_run_id )); then
                first_later_attempt=$((producer_attempt + 1))
              fi
              for ((later_attempt = first_later_attempt; later_attempt <= later_attempt_count; later_attempt++)); do
                successful_state_jobs="$(
                  gh api \
                    -H "Accept: application/vnd.github+json" \
                    "/repos/${GITHUB_REPOSITORY}/actions/runs/${later_run_id}/attempts/${later_attempt}/jobs?per_page=100" \
                    --jq "[.jobs[] | select(.name == \"${authoritative_job}\" and .conclusion == \"success\")] | length"
                )"
                if (( successful_state_jobs > 0 )); then
                  later_writers+="${later_writers:+$'\n'}${later_run_id}.${later_attempt}"
                fi
              done
            done < <(
              jq -r --argjson predecessor "$producer_run_id" \
                '.workflow_runs[] | select(.id >= $predecessor) | .id' \
                <<< "$runs_payload"
            )
            if (( page_count == 0 || page_count < 100 )); then
              break
            fi
            oldest_run_id="$(jq '[.workflow_runs[].id] | min' <<< "$runs_payload")"
            if (( oldest_run_id < producer_run_id )); then
              break
            fi
            ((run_page += 1))
          done
          if [[ -n "$later_writers" ]]; then
            later_writers="$(sort -V -u <<< "$later_writers")"
            echo "${workflow_name} high-water violation at run attempt(s) ${later_writers//$'\n'/, }; refusing stale protected state." >&2
            exit 1
          fi

          # An earlier failed/cancelled collector can have sent alerts without
          # publishing its delivery state. Do not replay from the old artifact.
          GITHUB_SHA="$consumer_sha" python scripts/collect_workflow_evidence.py \
            --guard-branch legislative \
            --producer-run "$producer_run_id" --producer-attempt "$producer_attempt"

          temp_dir="$(mktemp -d)"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "$temp_dir/state.zip"
          downloaded_zip_sha256="$(sha256sum "$temp_dir/state.zip" | cut -d ' ' -f 1)"
          if [[ "$downloaded_zip_sha256" != "${artifact_api_digest#sha256:}" ]]; then
            echo "Artifact ${artifact_id} download digest does not match its API digest." >&2
            exit 1
          fi
          mkdir -p "$temp_dir/unpacked"
          unzip -q "$temp_dir/state.zip" -d "$temp_dir/unpacked"
          state_file="$(find "$temp_dir/unpacked" -type f -name state.json -print -quit)"
          if [[ -z "$state_file" ]]; then
            echo "Artifact ${artifact_id} (${artifact_name}) contains no state.json." >&2
            exit 1
          fi
          if ! jq -e '
            type == "object" and
            .version == 1 and
            (.last_success_utc | type == "string" and length > 0) and
            (.seen_filings | type == "object") and
            (.seen_trades | type == "object") and
            (.seen_reviews | type == "object")
          ' "$state_file" >/dev/null; then
            echo "Artifact ${artifact_id} (${artifact_name}) is not a complete supported state." >&2
            exit 1
          fi
          rm -rf "$destination"
          mkdir -p "$destination"
          cp -R "$(dirname "$state_file")/." "$destination/"
          restored_state_sha256="$(sha256sum "$destination/state.json" | cut -d ' ' -f 1)"
          jq -n \
            --arg restored_at_utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson repository_id "$GITHUB_REPOSITORY_ID" \
            --arg consumer_sha "$consumer_sha" \
            --argjson predecessor_artifact_id "$artifact_id" \
            --arg predecessor_artifact_name "$artifact_name" \
            --arg predecessor_artifact_created_at "$artifact_created_at" \
            --arg predecessor_artifact_api_digest "$artifact_api_digest" \
            --arg downloaded_zip_sha256 "$downloaded_zip_sha256" \
            --argjson predecessor_run_id "$producer_run_id" \
            --argjson predecessor_run_attempt "$producer_attempt" \
            --arg predecessor_head_sha "$producer_head_sha" \
            --argjson predecessor_workflow_id "$producer_workflow_id" \
            --arg predecessor_workflow_file "$workflow_file" \
            --arg predecessor_workflow_name "$workflow_name" \
            --arg restored_state_sha256 "$restored_state_sha256" \
            '{
              version: 1,
              restored_at_utc: $restored_at_utc,
              repository_id: $repository_id,
              consumer_sha: $consumer_sha,
              predecessor_artifact_id: $predecessor_artifact_id,
              predecessor_artifact_name: $predecessor_artifact_name,
              predecessor_artifact_created_at: $predecessor_artifact_created_at,
              predecessor_artifact_api_digest: $predecessor_artifact_api_digest,
              downloaded_zip_sha256: $downloaded_zip_sha256,
              predecessor_run_id: $predecessor_run_id,
              predecessor_run_attempt: $predecessor_run_attempt,
              predecessor_head_sha: $predecessor_head_sha,
              predecessor_workflow_id: $predecessor_workflow_id,
              predecessor_workflow_file: $predecessor_workflow_file,
              predecessor_workflow_name: $predecessor_workflow_name,
              restored_state_sha256: $restored_state_sha256
            }' > "$RESTORE_RECEIPT_FILE"
          echo "Restored authoritative Legislative state from artifact ${artifact_id}, run ${producer_run_id}, attempt ${producer_attempt}."

      - name: Run offline tests
        shell: bash
        run: |
          export GITHUB_STEP_SUMMARY=/tmp/polititrack-offline-test-summary
          python -m pytest -q \
            tests/test_monitor_disclosures.py \
            tests/test_senate_client.py \
            tests/test_legislative_healthcheck.py \
            tests/test_legislative_resilient_orchestrator.py \
            tests/test_legislative_resilient_integration.py \
            tests/test_government_trade_tracker.py \
            tests/test_historical_transaction_bootstrap.py \
            tests/test_oge_disclosures.py \
            tests/test_trade_dashboard.py

      - name: Track House and Senate purchases
        id: tracker
        continue-on-error: true
        shell: bash
        env:
          BOOTSTRAP_ALERTS: "false"
          ALLOW_STATE_INITIALIZATION: "false"
        run: >-
          python scripts/government_trade_tracker.py
          --branch legislative --source all --no-notify

      - name: Classify durable Legislative result
        id: durable_validation
        continue-on-error: true
        shell: bash
        run: >-
          python scripts/legislative_healthcheck.py
          --validate-durable
          --state "$STATE_FILE"
          --source-status "$SOURCE_STATUS_FILE"
          --restore-receipt "$RESTORE_RECEIPT_FILE"
          --controlled-validation-receipt "$CONTROLLED_VALIDATION_RECEIPT_FILE"
          --require-restore-receipt
          --require-controlled-validation-receipt
          --require-notifications-suppressed
          --require-no-notification-eligible-records
          --require-run-provenance

      - name: Validate protected Legislative state for upload
        id: state_validation
        if: ${{ always() && steps.tracker.outcome != 'skipped' }}
        shell: bash
        run: >-
          python scripts/legislative_healthcheck.py
          --validate-protected-upload
          --state "$STATE_FILE"
          --source-status "$SOURCE_STATUS_FILE"
          --restore-receipt "$RESTORE_RECEIPT_FILE"
          --controlled-validation-receipt "$CONTROLLED_VALIDATION_RECEIPT_FILE"
          --require-run-provenance

      - name: Upload protected tracker state
        if: ${{ success() && steps.state_validation.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: legislative-tracker-state
          path: .trade-tracker/legislative
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Upload run outputs
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: legislative-purchase-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            legislative-result.json
            legislative-latest-purchases.csv
            legislative-latest-transactions.csv
            legislative-latest-filings.csv
            .trade-tracker/legislative/source-status.json
            .trade-tracker/legislative/restore-receipt.json
            .trade-tracker/legislative/controlled-validation-receipt.json
          if-no-files-found: warn
          retention-days: 30
