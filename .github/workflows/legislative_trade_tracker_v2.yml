name: Legislative purchase tracker v2

# RECOVERY MODE — the recurring schedule is intentionally paused.
# This workflow republishes the last verified state after reconciling the
# September 4 Senate access-denied incident. Production polling is restored
# only by the follow-on validated workflow change.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/legislative_trade_tracker_v2.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: legislative-purchase-tracker-v2
  cancel-in-progress: false

jobs:
  track:
    if: github.repository_id == '1349678672' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore and verify last authoritative state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "9949231927"
          EXPECTED_ARCHIVE_SHA256: "4f02ca1baa29e349cf20a9d3abd979f31d7ce6e3e34ac3939e0ef2ca17f666b3"
          SAFE_PRODUCER_RUN: "33905284052"
          RECONCILED_RUN: "33918350040"
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$work/state.zip"
          echo "${EXPECTED_ARCHIVE_SHA256}  $work/state.zip" | sha256sum --check --status

          mkdir -p "$work/unpacked"
          unzip -q "$work/state.zip" -d "$work/unpacked"
          state_file="$(find "$work/unpacked" -type f -name state.json -print -quit)"
          [[ -n "$state_file" ]] || { echo "Recovered artifact contains no state.json" >&2; exit 1; }

          jq -e '
            type == "object" and
            .version == 1 and
            (.last_success_utc | type == "string" and length > 0) and
            (.seen_filings | type == "object") and
            (.seen_trades | type == "object") and
            (.seen_reviews | type == "object")
          ' "$state_file" >/dev/null

          mkdir -p recovered-state
          cp -R "$(dirname "$state_file")/." recovered-state/
          jq -n \
            --arg recovered_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg safe_producer_run "$SAFE_PRODUCER_RUN" \
            --arg safe_artifact_id "$ARTIFACT_ID" \
            --arg reconciled_run "$RECONCILED_RUN" \
            --arg reason "Run 33918350040 failed during read-only Senate discovery with HTTP 403, before filing processing or purchase notifications; no Pushover credentials were present." \
            '{version:1,recovered_at_utc:$recovered_at,safe_producer_run:$safe_producer_run,safe_artifact_id:$safe_artifact_id,reconciled_run:$reconciled_run,reconciliation_reason:$reason,notifications_replayed:false}' \
            > recovered-state/recovery-receipt.json

          echo "Recovered state last_success_utc=$(jq -r .last_success_utc recovered-state/state.json)"

      - name: Upload recovered durable tracker state
        uses: actions/upload-artifact@v7
        with:
          name: legislative-tracker-state
          path: recovered-state/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Record recovery summary
        shell: bash
        run: |
          {
            echo "## Legislative tracker recovery"
            echo
            echo "- Recurring schedule: **paused**"
            echo "- Safe source run: \`33905284052\`"
            echo "- Reconciled failed run: \`33918350040\`"
            echo "- Notifications replayed: **no**"
            echo "- Durable state: **republished after integrity validation**"
          } >> "$GITHUB_STEP_SUMMARY"
