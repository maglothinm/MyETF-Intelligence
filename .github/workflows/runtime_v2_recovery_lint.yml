name: Validate one-time Runtime v2 production recovery controller

on:
  push:
    branches:
      - fix/runtime-v2-production-recovery
    paths:
      - ".github/workflows/runtime_v2_recovery_lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository_id == '1349678672'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/runtime-v2-production-recovery
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Parse workflow and all embedded Bash
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          import yaml

          path = Path('.github/workflows/runtime_v2_production_recovery.yml')
          workflow = yaml.safe_load(path.read_text(encoding='utf-8'))
          if not isinstance(workflow, dict) or 'jobs' not in workflow:
              raise SystemExit('Recovery workflow is not valid workflow YAML')
          scripts = []
          for job in workflow['jobs'].values():
              for step in job.get('steps', []):
                  script = step.get('run')
                  if isinstance(script, str):
                      scripts.append((step.get('name', '<unnamed>'), script))
          if not scripts:
              raise SystemExit('Recovery workflow has no executable scripts')
          for index, (name, script) in enumerate(scripts, 1):
              with tempfile.NamedTemporaryFile('w', suffix='.sh', delete=False) as handle:
                  handle.write(script)
                  script_path = handle.name
              result = subprocess.run(['bash', '-n', script_path], text=True, capture_output=True)
              if result.returncode:
                  raise SystemExit(f'Bash syntax failure in step {index} {name}: {result.stderr}')
          print(f'Validated {len(scripts)} embedded Bash scripts')
          PY
      - name: Verify recovery control invariants
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/runtime_v2_production_recovery.yml
          grep -Fq "github.repository_id == '1349678672'" "$workflow"
          grep -Fq "github.ref == 'refs/heads/main'" "$workflow"
          grep -Fq 'verify_cloud_sql_private' "$workflow"
          grep -Fq 'verify_vault_scheduler_paused' "$workflow"
          grep -Fq 'verify_legacy_workflows_state disabled_manually' "$workflow"
          grep -Fq 'pause_producer_schedulers' "$workflow"
          grep -Fq 'configure_runtime production' "$workflow"
          grep -Fq 'verify_runtime_configuration production' "$workflow"
          grep -Fq 'execute_producer ai post-phase5-recovery' "$workflow"
          grep -Fq 'resume_producer_schedulers' "$workflow"
          grep -Fq 'runtime_v2_natural_schedule_certified' "$workflow"
          grep -Fq 'remove_execution_authority' "$workflow"
          grep -Fq 'builder-actas-added-by-recovery' "$workflow"
          ! grep -Eq 'terraform[[:space:]]+apply|--allow-unauthenticated|allUsers' "$workflow"
      - name: Run existing promotion-control tests
        run: |
          python -m pytest -q \
            tests/test_phase5_failed_promotion_retry.py \
            tests/test_phase5_scheduler_resume_receipt.py \
            tests/test_phase5_retry_workflow_failure_safety.py
      - name: Verify repository safety contract
        run: bash verify.sh
