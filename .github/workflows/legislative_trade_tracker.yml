name: Legislative purchase tracker

on:
  schedule:
    # Poll four times per hour, offset from :00 to reduce scheduler congestion.
    - cron: "7,22,37,52 * * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      initialize_state:
        description: "Create a silent baseline if no durable state can be restored"
        required: false
        default: false
        type: boolean
      bootstrap_alerts:
        description: "Scan and alert on existing visible filings instead of baselining them"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: legislative-purchase-tracker
  cancel-in-progress: false

env:
  STATE_FILE: ".trade-tracker/legislative/state.json"
  LEDGER_FILE: ".trade-tracker/legislative/purchases.jsonl"
  TRANSACTIONS_FILE: ".trade-tracker/legislative/transactions.jsonl"
  FILINGS_FILE: ".trade-tracker/legislative/filings.jsonl"
  RUN_HISTORY_FILE: ".trade-tracker/legislative/runs.jsonl"
  PENDING_FILE: ".trade-tracker/legislative/pending-review.jsonl"
  RESULT_FILE: "legislative-result.json"
  LATEST_CSV: "legislative-latest-purchases.csv"
  LATEST_TRANSACTIONS_CSV: "legislative-latest-transactions.csv"
  LATEST_FILINGS_CSV: "legislative-latest-filings.csv"
  SENATE_LOOKBACK_DAYS: "180"
  REQUIRE_PUSHOVER: "false"
  NOTIFY_EQUITY_ONLY: "true"
  NOTIFY_PENDING_REVIEWS: "true"
  NOTIFY_ALL_FILINGS: "true"
  DASHBOARD_URL: ${{ vars.DASHBOARD_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
  ALLOW_EMPTY_SOURCES: "false"
  DISCLOSURE_TERMS_ACKNOWLEDGED: ${{ vars.DISCLOSURE_TERMS_ACKNOWLEDGED }}

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Signal tracker start
        continue-on-error: true
        shell: bash
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.LEGISLATIVE_HEALTHCHECKS_PING_URL }}
        run: |
          if [[ -n "$HEALTHCHECKS_PING_URL" ]]; then
            curl --fail --silent --show-error --max-time 20 --retry 3 \
              "${HEALTHCHECKS_PING_URL%/}/start" >/dev/null
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-tracker.txt

      - name: Install PDF and OCR system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils tesseract-ocr

      - name: Install tracker dependencies
        shell: bash
        run: python -m pip install --requirement requirements-tracker.txt pytest==9.0.2

      - name: Restore tracker state cache
        uses: actions/cache/restore@v5
        with:
          path: .trade-tracker/legislative
          key: legislative-tracker-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            legislative-tracker-${{ runner.os }}-

      - name: Restore durable state artifact when cache is unavailable
        if: ${{ hashFiles('.trade-tracker/legislative/state.json') == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=legislative-tracker-state&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | max_by(.created_at) | .id // empty'
          )"
          if [[ -z "$artifact_id" ]]; then
            echo "No prior legislative-tracker-state artifact is available."
            exit 0
          fi
          temp_dir="$(mktemp -d)"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "$temp_dir/state.zip"
          mkdir -p "$temp_dir/unpacked"
          unzip -q "$temp_dir/state.zip" -d "$temp_dir/unpacked"
          state_file="$(find "$temp_dir/unpacked" -type f -name state.json -print -quit)"
          if [[ -z "$state_file" ]]; then
            echo "The latest state artifact contains no state.json file." >&2
            exit 1
          fi
          rm -rf .trade-tracker/legislative
          mkdir -p .trade-tracker/legislative
          cp -R "$(dirname "$state_file")/." .trade-tracker/legislative/
          echo "Restored legislative tracker state from artifact $artifact_id."

      - name: Run offline tests
        shell: bash
        run: |
          python -m pytest -q \
            tests/test_monitor_disclosures.py \
            tests/test_government_trade_tracker.py \
            tests/test_oge_disclosures.py \
            tests/test_trade_dashboard.py

      - name: Track House and Senate purchases
        id: tracker
        shell: bash
        env:
          BOOTSTRAP_ALERTS: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_alerts || false }}
          ALLOW_STATE_INITIALIZATION: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_state || false }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: python scripts/government_trade_tracker.py --branch legislative --source all

      - name: Save tracker state cache
        if: ${{ always() && hashFiles('.trade-tracker/legislative/state.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: .trade-tracker/legislative
          key: legislative-tracker-${{ runner.os }}-${{ github.run_id }}

      - name: Upload durable tracker state
        if: ${{ always() && hashFiles('.trade-tracker/legislative/state.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: legislative-tracker-state
          path: .trade-tracker/legislative
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Upload run outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: legislative-purchase-output-${{ github.run_id }}
          path: |
            legislative-result.json
            legislative-latest-purchases.csv
            legislative-latest-transactions.csv
            legislative-latest-filings.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Signal tracker success
        if: ${{ always() && !failure() && steps.tracker.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.LEGISLATIVE_HEALTHCHECKS_PING_URL }}
        run: |
          if [[ -n "$HEALTHCHECKS_PING_URL" ]]; then
            curl --fail --silent --show-error --max-time 20 --retry 3 \
              "${HEALTHCHECKS_PING_URL%/}" >/dev/null
          fi

      - name: Signal tracker failure
        if: ${{ always() && failure() }}
        continue-on-error: true
        shell: bash
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.LEGISLATIVE_HEALTHCHECKS_PING_URL }}
        run: |
          if [[ -n "$HEALTHCHECKS_PING_URL" ]]; then
            if [[ -f legislative-result.json ]]; then
              curl --fail --silent --show-error --max-time 20 --retry 3 \
                --data-binary @legislative-result.json \
                "${HEALTHCHECKS_PING_URL%/}/fail" >/dev/null || true
            else
              curl --fail --silent --show-error --max-time 20 --retry 3 \
                --data "Workflow failed before legislative-result.json was created" \
                "${HEALTHCHECKS_PING_URL%/}/fail" >/dev/null || true
            fi
          fi

      - name: Send Pushover failure notification
        if: ${{ always() && failure() }}
        continue-on-error: true
        shell: bash
        env:
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          if [[ -n "$PUSHOVER_API_TOKEN" && -n "$PUSHOVER_USER_KEY" ]]; then
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            curl --fail --silent --show-error --max-time 20 --retry 3 \
              --form-string "token=$PUSHOVER_API_TOKEN" \
              --form-string "user=$PUSHOVER_USER_KEY" \
              --form-string "title=Legislative purchase tracker failed" \
              --form-string "message=Open the GitHub Actions run for logs and the result artifact." \
              --form-string "url=$run_url" \
              --form-string "url_title=Open failed workflow" \
              https://api.pushover.net/1/messages.json >/dev/null
          fi
