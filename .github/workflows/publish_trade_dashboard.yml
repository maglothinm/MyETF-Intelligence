name: Publish government trade dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish_trade_dashboard.yml"
      - "scripts/build_trade_dashboard.py"
      - "scripts/investor_edge.py"
      - "config/investor_edge.yml"
      - "requirements-ai.txt"
  workflow_run:
    workflows:
      - Legislative purchase tracker v2
      - Executive purchase tracker
      - AI filing analyst and paper portfolio
      - Run $10K portfolio simulator
    types:
      - completed

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: government-trade-dashboard-pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dashboard dependencies
        shell: bash
        run: python -m pip install --requirement requirements-ai.txt

      - name: Restore latest tracker state artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p dashboard-input
          consumer_sha="$(git rev-parse HEAD)"
          live_default_sha="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" \
              --jq '.object.sha'
          )"
          if [[ "$consumer_sha" != "$live_default_sha" ]]; then
            echo "This queued dashboard checked out ${consumer_sha}, but ${DEFAULT_BRANCH} is now ${live_default_sha}; refusing stale-code publication." >&2
            exit 1
          fi

          restore_state_artifact() {
            local branch="$1"
            local artifact_name="$2"
            local workflow_file="$3"
            local workflow_name="$4"
            local required="$5"
            local artifact_id=""
            local producer_run_id=""
            local producer_run_attempt=""
            local producer_run_created_at=""
            local producer_workflow_id=""
            local authoritative_job=""
            case "$workflow_file" in
              legislative_trade_tracker_v2.yml | executive_trade_tracker.yml)
                authoritative_job="track"
                ;;
              ai_filing_analyst.yml)
                authoritative_job="analyze"
                ;;
              *)
                echo "No authoritative producer job is defined for ${workflow_file}." >&2
                exit 1
                ;;
            esac

            while IFS=$'\t' read -r candidate_artifact_id candidate_run_id candidate_created_at; do
              [[ -n "$candidate_artifact_id" && -n "$candidate_run_id" ]] || continue
              run_payload="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}"
              )"
              current_run_attempt="$(jq -r '.run_attempt // 1' <<< "$run_payload")"
              if [[ ! "$current_run_attempt" =~ ^[1-9][0-9]*$ ]]; then
                continue
              fi
              matched_attempt=""
              attempt_payload=""
              for (( attempt_number = 1; attempt_number <= current_run_attempt; attempt_number += 1 )); do
                candidate_attempt_payload="$(
                  gh api \
                    -H "Accept: application/vnd.github+json" \
                    "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/attempts/${attempt_number}"
                )"
                attempt_started_at="$(jq -r '.run_started_at // ""' <<< "$candidate_attempt_payload")"
                next_attempt_started_at=""
                if (( attempt_number < current_run_attempt )); then
                  next_attempt_started_at="$(
                    gh api \
                      -H "Accept: application/vnd.github+json" \
                      "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/attempts/$((attempt_number + 1))" \
                      --jq '.run_started_at // ""'
                  )"
                fi
                if [[ \
                  -n "$attempt_started_at" && \
                  ( "$candidate_created_at" == "$attempt_started_at" || "$candidate_created_at" > "$attempt_started_at" ) && \
                  ( -z "$next_attempt_started_at" || "$candidate_created_at" < "$next_attempt_started_at" ) \
                ]]; then
                  matched_attempt="$attempt_number"
                  attempt_payload="$candidate_attempt_payload"
                  break
                fi
              done
              [[ -n "$matched_attempt" && -n "$attempt_payload" ]] || continue
              run_name="$(jq -r '.name // ""' <<< "$attempt_payload")"
              run_path="$(jq -r '.path // ""' <<< "$attempt_payload")"
              run_path="${run_path%%@*}"
              run_branch="$(jq -r '.head_branch // ""' <<< "$attempt_payload")"
              run_conclusion="$(jq -r '.conclusion // ""' <<< "$attempt_payload")"
              run_started_at="$(jq -r '.run_started_at // ""' <<< "$attempt_payload")"
              run_repository_id="$(jq -r '.repository.id // ""' <<< "$attempt_payload")"
              run_head_sha="$(jq -r '.head_sha // ""' <<< "$attempt_payload")"
              if [[ \
                "$run_name" == "$workflow_name" && \
                "$run_path" == ".github/workflows/${workflow_file}" && \
                "$run_branch" == "$DEFAULT_BRANCH" && \
                "$run_conclusion" == "success" && \
                "$run_repository_id" == "$GITHUB_REPOSITORY_ID" && \
                -n "$run_head_sha" && \
                -n "$run_started_at" \
              ]]; then
                successful_producer_jobs="$(
                  gh api \
                    -H "Accept: application/vnd.github+json" \
                    "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/attempts/${matched_attempt}/jobs" \
                    --jq "[.jobs[] | select(.name == \"${authoritative_job}\" and .conclusion == \"success\")] | length"
                )"
                compare_status="$(
                  gh api \
                    -H "Accept: application/vnd.github+json" \
                    "/repos/${GITHUB_REPOSITORY}/compare/${run_head_sha}...${consumer_sha}" \
                    --jq '.status'
                )"
                if (( successful_producer_jobs > 0 )) && \
                  [[ "$compare_status" == "ahead" || "$compare_status" == "identical" ]]; then
                  artifact_id="$candidate_artifact_id"
                  producer_run_id="$candidate_run_id"
                  producer_run_attempt="$matched_attempt"
                  producer_run_created_at="$(jq -r '.created_at // ""' <<< "$attempt_payload")"
                  producer_workflow_id="$(jq -r '.workflow_id // ""' <<< "$attempt_payload")"
                  break
                fi
              fi
            done < <(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" \
                --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse[] | [.id, .workflow_run.id, .created_at] | @tsv'
            )

            if [[ -z "$artifact_id" ]]; then
              if [[ "$required" == "true" ]]; then
                echo "No provenance-valid ${artifact_name} artifact is available; refusing to publish without ${branch} data." >&2
                exit 1
              fi
              echo "No provenance-valid ${artifact_name} artifact is available; continuing without optional ${branch} data."
              return 0
            fi
            if [[ -z "$producer_run_attempt" || -z "$producer_run_created_at" || -z "$producer_workflow_id" ]]; then
              echo "Selected ${artifact_name} has incomplete workflow provenance." >&2
              exit 1
            fi

            local high_water_violations=""
            local producer_attempt_count
            producer_attempt_count="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${producer_run_id}" \
                --jq '.run_attempt // 1'
            )"
            if [[ ! "$producer_attempt_count" =~ ^[1-9][0-9]*$ ]]; then
              echo "Selected ${artifact_name} has invalid run-attempt provenance." >&2
              exit 1
            fi
            for (( attempt_number = producer_run_attempt + 1; attempt_number <= producer_attempt_count; attempt_number += 1 )); do
              successful_state_jobs="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${producer_run_id}/attempts/${attempt_number}/jobs" \
                  --jq "[.jobs[] | select(.name == \"${authoritative_job}\" and .conclusion == \"success\")] | length"
              )"
              if (( successful_state_jobs > 0 )); then
                high_water_violations+="${high_water_violations:+$'\n'}${producer_run_id}:attempt-${attempt_number}"
              fi
            done

            local rerun_page=1
            while :; do
              local rerun_payload page_count oldest_run_id
              rerun_payload="$(
                gh api --method GET \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/workflows/${producer_workflow_id}/runs" \
                  -f per_page=100 \
                  -f page="$rerun_page"
              )"
              page_count="$(jq '.workflow_runs | length' <<< "$rerun_payload")"
              while IFS=$'\t' read -r rerun_candidate_id rerun_attempt_count; do
                [[ -n "$rerun_candidate_id" ]] || continue
                [[ "$rerun_attempt_count" =~ ^[1-9][0-9]*$ ]] || rerun_attempt_count=1
                for (( attempt_number = 1; attempt_number <= rerun_attempt_count; attempt_number += 1 )); do
                  successful_state_jobs="$(
                    gh api \
                      -H "Accept: application/vnd.github+json" \
                      "/repos/${GITHUB_REPOSITORY}/actions/runs/${rerun_candidate_id}/attempts/${attempt_number}/jobs" \
                      --jq "[.jobs[] | select(.name == \"${authoritative_job}\" and .conclusion == \"success\")] | length"
                  )"
                  if (( successful_state_jobs > 0 )); then
                    high_water_violations+="${high_water_violations:+$'\n'}${rerun_candidate_id}:attempt-${attempt_number}"
                    break
                  fi
                done
              done < <(
                jq -r --argjson predecessor "$producer_run_id" --arg branch "$DEFAULT_BRANCH" \
                  '.workflow_runs[] | select(.id > $predecessor and .head_branch == $branch) | [.id, (.run_attempt // 1)] | @tsv' \
                  <<< "$rerun_payload"
              )
              if [[ -n "$high_water_violations" ]]; then
                break
              fi
              if (( page_count == 0 || page_count < 100 )); then
                break
              fi
              oldest_run_id="$(jq '[.workflow_runs[].id] | min' <<< "$rerun_payload")"
              if (( oldest_run_id <= producer_run_id )); then
                break
              fi
              ((rerun_page += 1))
            done
            if [[ -n "$high_water_violations" ]]; then
              echo "${workflow_name} high-water violation at ${high_water_violations//$'\n'/, }; refusing to consume missing, ineligible, or rerun protected state." >&2
              exit 1
            fi

            local temp_dir
            temp_dir="$(mktemp -d)"
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              > "${temp_dir}/state.zip"
            mkdir -p "${temp_dir}/unpacked"
            unzip -q "${temp_dir}/state.zip" -d "${temp_dir}/unpacked"

            local state_file
            state_file="$(find "${temp_dir}/unpacked" -type f -name state.json -print -quit)"
            if [[ -z "$state_file" ]]; then
              echo "Artifact ${artifact_id} (${artifact_name}) contains no state.json." >&2
              exit 1
            fi

            mkdir -p "dashboard-input/${branch}"
            cp -R "$(dirname "$state_file")/." "dashboard-input/${branch}/"
            chmod -R a-w "dashboard-input/${branch}"
            echo "Restored read-only ${branch} dashboard data from artifact ${artifact_id}, successful run ${producer_run_id}, attempt ${producer_run_attempt}."
          }

          restore_state_artifact \
            legislative \
            legislative-tracker-state \
            legislative_trade_tracker_v2.yml \
            "Legislative purchase tracker v2" \
            true
          restore_state_artifact \
            executive \
            executive-tracker-state \
            executive_trade_tracker.yml \
            "Executive purchase tracker" \
            true
          restore_state_artifact \
            ai \
            ai-analysis-state \
            ai_filing_analyst.yml \
            "AI filing analyst and paper portfolio" \
            true

      - name: Restore optional verified simulation state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p dashboard-input/simulation
          artifact_id=""
          producer_run_id=""
          producer_run_attempt=""
          consumer_sha="$(git rev-parse HEAD)"

          while IFS=$'\t' read -r candidate_artifact_id candidate_run_id candidate_created_at; do
            [[ -n "$candidate_artifact_id" && -n "$candidate_run_id" ]] || continue
            run_payload="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}"
            )"
            current_run_attempt="$(jq -r '.run_attempt // 1' <<< "$run_payload")"
            if [[ ! "$current_run_attempt" =~ ^[1-9][0-9]*$ ]]; then
              continue
            fi

            matched_attempt=""
            attempt_payload=""
            for (( attempt_number = 1; attempt_number <= current_run_attempt; attempt_number += 1 )); do
              candidate_attempt_payload="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/attempts/${attempt_number}"
              )"
              attempt_started_at="$(jq -r '.run_started_at // ""' <<< "$candidate_attempt_payload")"
              next_attempt_started_at=""
              if (( attempt_number < current_run_attempt )); then
                next_attempt_started_at="$(
                  gh api \
                    -H "Accept: application/vnd.github+json" \
                    "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/attempts/$((attempt_number + 1))" \
                    --jq '.run_started_at // ""'
                )"
              fi
              if [[ \
                -n "$attempt_started_at" && \
                ( "$candidate_created_at" == "$attempt_started_at" || "$candidate_created_at" > "$attempt_started_at" ) && \
                ( -z "$next_attempt_started_at" || "$candidate_created_at" < "$next_attempt_started_at" ) \
              ]]; then
                matched_attempt="$attempt_number"
                attempt_payload="$candidate_attempt_payload"
                break
              fi
            done
            [[ -n "$matched_attempt" && -n "$attempt_payload" ]] || continue

            run_name="$(jq -r '.name // ""' <<< "$attempt_payload")"
            run_path="$(jq -r '.path // ""' <<< "$attempt_payload")"
            run_path="${run_path%%@*}"
            run_branch="$(jq -r '.head_branch // ""' <<< "$attempt_payload")"
            run_conclusion="$(jq -r '.conclusion // ""' <<< "$attempt_payload")"
            run_started_at="$(jq -r '.run_started_at // ""' <<< "$attempt_payload")"
            run_repository_id="$(jq -r '.repository.id // ""' <<< "$attempt_payload")"
            run_head_sha="$(jq -r '.head_sha // ""' <<< "$attempt_payload")"

            if [[ \
              "$run_name" == 'Run $10K portfolio simulator' && \
              "$run_path" == ".github/workflows/filing_simulation.yml" && \
              "$run_branch" == "$DEFAULT_BRANCH" && \
              "$run_conclusion" == "success" && \
              "$run_repository_id" == "$GITHUB_REPOSITORY_ID" && \
              -n "$run_head_sha" && \
              -n "$run_started_at" \
            ]]; then
              successful_simulate_jobs="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/attempts/${matched_attempt}/jobs" \
                  --jq '[.jobs[] | select(.name == "simulate" and .conclusion == "success")] | length'
              )"
              compare_status="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/compare/${run_head_sha}...${consumer_sha}" \
                  --jq '.status'
              )"
              if (( successful_simulate_jobs > 0 )) && \
                [[ "$compare_status" == "ahead" || "$compare_status" == "identical" ]]; then
                artifact_id="$candidate_artifact_id"
                producer_run_id="$candidate_run_id"
                producer_run_attempt="$matched_attempt"
                break
              fi
            fi
          done < <(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=simulation-state&per_page=100" \
              --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse[] | [.id, .workflow_run.id, .created_at] | @tsv'
          )

          if [[ -z "$artifact_id" ]]; then
            echo "No simulation-state artifact passed producer provenance checks; publishing without optional simulation data."
            exit 0
          fi

          temp_dir="$(mktemp -d)"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "${temp_dir}/state.zip"
          mkdir -p "${temp_dir}/unpacked"
          unzip -q "${temp_dir}/state.zip" -d "${temp_dir}/unpacked"
          result_file="$(find "${temp_dir}/unpacked" -type f -name simulation-result.json -print -quit)"
          history_file="$(find "${temp_dir}/unpacked" -type f -name simulation-runs.jsonl -print -quit)"
          if [[ \
            -z "$result_file" || \
            -z "$history_file" || \
            "$(dirname "$result_file")" != "$(dirname "$history_file")" \
          ]]; then
            echo "Verified producer artifact ${artifact_id} lacks a colocated simulation result and history; publishing without optional simulation data." >&2
            exit 0
          fi

          if ! python - "$result_file" "$history_file" "$producer_run_id" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text())
          history = [
              json.loads(line)
              for line in Path(sys.argv[2]).read_text().splitlines()
              if line.strip()
          ]
          producer_run_id = sys.argv[3]
          if not isinstance(result, dict) or not history or history[-1] != result:
              raise SystemExit("simulation result and history are inconsistent")
          if not all(isinstance(record, dict) for record in history):
              raise SystemExit("simulation history contains a non-object record")
          if result.get("status") != "success" or result.get("success") is not True:
              raise SystemExit("simulation result is not successful")
          if not str(result.get("run_url") or "").endswith(f"/actions/runs/{producer_run_id}"):
              raise SystemExit("simulation result run URL does not match its producer")
          safety = result.get("safety") or {}
          if safety.get("paper_only") is not True or safety.get("production_inputs_mutated") is not False:
              raise SystemExit("simulation result lacks paper-only safety attestations")
          PY
          then
            echo "Verified producer artifact ${artifact_id} failed simulation-content validation; publishing without optional simulation data." >&2
            exit 0
          fi

          cp "$result_file" dashboard-input/simulation/simulation-result.json
          echo "Restored optional simulation state from artifact ${artifact_id}, successful default-branch run ${producer_run_id}, attempt ${producer_run_attempt}."

      - name: Build searchable dashboard
        shell: bash
        run: |
          python scripts/build_trade_dashboard.py \
            --legislative-dir dashboard-input/legislative \
            --executive-dir dashboard-input/executive \
            --ai-dir dashboard-input/ai \
            --simulation-dir dashboard-input/simulation \
            --output-dir trade-dashboard-site

      - name: Validate generated dashboard
        shell: bash
        run: |
          set -euo pipefail
          test -s trade-dashboard-site/index.html
          test -s trade-dashboard-site/wallboard.html
          test -s trade-dashboard-site/wallboard.css
          test -s trade-dashboard-site/wallboard.js
          test -s trade-dashboard-site/investor-edge.html
          test -s trade-dashboard-site/investor-edge.css
          test -s trade-dashboard-site/investor-edge.js
          test -s trade-dashboard-site/data/summary.json
          test -s trade-dashboard-site/data/investor-edge.json
          test -s trade-dashboard-site/data/simulation.json
          test -s trade-dashboard-site/data/filings.csv
          test -s trade-dashboard-site/data/transactions.csv
          test -s trade-dashboard-site/data/ai-analyses.csv
          test -s trade-dashboard-site/data/paper-portfolio.csv
          python -m json.tool trade-dashboard-site/data/simulation.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("trade-dashboard-site/data/summary.json").read_text())
          print(
              "Dashboard dataset:",
              summary.get("filing_count", 0), "filings,",
              summary.get("transaction_count", 0), "transactions,",
              summary.get("review_count", 0), "review items,",
              summary.get("analysis_count", 0), "AI analyses,",
              summary.get("open_paper_position_count", 0), "open paper positions",
          )
          PY
          if command -v node >/dev/null 2>&1; then
            node --check trade-dashboard-site/app.js
            node --check trade-dashboard-site/wallboard.js
            node --check trade-dashboard-site/investor-edge.js
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: trade-dashboard-site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
