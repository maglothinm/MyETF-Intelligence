name: Reconcile failed Phase 5 promotion 33979778020

on:
  workflow_dispatch:
    inputs:
      frozen_main_sha:
        description: Exact 40-character canonical main SHA to freeze for this retry
        required: true
        type: string
      failed_phase5_run_id:
        description: Exact failed Phase 5 run being reconciled (33979778020)
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: runtime-v2-live-controller
  cancel-in-progress: false

jobs:
  reconcile-and-retry:
    if: >-
      github.repository_id == '1349678672' &&
      github.ref == 'refs/heads/main' &&
      inputs.failed_phase5_run_id == '33979778020' &&
      inputs.frozen_main_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PROJECT_ID: project-38008d5f-4918-46e6-920
      PROJECT_NUMBER: "497412818801"
      REGION: us-central1
      WIF_PROVIDER: projects/497412818801/locations/global/workloadIdentityPools/polititrack-github-phase3/providers/phase3-main
      DEPLOYER_SERVICE_ACCOUNT: polititrack-phase3-deployer@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com
      PRIVATE_WEB_AUDIENCE: https://polititrack-web-s6icmprjvq-uc.a.run.app
      APPROVED_IMAGE: us-central1-docker.pkg.dev/project-38008d5f-4918-46e6-920/polititrack/runtime-v2@sha256:420670e057036ebd78527aefdadaae30eeb360fcbe82865173861b19b303dc21
      RUNTIME_SOURCE_REVISION: 8908f067298078f8c013e90cf6b7ad8ad420285b
      PHASE5_RETRY_DESCRIPTOR: deploy/runtime-v2/phase5-retry-evidence-33979778020.json
      EVIDENCE_DIR: phase5-retry-live
      ROLLBACK_EVIDENCE_DIR: phase5-retry-rollback-publication
      CONTROL_REVISION: ${{ inputs.frozen_main_sha }}
      RETRY_FAILED_RUN_ID: ${{ inputs.failed_phase5_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the acknowledged frozen main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CONTROL_REVISION }}
          fetch-depth: 0

      - name: Bind the exact incident and download immutable evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          [[ "${APPROVED_IMAGE}" == "$(jq -er '.immutable_image' "${PHASE5_RETRY_DESCRIPTOR}")" ]]
          [[ "${RUNTIME_SOURCE_REVISION}" == "$(jq -er '.runtime_source_revision' "${PHASE5_RETRY_DESCRIPTOR}")" ]]
          source deploy/runtime-v2/runtime_promotion_control.sh
          source deploy/runtime-v2/runtime_promotion_observed_state.sh
          source deploy/runtime-v2/phase4_reconciliation_control.sh
          source deploy/runtime-v2/phase5_failed_promotion_retry_control.sh

          # These exact workflows are manually frozen before dispatch so the
          # protected-artifact high-water cannot move while it is downloaded.
          phase5_retry_write_frozen_legacy_states
          verify_legacy_workflows_match_observed
          drain_legacy_workflows
          phase5_retry_verify_descriptor_identity
          [[ "${RETRY_FAILED_RUN_ID}" == "$(jq -r '.failed_phase5.run_id | tostring' "${PHASE5_RETRY_DESCRIPTOR}")" ]] || {
            echo "The acknowledged failed run does not match the checked-in incident descriptor." >&2
            exit 1
          }
          phase5_retry_verify_frozen_context
          phase5_retry_download_incident_evidence

      - name: Authenticate as constrained deployer
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.PRIVATE_WEB_AUDIENCE }}
          id_token_include_email: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Mark authenticated cloud control available
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          touch "${EVIDENCE_DIR}/cloud-control-available"

      - name: Reconcile the failed prefix and execute one fresh serialized smoke cycle
        # The two tracked rollback recoveries can each wait up to 30 minutes.
        # Bound live control to two hours and retain nearly two hours of job
        # budget (less setup) for rollback, verification, and evidence upload.
        timeout-minutes: 120
        shell: bash
        env:
          PRIVATE_WEB_ID_TOKEN: ${{ steps.google-auth.outputs.id_token }}
        run: |
          set -Eeuo pipefail
          private_web_id_token="${PRIVATE_WEB_ID_TOKEN:-}"
          unset PRIVATE_WEB_ID_TOKEN
          source deploy/runtime-v2/runtime_promotion_control.sh
          source deploy/runtime-v2/runtime_promotion_observed_state.sh
          source deploy/runtime-v2/phase4_reconciliation_control.sh
          source deploy/runtime-v2/phase5_failed_promotion_retry_control.sh
          phase5_retry_write_frozen_legacy_states
          rm -f -- "${EVIDENCE_DIR}/live-mutation-started"

          promotion_complete=false
          rollback() {
            local original_status=$?
            trap - EXIT
            private_web_id_token=""
            if [[ "${promotion_complete}" != "true" &&
                  -f "${EVIDENCE_DIR}/live-mutation-started" ]]; then
              phase5_retry_rollback || true
            fi
            exit "${original_status}"
          }
          trap rollback EXIT

          # The retry starts only from the exact, fully verified rollback state.
          verify_project_boundary
          phase5_retry_verify_safe_rollback_state
          phase5_retry_capture_private_id_token_claims "${private_web_id_token}"

          # The workflows remain physically frozen.  This atomic file records
          # the exact service-bearing route that rollback must restore if any
          # subsequent cloud mutation fails.
          phase5_retry_write_observed_legacy_states
          [[ "$(phase5_retry_observed_legacy_route_kind)" == "historic_active" ]]
          touch "${EVIDENCE_DIR}/live-mutation-started"
          phase5_retry_capture_current_logging_view_absence_receipt
          grant_execution_authority
          capture_status "${EVIDENCE_DIR}/current-status.json" retry-current-status
          current_dashboard_digest="$(phase5_retry_current_dashboard_digest \
            "${EVIDENCE_DIR}/current-status.json")"
          phase5_retry_grant_private_web_invoker
          phase5_retry_capture_private_ai_analyses \
            "${EVIDENCE_DIR}/current-ai-analyses.json" "${current_dashboard_digest}" \
            "${private_web_id_token}"
          private_web_id_token=""
          phase5_retry_verify_private_web_invoker_removed

          run_failed_phase5_replay() {
            local inventory_suffix="$1" output="$2"
            python deploy/runtime-v2/reconcile_phase5_failed_promotion.py replay \
              --descriptor "${PHASE5_RETRY_DESCRIPTOR}" \
              --repository-root . \
              --current-status "${EVIDENCE_DIR}/current-status.json" \
              --current-ai-analyses "${EVIDENCE_DIR}/current-ai-analyses.json" \
              --phase4-run-metadata "${PHASE5_RETRY_INCIDENT_DIR}/phase4-run.json" \
              --phase4-artifact-metadata "${PHASE5_RETRY_INCIDENT_DIR}/phase4-artifact.json" \
              --phase4-jobs-metadata "${PHASE5_RETRY_INCIDENT_DIR}/phase4-jobs.json" \
              --phase4-archive "${PHASE5_RETRY_INCIDENT_DIR}/phase4.zip" \
              --failed-run-metadata "${PHASE5_RETRY_INCIDENT_DIR}/failed-phase5-run.json" \
              --failed-artifact-metadata "${PHASE5_RETRY_INCIDENT_DIR}/failed-phase5-artifact.json" \
              --failed-jobs-metadata "${PHASE5_RETRY_INCIDENT_DIR}/failed-phase5-jobs.json" \
              --failed-archive "${PHASE5_RETRY_INCIDENT_DIR}/failed-phase5.zip" \
              --failed-retry-run-metadata "${PHASE5_RETRY_INCIDENT_DIR}/failed-retry-run.json" \
              --failed-retry-artifact-metadata "${PHASE5_RETRY_INCIDENT_DIR}/failed-retry-artifact.json" \
              --failed-retry-jobs-metadata "${PHASE5_RETRY_INCIDENT_DIR}/failed-retry-jobs.json" \
              --failed-retry-archive "${PHASE5_RETRY_INCIDENT_DIR}/failed-retry.zip" \
              --legacy-ai-run-metadata "${PHASE5_RETRY_INCIDENT_DIR}/concurrent-legacy-ai-run.json" \
              --legacy-ai-jobs-metadata "${PHASE5_RETRY_INCIDENT_DIR}/concurrent-legacy-ai-jobs.json" \
              --legacy-ai-predecessor-artifact-metadata "${PHASE5_RETRY_INCIDENT_DIR}/concurrent-legacy-ai-predecessor-artifact.json" \
              --legacy-ai-predecessor-archive "${PHASE5_RETRY_INCIDENT_DIR}/concurrent-legacy-ai-predecessor.zip" \
              --legacy-ai-state-artifact-metadata "${PHASE5_RETRY_INCIDENT_DIR}/concurrent-legacy-ai-state-artifact.json" \
              --legacy-ai-state-archive "${PHASE5_RETRY_INCIDENT_DIR}/concurrent-legacy-ai-state.zip" \
              --legacy-ai-output-artifact-metadata "${PHASE5_RETRY_INCIDENT_DIR}/concurrent-legacy-ai-output-artifact.json" \
              --legacy-ai-output-archive "${PHASE5_RETRY_INCIDENT_DIR}/concurrent-legacy-ai-output.zip" \
              --recovery-run-metadata "${PHASE5_RETRY_INCIDENT_DIR}/recovery-legislative-run.json" \
              --recovery-run-metadata "${PHASE5_RETRY_INCIDENT_DIR}/recovery-executive-run.json" \
              --recovery-jobs-metadata "${PHASE5_RETRY_INCIDENT_DIR}/recovery-legislative-jobs.json" \
              --recovery-jobs-metadata "${PHASE5_RETRY_INCIDENT_DIR}/recovery-executive-jobs.json" \
              --recovery-predecessor-artifact-metadata "${PHASE5_RETRY_INCIDENT_DIR}/recovery-legislative-predecessor-artifact.json" \
              --recovery-predecessor-artifact-metadata "${PHASE5_RETRY_INCIDENT_DIR}/recovery-executive-predecessor-artifact.json" \
              --recovery-predecessor-archive "${PHASE5_RETRY_INCIDENT_DIR}/recovery-legislative-predecessor.zip" \
              --recovery-predecessor-archive "${PHASE5_RETRY_INCIDENT_DIR}/recovery-executive-predecessor.zip" \
              --recovery-artifact-metadata "${PHASE5_RETRY_INCIDENT_DIR}/recovery-legislative-artifact.json" \
              --recovery-artifact-metadata "${PHASE5_RETRY_INCIDENT_DIR}/recovery-executive-artifact.json" \
              --recovery-archive "${PHASE5_RETRY_INCIDENT_DIR}/recovery-legislative.zip" \
              --recovery-archive "${PHASE5_RETRY_INCIDENT_DIR}/recovery-executive.zip" \
              --recovery-output-artifact-metadata "${PHASE5_RETRY_INCIDENT_DIR}/recovery-legislative-output-artifact.json" \
              --recovery-output-artifact-metadata "${PHASE5_RETRY_INCIDENT_DIR}/recovery-executive-output-artifact.json" \
              --recovery-output-archive "${PHASE5_RETRY_INCIDENT_DIR}/recovery-legislative-output.zip" \
              --recovery-output-archive "${PHASE5_RETRY_INCIDENT_DIR}/recovery-executive-output.zip" \
              --frozen-successor-run-metadata "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor-legislative-run.json" \
              --frozen-successor-run-metadata "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor-executive-run.json" \
              --frozen-successor-run-metadata "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor2-legislative-run.json" \
              --frozen-successor-run-metadata "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor2-executive-run.json" \
              --frozen-successor-jobs-metadata "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor-legislative-jobs.json" \
              --frozen-successor-jobs-metadata "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor-executive-jobs.json" \
              --frozen-successor-jobs-metadata "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor2-legislative-jobs.json" \
              --frozen-successor-jobs-metadata "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor2-executive-jobs.json" \
              --frozen-successor-artifact-metadata "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor-legislative-artifact.json" \
              --frozen-successor-artifact-metadata "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor-executive-artifact.json" \
              --frozen-successor-artifact-metadata "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor2-legislative-artifact.json" \
              --frozen-successor-artifact-metadata "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor2-executive-artifact.json" \
              --frozen-successor-archive "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor-legislative.zip" \
              --frozen-successor-archive "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor-executive.zip" \
              --frozen-successor-archive "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor2-legislative.zip" \
              --frozen-successor-archive "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor2-executive.zip" \
              --frozen-successor-output-artifact-metadata "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor-legislative-output-artifact.json" \
              --frozen-successor-output-artifact-metadata "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor-executive-output-artifact.json" \
              --frozen-successor-output-artifact-metadata "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor2-legislative-output-artifact.json" \
              --frozen-successor-output-artifact-metadata "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor2-executive-output-artifact.json" \
              --frozen-successor-output-archive "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor-legislative-output.zip" \
              --frozen-successor-output-archive "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor-executive-output.zip" \
              --frozen-successor-output-archive "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor2-legislative-output.zip" \
              --frozen-successor-output-archive "${PHASE5_RETRY_INCIDENT_DIR}/frozen-successor2-executive-output.zip" \
              --legacy-run-inventory "${PHASE5_RETRY_INCIDENT_DIR}/legacy-legislative-runs-${inventory_suffix}.json" \
              --legacy-run-inventory "${PHASE5_RETRY_INCIDENT_DIR}/legacy-executive-runs-${inventory_suffix}.json" \
              --legacy-run-inventory "${PHASE5_RETRY_INCIDENT_DIR}/legacy-ai-runs-${inventory_suffix}.json" \
              --legacy-run-inventory "${PHASE5_RETRY_INCIDENT_DIR}/legacy-dashboard-runs-${inventory_suffix}.json" \
              --legacy-artifact-inventory "${PHASE5_RETRY_INCIDENT_DIR}/legacy-legislative-artifacts-${inventory_suffix}.json" \
              --legacy-artifact-inventory "${PHASE5_RETRY_INCIDENT_DIR}/legacy-executive-artifacts-${inventory_suffix}.json" \
              --legacy-artifact-inventory "${PHASE5_RETRY_INCIDENT_DIR}/legacy-ai-artifacts-${inventory_suffix}.json" \
              --output "${output}"
          }
          verify_failed_phase5_replay() {
            local replay="$1"
            jq -e \
              '.result == "phase5_failed_promotion_reconciled" and
               .certification_eligible == false and
               (.invalidated_smoke_prefix.executions | length) == 4 and
               .reconciliation.additional_runtime_producer_execution_performed == false and
               .concurrent_legacy_ai.merge_or_import_authorized == false and
               .concurrent_legacy_ai.disposition == "quarantined_separate_legacy_artifact" and
               .reconciliation.legacy_ai_artifact_quarantined == true and
               .reconciliation.frozen_legacy_successors_verified == true and
               .reconciliation.failed_retry_intervening_attempt_verified == true and
               .failed_phase5_retry.certification_eligible == false and
               .reconciliation.legacy_high_water_verified == true' \
              "${replay}" >/dev/null
          }
          run_failed_phase5_replay downloaded "${EVIDENCE_DIR}/initial-failed-prefix-replay.json"
          verify_failed_phase5_replay "${EVIDENCE_DIR}/initial-failed-prefix-replay.json"

          # Recheck the frozen head immediately before touching either route.
          phase5_retry_verify_frozen_context
          disable_legacy_workflows
          drain_legacy_workflows
          verify_legacy_workflows_state disabled_manually
          phase5_retry_verify_legacy_high_water pre-route
          run_failed_phase5_replay pre-route "${EVIDENCE_DIR}/failed-prefix-replay.json"
          verify_failed_phase5_replay "${EVIDENCE_DIR}/failed-prefix-replay.json"
          (cd "${EVIDENCE_DIR}" && sha256sum failed-prefix-replay.json > failed-prefix-replay.sha256)
          chmod a-w "${EVIDENCE_DIR}/failed-prefix-replay.json" "${EVIDENCE_DIR}/failed-prefix-replay.sha256"
          touch "${EVIDENCE_DIR}/route-touched"
          configure_runtime production
          verify_runtime_configuration production
          verify_producer_scheduler_state PAUSED
          verify_vault_scheduler_paused
          date -u +'%Y-%m-%dT%H:%M:%S.%6NZ' > "${EVIDENCE_DIR}/fresh-cycle-started-at.txt"

          # This baseline is the exact continuation point.  The old four smokes
          # stay in failed-prefix-replay.json and are never copied into the new
          # observations stream or counted toward certification.
          capture_status "${EVIDENCE_DIR}/terminal-baseline.json" retry-terminal-baseline
          : > "${EVIDENCE_DIR}/observations.ndjson"

          legislative_execution="$(execute_producer legislative phase5_smoke retry-smoke-sequence-1)"
          capture_status "${EVIDENCE_DIR}/retry-smoke-sequence-1-legislative-status.json" \
            retry-smoke-sequence-1-legislative-status
          phase5_retry_append_observation 1 legislative "${legislative_execution}" \
            "${EVIDENCE_DIR}/retry-smoke-sequence-1-legislative-status.json"

          executive_execution="$(execute_producer executive phase5_smoke retry-smoke-sequence-2)"
          capture_status "${EVIDENCE_DIR}/retry-smoke-sequence-2-executive-status.json" \
            retry-smoke-sequence-2-executive-status
          phase5_retry_append_observation 2 executive "${executive_execution}" \
            "${EVIDENCE_DIR}/retry-smoke-sequence-2-executive-status.json"

          ai_execution="$(execute_producer ai phase5_smoke retry-smoke-sequence-3)"
          capture_status "${EVIDENCE_DIR}/retry-smoke-sequence-3-ai-status.json" \
            retry-smoke-sequence-3-ai-status
          phase5_retry_append_observation 3 ai "${ai_execution}" \
            "${EVIDENCE_DIR}/retry-smoke-sequence-3-ai-status.json"

          dashboard_execution="$(execute_producer dashboard phase5_smoke retry-smoke-sequence-4)"
          capture_status "${EVIDENCE_DIR}/retry-smoke-sequence-4-dashboard-status.json" \
            retry-smoke-sequence-4-dashboard-status
          phase5_retry_append_observation 4 dashboard "${dashboard_execution}" \
            "${EVIDENCE_DIR}/retry-smoke-sequence-4-dashboard-status.json"
          date -u +'%Y-%m-%dT%H:%M:%S.%6NZ' > "${EVIDENCE_DIR}/fresh-cycle-finished-at.txt"

          final_dashboard_digest="$(jq -er \
            '.heads[] | select(.namespace == "dashboard") | .snapshot_sha256 |
             select(test("^[0-9a-f]{64}$"))' \
            "${EVIDENCE_DIR}/retry-smoke-sequence-4-dashboard-status.json")"

          # Preserve raw, read-only proof that no legacy writer or additional
          # Runtime execution overlapped the fresh serialized cycle.
          phase5_retry_verify_legacy_high_water terminal
          phase5_retry_capture_disabled_legacy_workflow_states terminal
          phase5_retry_capture_runtime_execution_inventories terminal
          capture_status "${EVIDENCE_DIR}/terminal-confirmation.json" retry-terminal-confirmation
          jq -e --slurpfile expected \
            "${EVIDENCE_DIR}/retry-smoke-sequence-4-dashboard-status.json" \
            '.heads == $expected[0].heads and .latest_runs == $expected[0].latest_runs' \
            "${EVIDENCE_DIR}/terminal-confirmation.json" >/dev/null

          # Temporary authority is gone before the public route is opened.
          remove_execution_authority
          verify_execution_authority_removed
          collect_service_accounts
          remove_service_account_user
          verify_service_account_user_removed
          phase5_retry_remove_private_web_invoker
          phase5_retry_verify_private_web_invoker_removed
          phase5_retry_verify_frozen_context
          make_web_public
          phase5_retry_verify_public_web "${final_dashboard_digest}"
          verify_runtime_configuration production
          verify_legacy_workflows_state disabled_manually
          verify_cloud_sql_private
          verify_vault_scheduler_paused
          web_policy_has_public_invoker

          # The permanent Phase 3 role intentionally cannot activate schedules.
          # Snapshot all five schedulers.  A separate request.time-only,
          # read-only Role Viewer grant captures the live permanent role and is
          # physically removed before one JIT Scheduler Admin binding activates
          # the exact four producers.  Then remove that binding and prove the
          # vault and every scheduler specification unchanged.
          phase5_retry_verify_frozen_context
          phase5_retry_capture_scheduler_snapshot before
          phase5_retry_grant_scheduler_control
          phase5_retry_enable_exact_producer_schedulers_last
          phase5_retry_remove_scheduler_control
          phase5_retry_verify_scheduler_control_removed
          phase5_retry_capture_scheduler_snapshot after
          phase5_retry_finalize_scheduler_activation_evidence

          python - "${EVIDENCE_DIR}" "${RETRY_FAILED_RUN_ID}" <<'PY'
          import json
          import hashlib
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          failed_run_id = int(sys.argv[2])
          executions = [
              json.loads(line)
              for line in (root / "observations.ndjson").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          route = json.loads((root / "public-web-verification.json").read_text(encoding="utf-8"))
          replay = json.loads((root / "failed-prefix-replay.json").read_text(encoding="utf-8"))
          token_claims = json.loads(
              (root / "private-web-id-token-claims.json").read_text(encoding="utf-8")
          )
          auth_attempt = json.loads(
              (root / "private-ai-auth-attempts.json").read_text(encoding="utf-8")
          )
          revocation = json.loads(
              (root / "private-web-invoker-revocation.json").read_text(encoding="utf-8")
          )
          granted_policy = json.loads(
              (root / "resources" / "private-web-invoker-granted-policy.json").read_text(
                  encoding="utf-8"
              )
          )
          removed_policy = json.loads(
              (root / "resources" / "private-web-invoker-removed-policy.json").read_text(
                  encoding="utf-8"
              )
          )
          scheduler_authority_path = root / "resources" / "scheduler-activation-authority.json"
          scheduler_authority = json.loads(scheduler_authority_path.read_text(encoding="utf-8"))
          scheduler_transition = json.loads(
              (root / "resources" / "scheduler-transition.json").read_text(encoding="utf-8")
          )
          scheduler_granted_policy = json.loads(
              (root / "resources" / "scheduler-control-granted-policy.json").read_text(
                  encoding="utf-8"
              )
          )
          scheduler_before_policy = json.loads(
              (root / "resources" / "scheduler-control-before-policy.json").read_text(
                  encoding="utf-8"
              )
          )
          permanent_control_role = json.loads(
              (root / "resources" / "permanent-control-role.json").read_text(encoding="utf-8")
          )
          role_viewer_before_policy = json.loads(
              (root / "resources" / "role-viewer-before-policy.json").read_text(encoding="utf-8")
          )
          role_viewer_granted_policy = json.loads(
              (root / "resources" / "role-viewer-granted-policy.json").read_text(encoding="utf-8")
          )
          role_viewer_removed_policy = json.loads(
              (root / "resources" / "role-viewer-removed-policy.json").read_text(encoding="utf-8")
          )
          role_viewer_condition = json.loads(
              (root / "resources" / "role-viewer-condition.json").read_text(encoding="utf-8")
          )
          role_viewer_grant = json.loads(
              (root / "resources" / "role-viewer-grant.json").read_text(encoding="utf-8")
          )
          scheduler_removed_policy = json.loads(
              (root / "resources" / "scheduler-control-removed-policy.json").read_text(
                  encoding="utf-8"
              )
          )
          roles = ("legislative", "executive", "ai", "dashboard")

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          fresh_started = (root / "fresh-cycle-started-at.txt").read_text(encoding="utf-8").strip()
          fresh_finished = (root / "fresh-cycle-finished-at.txt").read_text(encoding="utf-8").strip()
          deployer_member = f"serviceAccount:{os.environ['DEPLOYER_SERVICE_ACCOUNT']}"

          def role_members(policy: dict, role: str) -> set[str]:
              return {
                  member
