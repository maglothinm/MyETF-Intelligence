          mkdir -p "${EVIDENCE_DIR}"

          # A later verification or upload error can occur after the provisional
          # certificate has been written.  The EXIT trap makes every rollback
          # exit path delete those affirmative files and only then atomically
          # expose a separate, explicitly noncertifying publication directory.
          publish_noncertifying_rollback_evidence() {
            local original_status=$?
            local completion_present=false completion_sha256=""
            local checksum_present=false checksum_sha256=""
            local manifest_present=false manifest_sha256=""
            local receipt_tmp publication_tmp
            trap - EXIT

            if [[ -e "${EVIDENCE_DIR}/phase5-complete.json" ]]; then
              completion_present=true
              completion_sha256="$(sha256sum "${EVIDENCE_DIR}/phase5-complete.json" | awk '{print $1}')"
            fi
            if [[ -e "${EVIDENCE_DIR}/phase5-complete.sha256" ]]; then
              checksum_present=true
              checksum_sha256="$(sha256sum "${EVIDENCE_DIR}/phase5-complete.sha256" | awk '{print $1}')"
            fi
            if [[ -e "${EVIDENCE_DIR}/terminal-manifest.json" ]]; then
              manifest_present=true
              manifest_sha256="$(sha256sum "${EVIDENCE_DIR}/terminal-manifest.json" | awk '{print $1}')"
            fi

            rm -f -- \
              "${EVIDENCE_DIR}/phase5-complete.json" \
              "${EVIDENCE_DIR}/phase5-complete.sha256" \
              "${EVIDENCE_DIR}/terminal-manifest.json"
            [[ ! -e "${EVIDENCE_DIR}/phase5-complete.json" ]]
            [[ ! -e "${EVIDENCE_DIR}/phase5-complete.sha256" ]]
            [[ ! -e "${EVIDENCE_DIR}/terminal-manifest.json" ]]

            receipt_tmp="${EVIDENCE_DIR}/phase5-completion-invalidation.json.tmp"
            jq -n \
              --arg invalidated_at "$(date -u +'%Y-%m-%dT%H:%M:%S.%6NZ')" \
              --arg run_id "${GITHUB_RUN_ID}" \
              --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg control_revision "${CONTROL_REVISION}" \
              --argjson completion_present "${completion_present}" \
              --arg completion_sha256 "${completion_sha256}" \
              --argjson checksum_present "${checksum_present}" \
              --arg checksum_sha256 "${checksum_sha256}" \
              --argjson manifest_present "${manifest_present}" \
              --arg manifest_sha256 "${manifest_sha256}" \
              '{
                schema_version: 1,
                result: "phase5_completion_evidence_invalidated",
                certification_eligible: false,
                phase5_completion_claim_valid: false,
                production_cutover_certified: false,
                trigger: "workflow_failure_or_cancellation",
                invalidated_at: $invalidated_at,
                run_id: $run_id,
                run_attempt: $run_attempt,
                control_revision: $control_revision,
                affirmative_completion_evidence_absent_before_rollback_artifact_upload: true,
                invalidated_files: [
                  {
                    path: "phase5-complete.json",
                    existed_before_invalidation: $completion_present,
                    prior_sha256: ($completion_sha256 | if length == 0 then null else . end),
                    disposition: (if $completion_present then "deleted_and_invalidated" else "not_created" end)
                  },
                  {
                    path: "phase5-complete.sha256",
                    existed_before_invalidation: $checksum_present,
                    prior_sha256: ($checksum_sha256 | if length == 0 then null else . end),
                    disposition: (if $checksum_present then "deleted_and_invalidated" else "not_created" end)
                  },
                  {
                    path: "terminal-manifest.json",
                    existed_before_invalidation: $manifest_present,
                    prior_sha256: ($manifest_sha256 | if length == 0 then null else . end),
                    disposition: (if $manifest_present then "deleted_and_invalidated" else "not_created" end)
                  }
                ]
              }' > "${receipt_tmp}"
            mv -- "${receipt_tmp}" "${EVIDENCE_DIR}/phase5-completion-invalidation.json"
            jq -e \
              '.result == "phase5_completion_evidence_invalidated" and
               .certification_eligible == false and
               .phase5_completion_claim_valid == false and
               .production_cutover_certified == false and
               .affirmative_completion_evidence_absent_before_rollback_artifact_upload == true and
               (.invalidated_files | length) == 3' \
              "${EVIDENCE_DIR}/phase5-completion-invalidation.json" >/dev/null

            [[ ! -e "${ROLLBACK_EVIDENCE_DIR}" ]]
            publication_tmp="${ROLLBACK_EVIDENCE_DIR}.tmp"
            [[ ! -e "${publication_tmp}" ]]
            mkdir "${publication_tmp}"
            cp -a "${EVIDENCE_DIR}/." "${publication_tmp}/"
            [[ ! -e "${publication_tmp}/phase5-complete.json" ]]
            [[ ! -e "${publication_tmp}/phase5-complete.sha256" ]]
            [[ ! -e "${publication_tmp}/terminal-manifest.json" ]]
            jq -e \
              '.certification_eligible == false and
               .phase5_completion_claim_valid == false and
               .production_cutover_certified == false and
               .affirmative_completion_evidence_absent_before_rollback_artifact_upload == true' \
              "${publication_tmp}/phase5-completion-invalidation.json" >/dev/null
            mv -- "${publication_tmp}" "${ROLLBACK_EVIDENCE_DIR}"
            exit "${original_status}"
          }
          trap publish_noncertifying_rollback_evidence EXIT

          if [[ ! -f "${EVIDENCE_DIR}/live-mutation-started" ]]; then
            source deploy/runtime-v2/runtime_promotion_control.sh
            source deploy/runtime-v2/runtime_promotion_observed_state.sh
            source deploy/runtime-v2/phase4_reconciliation_control.sh
            source deploy/runtime-v2/phase5_failed_promotion_retry_control.sh
            phase5_retry_write_frozen_legacy_states
            verify_legacy_workflows_state disabled_manually
            jq -n \
              --arg failed_at "$(date -u +'%Y-%m-%dT%H:%M:%S.%6NZ')" \
              '{schema_version:1,result:"phase5_retry_failed_before_live_mutation_fenced",
                failed_at:$failed_at,certification_eligible:false,live_mutation_performed:false,
                no_cloud_mutation_attempted_by_retry:true,legacy_route_restored:false,
                legacy_maintenance_fence_preserved:true,runtime_state_verified:false}' \
              > "${EVIDENCE_DIR}/retry-rollback.json"
            exit 0
          fi
          source deploy/runtime-v2/runtime_promotion_control.sh
          source deploy/runtime-v2/runtime_promotion_observed_state.sh
          source deploy/runtime-v2/phase4_reconciliation_control.sh
          source deploy/runtime-v2/phase5_failed_promotion_retry_control.sh
          phase5_retry_rollback
          [[ -f "${EVIDENCE_DIR}/retry-rollback-complete" ]]

      - name: Upload failed retry rollback evidence
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 10
        uses: actions/upload-artifact@v6
        with:
          name: phase5-failed-promotion-retry-rollback-33979778020
          # This directory is exposed atomically by the rollback EXIT trap only
          # after all affirmative completion files are absent and the explicit
          # noncertifying invalidation receipt has passed validation.
          path: ${{ env.ROLLBACK_EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 90
