name: Phase 5 Vault metadata repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase5_vault_admin_iam_repair.yml"
      - "deploy/runtime-v2/terraform/vault_admin_metadata.tf"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  repair-and-prove:
    if: github.repository_id == '1349678672'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: project-38008d5f-4918-46e6-920
      REGION: us-central1
      WIF_PROVIDER: projects/497412818801/locations/global/workloadIdentityPools/polititrack-github-phase3/providers/phase3-main
      DEPLOYER_SERVICE_ACCOUNT: polititrack-phase3-deployer@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com
      ADMIN_SERVICE_ACCOUNT: polititrack-admin-v2@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com
      WEB_SERVICE_ACCOUNT: polititrack-web-v2@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com
      VAULT_SERVICE_ACCOUNT: polititrack-vault-v2@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com
      ADMIN_JOB: polititrack-admin
      VAULT_JOB: polititrack-vault-lifecycle
      WEB_SERVICE: polititrack-web
      VAULT_BUCKET: project-38008d5f-4918-46e6-920-polititrack-vault
    steps:
      - uses: actions/checkout@v7

      - name: Validate durable Terraform bindings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase5-vault-metadata
          python - <<'PY'
          from pathlib import Path
          text = Path('deploy/runtime-v2/terraform/vault_admin_metadata.tf').read_text()
          required = (
              'resource "google_storage_bucket_iam_member" "vault_admin_metadata_viewer"',
              'resource "google_storage_bucket_iam_member" "vault_runtime_metadata_viewer"',
              'google_service_account.admin.email',
              'google_service_account.web.email',
              'google_service_account.vault.email',
              'roles/storage.bucketViewer',
          )
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f'Vault metadata bindings incomplete: {missing}')
          Path('phase5-vault-metadata/static-validation.txt').write_text(
              'metadata-only bindings validated\n', encoding='utf-8')
          PY

      - name: Authenticate as constrained deployer
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Apply bindings and prove schema initialization
        shell: bash
        run: |
          set -Eeuo pipefail
          deployer_member="serviceAccount:${DEPLOYER_SERVICE_ACCOUNT}"
          admin_member="serviceAccount:${ADMIN_SERVICE_ACCOUNT}"
          web_member="serviceAccount:${WEB_SERVICE_ACCOUNT}"
          vault_member="serviceAccount:${VAULT_SERVICE_ACCOUNT}"

          cleanup() {
            set +e
            gcloud run jobs remove-iam-policy-binding "${ADMIN_JOB}" \
              --project "${PROJECT_ID}" --region "${REGION}" \
              --member "${deployer_member}" --role roles/run.jobsExecutorWithOverrides \
              --quiet >/dev/null 2>&1 || true
            gcloud projects remove-iam-policy-binding "${PROJECT_ID}" \
              --member "${deployer_member}" --role roles/storage.admin \
              --condition=None --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud run jobs describe "${ADMIN_JOB}" --project "${PROJECT_ID}" --region "${REGION}" \
            --format=json > phase5-vault-metadata/admin.json
          gcloud run jobs describe "${VAULT_JOB}" --project "${PROJECT_ID}" --region "${REGION}" \
            --format=json > phase5-vault-metadata/vault-job.json
          gcloud run services describe "${WEB_SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" \
            --format=json > phase5-vault-metadata/web.json
          for file in admin.json vault-job.json web.json; do
            configured="$(jq -r '[.. | objects | select(.name? == "VAULT_GCS_BUCKET") | .value?][0] // empty' \
              "phase5-vault-metadata/${file}")"
            [[ "${configured}" == "${VAULT_BUCKET}" ]] || {
              echo "${file} Vault bucket is ${configured:-missing}, expected ${VAULT_BUCKET}." >&2
              exit 1
            }
          done

          gcloud projects add-iam-policy-binding "${PROJECT_ID}" \
            --member "${deployer_member}" --role roles/storage.admin \
            --condition=None --quiet --format=none
          visible=false
          for attempt in $(seq 1 18); do
            if gcloud storage buckets describe "gs://${VAULT_BUCKET}" --format=json \
              > phase5-vault-metadata/bucket.json 2>/dev/null; then
              visible=true
              break
            fi
            sleep 10
          done
          [[ "${visible}" == "true" ]] || { echo "Vault bucket did not become visible." >&2; exit 1; }

          for member in "${admin_member}" "${web_member}" "${vault_member}"; do
            gcloud storage buckets add-iam-policy-binding "gs://${VAULT_BUCKET}" \
              --member "${member}" --role roles/storage.bucketViewer --quiet >/dev/null
          done
          gcloud storage buckets get-iam-policy "gs://${VAULT_BUCKET}" --format=json \
            > phase5-vault-metadata/bucket-policy.json
          for member in "${admin_member}" "${web_member}" "${vault_member}"; do
            jq -e --arg member "${member}" \
              '[.bindings[]? | select(.role == "roles/storage.bucketViewer") | .members[]?] | any(. == $member)' \
              phase5-vault-metadata/bucket-policy.json >/dev/null
          done
          ! jq -e --arg member "${admin_member}" \
            '[.bindings[]? | select(.role == "roles/storage.objectAdmin") | .members[]?] | any(. == $member)' \
            phase5-vault-metadata/bucket-policy.json >/dev/null || {
              echo "Admin identity unexpectedly has object access." >&2
              exit 1
            }

          gcloud projects remove-iam-policy-binding "${PROJECT_ID}" \
            --member "${deployer_member}" --role roles/storage.admin \
            --condition=None --quiet --format=none
          project_policy="$(gcloud projects get-iam-policy "${PROJECT_ID}" --format=json)"
          ! jq -e --arg member "${deployer_member}" \
            '[.bindings[]? | select(.role == "roles/storage.admin") | .members[]?] | any(. == $member)' \
            <<<"${project_policy}" >/dev/null || { echo "Temporary Storage Admin remains." >&2; exit 1; }

          gcloud run jobs add-iam-policy-binding "${ADMIN_JOB}" \
            --project "${PROJECT_ID}" --region "${REGION}" \
            --member "${deployer_member}" --role roles/run.jobsExecutorWithOverrides \
            --quiet --format=none
          previous="$(gcloud run jobs describe "${ADMIN_JOB}" --project "${PROJECT_ID}" --region "${REGION}" \
            --format='value(status.latestCreatedExecution.name)')"
          gcloud run jobs execute "${ADMIN_JOB}" --project "${PROJECT_ID}" --region "${REGION}" \
            --wait --format=json > phase5-vault-metadata/admin-execute.json
          execution="$(gcloud run jobs describe "${ADMIN_JOB}" --project "${PROJECT_ID}" --region "${REGION}" \
            --format='value(status.latestCreatedExecution.name)')"
          [[ -n "${execution}" && "${execution}" != "${previous}" ]] || {
            echo "A new successful admin execution was not recorded." >&2
            exit 1
          }

          cleanup
          trap - EXIT
          remaining="$(gcloud run jobs get-iam-policy "${ADMIN_JOB}" \
            --project "${PROJECT_ID}" --region "${REGION}" --format=json)"
          ! jq -e --arg member "${deployer_member}" \
            '[.bindings[]? | select(.role == "roles/run.jobsExecutorWithOverrides") | .members[]?] | any(. == $member)' \
            <<<"${remaining}" >/dev/null || { echo "Temporary execution authority remains." >&2; exit 1; }

          jq -n --arg result vault_metadata_repaired --arg main_revision "${GITHUB_SHA}" \
            --arg bucket "${VAULT_BUCKET}" --arg admin_execution "${execution}" \
            --arg applied_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{result:$result,main_revision:$main_revision,bucket:$bucket,admin_web_lifecycle_metadata_access:true,admin_object_access:false,admin_init_success:true,temporary_storage_admin_removed:true,temporary_execution_authority_removed:true,applied_at:$applied_at}' \
            > phase5-vault-metadata/receipt.json
          sha256sum phase5-vault-metadata/receipt.json > phase5-vault-metadata/SHA256SUMS

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase5-vault-metadata-repair
          path: phase5-vault-metadata/
          if-no-files-found: error
          retention-days: 30
