name: Phase 3 read-only cloud boundary discovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase3_cloud_discovery.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  discover:
    if: github.repository_id == '1349678672' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_ID: project-38008d5f-4918-46e6-920
      PROJECT_NUMBER: "497412818801"
      REGION: us-central1
      DISCOVERY_SERVICE_ACCOUNT: polititrack-secret-transfer@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com
    steps:
      - name: Authenticate to established Google Cloud boundary
        uses: google-github-actions/auth@v3
        with:
          project_id: project-38008d5f-4918-46e6-920
          workload_identity_provider: projects/497412818801/locations/global/workloadIdentityPools/polititrack-github/providers/secret-transfer
          service_account: polititrack-secret-transfer@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Collect read-only Phase 3 boundary evidence
        shell: bash
        run: |
          set -uo pipefail
          report="phase3-cloud-boundary.txt"
          : > "$report"

          printf '%s\n' \
            "schema_version=1" \
            "repository_id=${GITHUB_REPOSITORY_ID}" \
            "repository=${GITHUB_REPOSITORY}" \
            "source_revision=${GITHUB_SHA}" \
            "project_id=${PROJECT_ID}" \
            "expected_project_number=${PROJECT_NUMBER}" \
            "selected_region=${REGION}" \
            "discovery_service_account=${DISCOVERY_SERVICE_ACCOUNT}" \
            "mode=shadow" \
            "schedules_enabled=false" \
            "public_dashboard_enabled=false" >> "$report"

          capture() {
            local label="$1"
            shift
            printf '\n## %s\n' "$label" >> "$report"
            local output
            if output=$("$@" 2>&1); then
              if [[ -n "$output" ]]; then
                printf '%s\n' "$output" >> "$report"
              else
                printf '[empty]\n' >> "$report"
              fi
            else
              local status=$?
              printf '[unavailable exit=%s]\n%s\n' "$status" "$output" >> "$report"
            fi
          }

          capture active_account \
            gcloud auth list --filter='status:ACTIVE' --format='value(account)'
          capture project \
            gcloud projects describe "$PROJECT_ID" --format=json
          capture billing \
            gcloud billing projects describe "$PROJECT_ID" --format=json
          capture enabled_services \
            gcloud services list --enabled --project "$PROJECT_ID" --format='value(config.name)'
          capture artifact_registry_us_central1 \
            gcloud artifacts repositories list --project "$PROJECT_ID" --location "$REGION" --format=json
          capture storage_buckets \
            gcloud storage buckets list --project "$PROJECT_ID" --format=json
          capture cloud_sql_instances \
            gcloud sql instances list --project "$PROJECT_ID" --format=json
          capture compute_networks \
            gcloud compute networks list --project "$PROJECT_ID" --format=json
          capture service_accounts \
            gcloud iam service-accounts list --project "$PROJECT_ID" --format='value(email,displayName)'
          capture discovery_service_account_project_roles \
            gcloud projects get-iam-policy "$PROJECT_ID" \
              --flatten='bindings[].members' \
              --filter="bindings.members:serviceAccount:${DISCOVERY_SERVICE_ACCOUNT}" \
              --format='value(bindings.role)'
          capture secret_ids_only \
            gcloud secrets list --project "$PROJECT_ID" --format='value(name)'
          capture workload_identity_provider \
            gcloud iam workload-identity-pools providers describe secret-transfer \
              --workload-identity-pool=polititrack-github \
              --location=global \
              --project="$PROJECT_ID" \
              --format=json
          capture cloud_run_jobs \
            gcloud run jobs list --project "$PROJECT_ID" --region "$REGION" --format=json
          capture cloud_run_services \
            gcloud run services list --project "$PROJECT_ID" --region "$REGION" --platform=managed --format=json
          capture cloud_scheduler_jobs \
            gcloud scheduler jobs list --project "$PROJECT_ID" --location "$REGION" --format=json

          cat "$report"

      - name: Upload read-only boundary receipt
        uses: actions/upload-artifact@v4
        with:
          name: phase3-cloud-boundary-${{ github.run_id }}
          path: phase3-cloud-boundary.txt
          if-no-files-found: error
          retention-days: 30
