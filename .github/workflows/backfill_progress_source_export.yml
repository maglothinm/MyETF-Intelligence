name: Backfill progress source export

# Temporary development-only export. Remove before merging issue #172.
# No production state, cloud permissions, secrets, dispatch or deployment.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/backfill_progress_source_export.yml'

permissions:
  contents: read

jobs:
  export:
    if: github.repository_id == '1349678672' && github.head_ref == 'work/investor-edge-backfill-progress-172'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Export tracked source only
        shell: bash
        run: |
          git archive --format=tar HEAD > source.tar
          sha256sum source.tar > source.tar.sha256
          git rev-parse HEAD > source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: backfill-source-${{ github.run_id }}
          path: |
            source.tar
            source.tar.sha256
            source-commit.txt
          retention-days: 1
