name: Phase 3 diagnostic trigger pulse

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase3_diagnostic_pulse.yml"

permissions:
  contents: read

jobs:
  pulse:
    if: github.repository_id == '1349678672' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Emit diagnostic trigger pulse
        shell: bash
        run: |
          set -euo pipefail
          echo "Phase 3 diagnostic trigger pulse: ${GITHUB_SHA}"
