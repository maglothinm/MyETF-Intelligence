name: Source upload and OCR tests

on:
  pull_request:
    paths:
      - 'runtime_v2/**'
      - 'scripts/source_ocr*.py'
      - 'scripts/oge*.py'
      - 'scripts/dashboard_insights.py'
      - 'scripts/government_trade_tracker_core.py'
      - 'scripts/build_trade_dashboard.py'
      - 'scripts/dashboard_assets/**'
      - 'tests/test_source_ocr*.py'
      - 'tests/test_oge_disclosures.py'
      - 'tests/fixtures/source-ocr/**'
      - 'tests/source_ocr_browser_preview.py'
      - 'tests/source_ocr_health.test.cjs'
      - 'requirements*.txt'
      - '.github/workflows/source_ocr_tests.yml'
  push:
    branches: [main]
    paths:
      - 'runtime_v2/**'
      - 'scripts/source_ocr*.py'
      - 'scripts/oge*.py'
      - 'scripts/dashboard_insights.py'
      - 'scripts/government_trade_tracker_core.py'
      - 'scripts/build_trade_dashboard.py'
      - 'scripts/dashboard_assets/**'
      - 'tests/test_source_ocr*.py'
      - 'tests/test_oge_disclosures.py'
      - 'tests/fixtures/source-ocr/**'
      - 'tests/source_ocr_browser_preview.py'
      - 'tests/source_ocr_health.test.cjs'
      - 'requirements*.txt'
      - '.github/workflows/source_ocr_tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNTIME_V2_TEST_POSTGRES: '1'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: runtime-v2-test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install OCR and application test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
          python -m pip install --requirement requirements-runtime-v2.txt
          python -m playwright install --with-deps chromium
      - name: Compile and run intake, OCR and preservation tests
        run: |
          python -m compileall -q runtime_v2 scripts/source_ocr.py
          node --check scripts/dashboard_assets/source-ocr.js
          node --test tests/source_ocr_health.test.cjs
          python -m pytest -q tests/test_oge_disclosures.py tests/test_source_ocr.py tests/test_source_ocr_runtime.py tests/test_source_ocr_independent.py tests/test_source_ocr_health.py tests/test_government_trade_tracker.py tests/test_historical_transaction_bootstrap.py tests/test_trade_dashboard.py tests/test_dashboard_insights.py tests/test_runtime_v2.py tests/test_runtime_v2_atomic_commit.py tests/test_runtime_v2_shadow_mode.py tests/test_runtime_v2_bootstrap_safety.py tests/test_personal_reviews.py tests/test_legislative_resilient_orchestrator.py tests/test_legislative_resilient_integration.py
      - name: Exercise isolated desktop and mobile correction UI
        run: python tests/source_ocr_browser_preview.py --output '${{ runner.temp }}/source-ocr-browser'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: source-ocr-browser-${{ github.sha }}
          path: ${{ runner.temp }}/source-ocr-browser/
          retention-days: 3
          if-no-files-found: error
