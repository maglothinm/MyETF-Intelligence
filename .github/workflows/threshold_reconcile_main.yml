name: Threshold final source reconciliation
on:
  push:
    branches: [codex/never-crossed-threshold-20260919]
    paths: [.github/workflows/threshold_reconcile_main.yml]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository_id == '1349678672' && github.ref == 'refs/heads/codex/never-crossed-threshold-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve both owner-approved source histories in a reviewed merge tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 6eeaacf454da467db0e3ec5980d7e0bb013470d3
          test "$(git rev-parse origin/main)" = 36604fc152c5926b235706e25e013acecaa4c908
          git config user.name 'PolitiTrack source reconciliation'
          git config user.email '225069210+maglothinm@users.noreply.github.com'
          python - <<'PY'
          import json,pathlib,subprocess
          main='36604fc152c5926b235706e25e013acecaa4c908'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          def show(ref,path):return subprocess.check_output(['git','show',ref+':'+path],text=True)
          feature={p:show(head,p) for p in ('docs/HANDOFF.md','docs/PROJECT_STATE.md','docs/DECISIONS.md')}
          run=subprocess.run(['git','merge','--no-commit','--no-ff',main],text=True,capture_output=True)
          print(run.stdout)
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert run.returncode in (0,1) and set(conflicts)<=set(feature),conflicts
          for p in ('docs/HANDOFF.md','docs/PROJECT_STATE.md'):
              s=feature[p];start=s.index('## Current Opportunity purchase threshold — production blocked (#197)')
              end=s.index('\n## ',start+4)
              section=s[start:end].rstrip()+'\n\n'
              current=show(main,p);assert 'purchase threshold — production blocked (#197)' not in current
              title,rest=current.split('\n',1)
              pathlib.Path(p).write_text(title+'\n\n'+section+rest.lstrip('\n'))
          p='docs/DECISIONS.md';s=feature[p];start=s.index('## D-2026-09-19-008 — Preserve per-purchase threshold history (#197)')
          current=show(main,p);assert 'Preserve per-purchase threshold history (#197)' not in current
          pathlib.Path(p).write_text(current.rstrip()+'\n\n\n'+s[start:].rstrip()+'\n')
          helper='.github/workflows/threshold_reconcile_main.yml';pathlib.Path(helper).unlink()
          subprocess.run(['git','add','--',*feature,helper],check=True)
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).strip()
          subprocess.run(['git','diff','--cached','--check',main],check=True)
          subprocess.run(['python','-m','compileall','-q','scripts/opportunity_threshold.py','scripts/verify_senate_pdf_release.py'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          paths=subprocess.check_output(['git','diff','--cached','--name-only',main],text=True).splitlines()
          assert not any(p.startswith('.github/') and p!='.github/workflows/runtime_v2_tests.yml' for p in paths),paths
          base_tree=subprocess.check_output(['git','rev-parse',head+'^{tree}'],text=True).strip()
          delta=subprocess.check_output(['git','diff','--cached','--name-status',head],text=True).splitlines()
          entries=[]
          for line in delta:
              status,p=line.split('\t',1)
              if status=='D':entries.append({'path':p,'mode':'100644','type':'blob','sha':None})
              else:entries.append({'path':p,'mode':'100644','type':'blob','content':pathlib.Path(p).read_text()})
          pathlib.Path('/tmp/threshold-reconciled-tree.json').write_text(json.dumps({'base_tree':base_tree,'tree':entries}))
          actual=subprocess.check_output(['gh','api','--method','POST','repos/maglothinm/MyETF-Intelligence/git/trees','--input','/tmp/threshold-reconciled-tree.json','--jq','.sha'],text=True).strip()
          assert actual==tree,(actual,tree)
          print('FINAL_THRESHOLD_TREE='+tree)
          print('PARENT='+head)
          print('ADDITIONAL_PARENT='+main)
          print('No source ref or production state changed; final PR CI is required.')
          PY
