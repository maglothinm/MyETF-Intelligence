name: Runtime v2 one-time secret transfer

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  transfer:
    if: github.repository_id == '1349678672' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud without a service-account key
        uses: google-github-actions/auth@v3
        with:
          project_id: project-38008d5f-4918-46e6-920
          workload_identity_provider: projects/497412818801/locations/global/workloadIdentityPools/polititrack-github/providers/secret-transfer
          service_account: polititrack-secret-transfer@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Copy protected API credentials into Secret Manager
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          set -euo pipefail
          for name in OPENAI_API_KEY FINNHUB_API_KEY ALPHAVANTAGE_API_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required repository secret $name is unavailable"
              exit 1
            fi
          done

          printf '%s' "$OPENAI_API_KEY" |
            gcloud secrets versions add polititrack-openai-api-key --data-file=- --project=project-38008d5f-4918-46e6-920 --quiet
          printf '%s' "$FINNHUB_API_KEY" |
            gcloud secrets versions add polititrack-finnhub-api-key --data-file=- --project=project-38008d5f-4918-46e6-920 --quiet
          printf '%s' "$ALPHAVANTAGE_API_KEY" |
            gcloud secrets versions add polititrack-alphavantage-api-key --data-file=- --project=project-38008d5f-4918-46e6-920 --quiet

          echo "Transferred three repository secrets without exposing their values."
