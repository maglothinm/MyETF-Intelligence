name: Apply verified OCR health source patch
on:
  push:
    branches: [codex/source-upload-ocr-20260917]
    paths: [.ocr-health-development/02.b64]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository_id == '1349678672' && github.ref == 'refs/heads/codex/source-upload-ocr-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/source-upload-ocr-20260917
          fetch-depth: 0
      - name: Verify exact patch and preserve concurrent file edits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'codex/source-upload-ocr-20260917'
          git merge-base --is-ancestor 6588f5350f5a8817694d81b6eb73aefb96372f11 HEAD
          python - <<'PY'
          import base64,hashlib,lzma,pathlib,re,subprocess
          root=pathlib.Path('.ocr-health-development')
          parts=[(root/f'{i:02}.b64').read_text().strip() for i in range(3)]
          assert all(len(part)<=10000 for part in parts)
          data=lzma.decompress(base64.b64decode(''.join(parts),validate=True),memlimit=268435456)
          assert hashlib.sha256(data).hexdigest()=='f46fbd89ffe781a733dc2b31d8eebfcc3813342a943298fd037200d69849ebe6'
          for block in data.decode().split('diff --git ')[1:]:
              name=block.splitlines()[0].split(' b/',1)[1]
              assert name.startswith(('runtime_v2/','scripts/','tests/','docs/')) and '..' not in name
              expected=re.search(r'^index ([0-9a-f]+)\.\.',block,re.M).group(1)
              if set(expected)=={'0'}:
                  assert not pathlib.Path(name).exists(),name
              else:
                  actual=subprocess.check_output(['git','hash-object',name],text=True).strip()
                  assert actual.startswith(expected),(name,'concurrent edit detected')
          path=pathlib.Path('/tmp/ocr-health.patch');path.write_bytes(data)
          subprocess.run(['git','apply','--check','--unidiff-zero',str(path)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(path)],check=True)
          PY
          rm -r .ocr-health-development
          python -m compileall -q runtime_v2 scripts/source_ocr.py scripts/source_ocr_limits.py scripts/source_ocr_health.py tests/test_source_ocr_health.py
          node --check scripts/dashboard_assets/common.js
          node --test tests/source_ocr_health.test.cjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ocr): monitor independent stage health and harden document admission (#182)'
          git push origin HEAD:refs/heads/codex/source-upload-ocr-20260917
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
