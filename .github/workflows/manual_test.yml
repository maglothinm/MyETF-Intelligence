name: Run Simulation

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Synthetic filing date (YYYY-MM-DD); blank uses today's UTC date"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

# One isolated writer; no mail job or extra durable-state namespace.
concurrency:
  group: polititrack-run-simulation
  cancel-in-progress: false

jobs:
  simulate:
    name: Run isolated Investor Edge simulation
    if: ${{ github.repository_id == '1349678672' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_ANALYSIS_ENABLED: "false"
      AI_SUPPRESS_ALERTS: "true"
      AI_REQUIRE_PUSHOVER: "false"
      AI_PAPER_TRADING_ONLY: "true"
      INVESTOR_EDGE_ENABLED: "true"
      REQUIRE_PUSHOVER: "false"
      PUSHOVER_API_TOKEN: ""
      PUSHOVER_USER_KEY: ""
      GMAIL_ADDRESS: ""
      GMAIL_APP_PASSWORD: ""
      OPENAI_API_KEY: ""
      FINNHUB_API_KEY: ""
      ALPHAVANTAGE_API_KEY: ""
      ALPHAVANTAGE_ENTITLEMENT: ""
      SEC_USER_AGENT: ""
    steps:
      - name: Check out reviewed default-branch code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install analyst and dashboard dependencies
        run: python -m pip install --requirement requirements-ai.txt

      - name: Prepare run-specific isolated paths
        shell: bash
        run: |
          set -euo pipefail
          simulation_root="${RUNNER_TEMP}/polititrack-simulation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$simulation_root"
          {
            echo "MANUAL_TEST_INPUT_DIR=${simulation_root}/input"
            echo "MANUAL_TEST_TRACKER_DIR=${simulation_root}/tracker"
            echo "MANUAL_TEST_AI_DIR=${simulation_root}/ai"
            echo "MANUAL_TEST_SITE_DIR=${simulation_root}/site"
            echo "MANUAL_TEST_SUMMARY=${simulation_root}/manual-test-summary.json"
            echo "MANUAL_TEST_SIMULATION_RESULT=${simulation_root}/simulation-result.json"
            echo "MANUAL_TEST_INPUT_HASHES=${simulation_root}/input-hashes.json"
          } >> "$GITHUB_ENV"

      - name: Restore fully validated production inputs read-only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for pipeline in legislative executive ai; do
            python scripts/protected_state.py restore --pipeline "$pipeline" \
              --destination "$MANUAL_TEST_INPUT_DIR/$pipeline" \
              --receipt "${RUNNER_TEMP}/simulation-${pipeline}-receipt.json" --read-only
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.run_filing_simulation import directory_sha256
          root = Path(os.environ["MANUAL_TEST_INPUT_DIR"])
          hashes = {name: directory_sha256(root / name) for name in ("legislative", "executive", "ai")}
          Path(os.environ["MANUAL_TEST_INPUT_HASHES"]).write_text(json.dumps(hashes), encoding="utf-8")
          PY
          mkdir -p "$MANUAL_TEST_AI_DIR"
          cp -R "$MANUAL_TEST_INPUT_DIR/ai/." "$MANUAL_TEST_AI_DIR/"
          chmod -R u+w "$MANUAL_TEST_AI_DIR"

      - name: Create randomized assumed-new TEST filing in isolated copies
        env:
          AS_OF_INPUT: ${{ inputs.as_of }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--output-dir "$MANUAL_TEST_TRACKER_DIR" --require-investor-edge-history
            --legislative-dir "$MANUAL_TEST_INPUT_DIR/legislative"
            --executive-dir "$MANUAL_TEST_INPUT_DIR/executive")
          if [[ -n "$AS_OF_INPUT" ]]; then
            args+=(--as-of "$AS_OF_INPUT")
          fi
          python scripts/create_manual_test_filing.py "${args[@]}" > "$MANUAL_TEST_SUMMARY"

      - name: Run deterministic production scoring and Investor Edge path
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_investor_edge_simulation.py \
            --legislative-dir "$MANUAL_TEST_TRACKER_DIR/legislative" \
            --executive-dir "$MANUAL_TEST_TRACKER_DIR/executive" \
            --ai-dir "$MANUAL_TEST_AI_DIR" --result-file "$MANUAL_TEST_SIMULATION_RESULT"

      - name: Build separate downloadable TEST dashboard
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_trade_dashboard.py \
            --legislative-dir "$MANUAL_TEST_TRACKER_DIR/legislative" \
            --executive-dir "$MANUAL_TEST_TRACKER_DIR/executive" \
            --ai-dir "$MANUAL_TEST_AI_DIR" --output-dir "$MANUAL_TEST_SITE_DIR"
          cp "$MANUAL_TEST_SUMMARY" "$MANUAL_TEST_SITE_DIR/data/manual-test-summary.json"
          cp "$MANUAL_TEST_SIMULATION_RESULT" "$MANUAL_TEST_SITE_DIR/data/simulation-result.json"
          test -s "$MANUAL_TEST_SITE_DIR/index.html"
          test -s "$MANUAL_TEST_SITE_DIR/investor-edge.html"
          node --check "$MANUAL_TEST_SITE_DIR/app.js"
          node --check "$MANUAL_TEST_SITE_DIR/wallboard.js"
          node --check "$MANUAL_TEST_SITE_DIR/investor-edge.js"

      - name: Verify protected inputs are unchanged before publishing TEST artifact
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.run_filing_simulation import directory_sha256
          root = Path(os.environ["MANUAL_TEST_INPUT_DIR"])
          before = json.loads(Path(os.environ["MANUAL_TEST_INPUT_HASHES"]).read_text(encoding="utf-8"))
          after = {name: directory_sha256(root / name) for name in ("legislative", "executive", "ai")}
          if before != after:
              raise SystemExit("Protected simulation inputs changed; artifact publication refused")
          proof = {"test": True, "production_inputs_unchanged": True, "before": before, "after": after}
          (Path(os.environ["MANUAL_TEST_SITE_DIR"]) / "data/input-integrity.json").write_text(json.dumps(proof), encoding="utf-8")
          PY

      - name: Upload only the one-day TEST dashboard
        uses: actions/upload-artifact@v7
        with:
          name: simulation-dashboard-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/polititrack-simulation-${{ github.run_id }}-${{ github.run_attempt }}/site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
