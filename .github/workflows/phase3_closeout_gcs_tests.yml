name: Phase 3 GCS closeout safety tests

on:
  pull_request:
    paths:
      - ".github/workflows/phase3_closeout_gcs.yml"
      - ".github/workflows/phase3_closeout_gcs_tests.yml"
      - "deploy/runtime-v2/gcs_status_probe.py"
      - "tests/test_phase3_closeout_gcs.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile private probe
        run: python -m py_compile deploy/runtime-v2/gcs_status_probe.py
      - name: Install pytest
        run: python -m pip install "pytest>=8.3,<9"
      - name: Run focused safety tests
        run: python -m pytest -q tests/test_phase3_closeout_gcs.py
