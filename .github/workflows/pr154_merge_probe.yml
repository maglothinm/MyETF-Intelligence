name: PR 154 isolated merge inspection

on:
  push:
    branches: [codex/current-opportunity-v1]
    paths: [.github/workflows/pr154_merge_probe.yml]

permissions:
  contents: write
  pull-requests: write

jobs:
  inspect:
    if: github.repository_id == '1349678672' && github.ref == 'refs/heads/codex/current-opportunity-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce reviewed source-only merge tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = 75cb399ea870a77069911c80f3bfe0b788475fd9
          git branch main 75cb399ea870a77069911c80f3bfe0b788475fd9
          git config user.name 'PolitiTrack merge inspection'
          git config user.email '225069210+maglothinm@users.noreply.github.com'
          git merge --no-commit --no-ff main > /tmp/pr154-merge.log 2>&1 || test "$?" = 1
          python - <<'PY'
          import base64, pathlib, subprocess, zlib
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert set(conflicts)=={'docs/DECISIONS.md','docs/HANDOFF.md','runtime_v2/runner.py','scripts/ai_filing_analyst_hardened.py'},conflicts
          encoded=''
          source=zlib.decompress(base64.b64decode(encoded)).decode()
          pathlib.Path('/tmp/pr154-reviewed-resolution.py').write_text(source)
          subprocess.run(['python','/tmp/pr154-reviewed-resolution.py'],check=True)
          PY
          git add -A
          git diff --cached main --check
          test "$(git write-tree)" = 4f56b4ee27a6506751701cca22724a2f29260993
          test ! -e .github/workflows/pr154_merge_probe.yml
          python -m compileall -q scripts/opportunity_*.py scripts/ai_filing_analyst_hardened.py runtime_v2/runner.py tests/test_opportunity_integration.py
      - name: Stage verified Git objects only, never update refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          repo='maglothinm/MyETF-Intelligence'
          expected='4f56b4ee27a6506751701cca22724a2f29260993'
          def git(*args):
              return subprocess.check_output(['git',*args])
          def post(endpoint,payload):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+endpoint,data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  return json.load(response)
          assert git('write-tree').decode().strip()==expected
          assert git('rev-parse','main^{tree}').decode().strip()=='ff9c3581d38b901804cd385a13bfce6e0659f15d'
          entries=[]
          for path in git('diff','--cached','--name-only','-z','main').decode().split('\0'):
              if not path:
                  continue
              row=git('ls-files','-s','--',path).decode().strip()
              if not row:
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
                  continue
              metadata,actual_path=row.split('\t',1)
              mode,sha,stage=metadata.split()
              assert stage=='0' and actual_path==path and mode in ('100644','100755')
              blob=post('/git/blobs',{'encoding':'base64','content':base64.b64encode(git('cat-file','blob',sha)).decode()})
              assert blob['sha']==sha
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          result=post('/git/trees',{'base_tree':'ff9c3581d38b901804cd385a13bfce6e0659f15d','tree':entries})
          assert result['sha']==expected,result
          report='## Reproducible source merge candidate staged\n\nTree: `'+expected+'`\n\nPR parent: `'+os.environ['GITHUB_SHA']+'`\n\nMain parent: `75cb399ea870a77069911c80f3bfe0b788475fd9`\n\nChanged paths relative to current main: '+str(len(entries))+'. Temporary workflow absent from candidate. The reviewed resolution reproduced the exact local tree and passed compilation/diff checks. No branch ref was updated by this workflow. No production state, runtime, credentials, schedules, account data, or alerts were accessed.\n\nThe source commit and normal PR CI remain the next merge gates; staging is not a completed merge or deployment.\n\nRun: https://github.com/'+repo+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+'\n'
          pathlib.Path('/tmp/pr154-staged.md').write_text(report)
          print(report)
          PY
          gh pr comment 154 --repo maglothinm/MyETF-Intelligence --body-file /tmp/pr154-staged.md
