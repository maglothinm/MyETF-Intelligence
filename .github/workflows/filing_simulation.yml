name: Run $10K portfolio simulator

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "UTC ISO-8601 timestamp; leave empty to use the current time"
        required: false
        default: ""
        type: string
      seed:
        description: "Optional deterministic random-selection seed"
        required: false
        default: ""
        type: string
      trade_id:
        description: "Optional exact eligible trade ID instead of random selection"
        required: false
        default: ""
        type: string
  # Temporary cutover acceptance trigger. Removed after the first canonical run.
  push:
    branches:
      - main
    paths:
      - .github/workflows/filing_simulation.yml
      - scripts/run_filing_simulation.py
      - tests/test_filing_simulation.py

permissions:
  actions: read
  contents: read

concurrency:
  group: filing-simulation
  cancel-in-progress: false

jobs:
  simulate:
    if: ${{ github.run_attempt == 1 && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve immutable simulation cutoff
        id: parameters
        shell: bash
        env:
          AS_OF_INPUT: ${{ inputs.as_of }}
          SEED_INPUT: ${{ inputs.seed }}
          TRADE_ID_INPUT: ${{ inputs.trade_id }}
        run: |
          set -euo pipefail
          if [[ -n "$SEED_INPUT" && -n "$TRADE_ID_INPUT" ]]; then
            echo "Provide either seed or trade_id, not both." >&2
            exit 1
          fi
          as_of="$AS_OF_INPUT"
          if [[ -z "$as_of" ]]; then
            as_of="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          if [[ "$as_of" == *$'\r'* || "$as_of" == *$'\n'* ]]; then
            echo "as_of must be one ISO-8601 timestamp on a single line." >&2
            exit 1
          fi
          echo "as_of=$as_of" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependency
        shell: bash
        run: python -m pip install pytest==9.0.2

      - name: Run simulator tests
        shell: bash
        run: python -m pytest -q tests/test_filing_simulation.py

      - name: Restore immutable production inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p dashboard-input
          consumer_sha="$(git rev-parse HEAD)"
          live_default_sha="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" \
              --jq '.object.sha'
          )"
          if [[ "$consumer_sha" != "$live_default_sha" ]]; then
            echo "This queued simulation checked out ${consumer_sha}, but ${DEFAULT_BRANCH} is now ${live_default_sha}; refusing stale-code execution." >&2
            exit 1
          fi

          list_artifacts_newest_first() {
            local requested_name="$1"
            local artifact_page=1
            local artifact_payload artifact_count
            while :; do
              artifact_payload="$(
                gh api --method GET \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/artifacts" \
                  -f name="$requested_name" \
                  -f per_page=100 \
                  -f page="$artifact_page"
              )"
              jq -r \
                '.artifacts[] | select(.expired == false) | [.id, .workflow_run.id, .created_at] | @tsv' \
                <<< "$artifact_payload"
              artifact_count="$(jq '.artifacts | length' <<< "$artifact_payload")"
              if (( artifact_count < 100 )); then
                break
              fi
              ((artifact_page += 1))
            done | LC_ALL=C sort -t $'\t' -k3,3r -k1,1nr
          }

          restore_state_artifact() {
            local branch="$1"
            local artifact_name="$2"
            local workflow_file="$3"
            local workflow_name="$4"
            local required="$5"
            local artifact_id=""
            local producer_run_id=""
            local producer_run_attempt=""
            local producer_run_created_at=""
            local producer_workflow_id=""
            local authoritative_job=""
            case "$workflow_file" in
              legislative_trade_tracker_v2.yml | executive_trade_tracker.yml)
                authoritative_job="track"
                ;;
              ai_filing_analyst.yml)
                authoritative_job="analyze"
                ;;
              *)
                echo "No authoritative producer job is defined for ${workflow_file}." >&2
                exit 1
                ;;
            esac
            while IFS=$'\t' read -r candidate_artifact_id candidate_run_id candidate_created_at; do
              [[ -n "$candidate_artifact_id" && -n "$candidate_run_id" ]] || continue
              run_payload="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}"
              )"
              current_run_attempt="$(jq -r '.run_attempt // 1' <<< "$run_payload")"
              if [[ ! "$current_run_attempt" =~ ^[1-9][0-9]*$ ]]; then
                continue
              fi
              for ((candidate_attempt = current_run_attempt; candidate_attempt >= 1; candidate_attempt -= 1)); do
                attempt_payload="$(
                  gh api \
                    -H "Accept: application/vnd.github+json" \
                    "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/attempts/${candidate_attempt}"
                )"
                run_started_at="$(jq -r '.run_started_at // ""' <<< "$attempt_payload")"
                [[ -n "$run_started_at" ]] || continue
                if [[ "$candidate_created_at" < "$run_started_at" ]]; then
                  continue
                fi
                next_attempt_started_at=""
                if (( candidate_attempt < current_run_attempt )); then
                  next_attempt_started_at="$(
                    gh api \
                      -H "Accept: application/vnd.github+json" \
                      "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/attempts/$((candidate_attempt + 1))" \
                      --jq '.run_started_at // ""'
                  )"
                  [[ -n "$next_attempt_started_at" ]] || continue
                  if [[ "$candidate_created_at" == "$next_attempt_started_at" || "$candidate_created_at" > "$next_attempt_started_at" ]]; then
                    continue
                  fi
                fi

                # The artifact belongs to this one half-open attempt window. If
                # that exact attempt is invalid, try an older artifact rather
                # than attributing it to another attempt.
                run_name="$(jq -r '.name // ""' <<< "$attempt_payload")"
                run_path="$(jq -r '.path // ""' <<< "$attempt_payload")"
                run_path="${run_path%%@*}"
                run_branch="$(jq -r '.head_branch // ""' <<< "$attempt_payload")"
                run_conclusion="$(jq -r '.conclusion // ""' <<< "$attempt_payload")"
                run_attempt="$(jq -r '.run_attempt // ""' <<< "$attempt_payload")"
                run_repository_id="$(jq -r '.repository.id // ""' <<< "$attempt_payload")"
                run_head_sha="$(jq -r '.head_sha // ""' <<< "$attempt_payload")"
                if [[ \
                  "$run_name" == "$workflow_name" && \
                  "$run_path" == ".github/workflows/${workflow_file}" && \
                  "$run_branch" == "$DEFAULT_BRANCH" && \
                  "$run_conclusion" == "success" && \
                  "$run_attempt" == "$candidate_attempt" && \
                  "$run_repository_id" == "$GITHUB_REPOSITORY_ID" && \
                  -n "$run_head_sha" \
                ]]; then
                  successful_state_jobs="$(
                    gh api \
                      -H "Accept: application/vnd.github+json" \
                      "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/attempts/${candidate_attempt}/jobs?per_page=100" \
                      --jq "[.jobs[] | select(.name == \"${authoritative_job}\" and .conclusion == \"success\")] | length"
                  )"
                  compare_status="$(
                    gh api \
                      -H "Accept: application/vnd.github+json" \
                      "/repos/${GITHUB_REPOSITORY}/compare/${run_head_sha}...${consumer_sha}" \
                      --jq '.status'
                  )"
                  if (( successful_state_jobs > 0 )) && [[ "$compare_status" == "ahead" || "$compare_status" == "identical" ]]; then
                    artifact_id="$candidate_artifact_id"
                    producer_run_id="$candidate_run_id"
                    producer_run_attempt="$candidate_attempt"
                    producer_run_created_at="$run_started_at"
                    producer_workflow_id="$(jq -r '.workflow_id // ""' <<< "$attempt_payload")"
                  fi
                fi
                break
              done
              if [[ -n "$artifact_id" ]]; then
                break
              fi
            done < <(list_artifacts_newest_first "$artifact_name")

            if [[ -z "$artifact_id" ]]; then
              if [[ "$required" == "true" ]]; then
                echo "No unexpired ${artifact_name} artifact is available; refusing to simulate without production ${branch} state." >&2
                exit 1
              fi
              mkdir -p "dashboard-input/${branch}"
              echo "No ${artifact_name} artifact is available; ${branch} input is empty."
              return 0
            fi
            if [[ -z "$producer_run_attempt" || -z "$producer_run_created_at" || -z "$producer_workflow_id" ]]; then
              echo "Selected ${artifact_name} has incomplete workflow provenance." >&2
              exit 1
            fi
            local successor_attempts
            successor_attempts=""
            local successor_page=1
            while :; do
              local successor_payload page_count oldest_run_id
              successor_payload="$(
                gh api --method GET \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/workflows/${producer_workflow_id}/runs" \
                  -f per_page=100 \
                  -f page="$successor_page"
              )"
              page_count="$(jq '.workflow_runs | length' <<< "$successor_payload")"
              while IFS= read -r successor_run_id; do
                [[ -n "$successor_run_id" ]] || continue
                successor_run_payload="$(
                  gh api \
                    -H "Accept: application/vnd.github+json" \
                    "/repos/${GITHUB_REPOSITORY}/actions/runs/${successor_run_id}"
                )"
                successor_run_attempt="$(jq -r '.run_attempt // 1' <<< "$successor_run_payload")"
                [[ "$successor_run_attempt" =~ ^[1-9][0-9]*$ ]] || continue
                for ((successor_attempt = 1; successor_attempt <= successor_run_attempt; successor_attempt += 1)); do
                  if (( successor_run_id == producer_run_id && successor_attempt <= producer_run_attempt )); then
                    continue
                  fi
                  successor_attempt_payload="$(
                    gh api \
                      -H "Accept: application/vnd.github+json" \
                      "/repos/${GITHUB_REPOSITORY}/actions/runs/${successor_run_id}/attempts/${successor_attempt}"
                  )"
                  successor_name="$(jq -r '.name // ""' <<< "$successor_attempt_payload")"
                  successor_path="$(jq -r '.path // ""' <<< "$successor_attempt_payload")"
                  successor_path="${successor_path%%@*}"
                  successor_branch="$(jq -r '.head_branch // ""' <<< "$successor_attempt_payload")"
                  successor_conclusion="$(jq -r '.conclusion // ""' <<< "$successor_attempt_payload")"
                  successor_payload_attempt="$(jq -r '.run_attempt // ""' <<< "$successor_attempt_payload")"
                  successor_repository_id="$(jq -r '.repository.id // ""' <<< "$successor_attempt_payload")"
                  successor_head_sha="$(jq -r '.head_sha // ""' <<< "$successor_attempt_payload")"
                  if [[ \
                    "$successor_name" != "$workflow_name" || \
                    "$successor_path" != ".github/workflows/${workflow_file}" || \
                    "$successor_branch" != "$DEFAULT_BRANCH" || \
                    "$successor_conclusion" != "success" || \
                    "$successor_payload_attempt" != "$successor_attempt" || \
                    "$successor_repository_id" != "$GITHUB_REPOSITORY_ID" || \
                    -z "$successor_head_sha" \
                  ]]; then
                    continue
                  fi
                  successor_compare_status="$(
                    gh api \
                      -H "Accept: application/vnd.github+json" \
                      "/repos/${GITHUB_REPOSITORY}/compare/${successor_head_sha}...${consumer_sha}" \
                      --jq '.status'
                  )"
                  if [[ "$successor_compare_status" != "ahead" && "$successor_compare_status" != "identical" ]]; then
                    continue
                  fi
                  successful_state_jobs="$(
                    gh api \
                      -H "Accept: application/vnd.github+json" \
                      "/repos/${GITHUB_REPOSITORY}/actions/runs/${successor_run_id}/attempts/${successor_attempt}/jobs?per_page=100" \
                      --jq "[.jobs[] | select(.name == \"${authoritative_job}\" and .conclusion == \"success\")] | length"
                  )"
                  if (( successful_state_jobs > 0 )); then
                    successor_attempts+="${successor_attempts:+$'\n'}${successor_run_id}/attempt-${successor_attempt}"
                    break 2
                  fi
                done
              done < <(
                jq -r --argjson predecessor "$producer_run_id" --arg branch "$DEFAULT_BRANCH" \
                  '.workflow_runs[] | select(.id >= $predecessor and .head_branch == $branch) | .id' \
                  <<< "$successor_payload"
              )
              if [[ -n "$successor_attempts" ]]; then
                break
              fi
              if (( page_count == 0 || page_count < 100 )); then
                break
              fi
              oldest_run_id="$(jq '[.workflow_runs[].id] | min' <<< "$successor_payload")"
              if (( oldest_run_id <= producer_run_id )); then
                break
              fi
              ((successor_page += 1))
            done
            if [[ -n "$successor_attempts" ]]; then
              echo "${workflow_name} high-water violation at ${successor_attempts//$'\n'/, }; refusing to consume missing, ineligible, or rerun production state." >&2
              exit 1
            fi

            local temp_dir
            temp_dir="$(mktemp -d)"
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              > "${temp_dir}/state.zip"
            mkdir -p "${temp_dir}/unpacked"
            unzip -q "${temp_dir}/state.zip" -d "${temp_dir}/unpacked"

            local state_file
            state_file="$(find "${temp_dir}/unpacked" -type f -name state.json -print -quit)"
            if [[ -z "$state_file" ]]; then
              echo "Artifact ${artifact_id} (${artifact_name}) contains no state.json." >&2
              exit 1
            fi

            mkdir -p "dashboard-input/${branch}"
            cp -R "$(dirname "$state_file")/." "dashboard-input/${branch}/"
            chmod -R a-w "dashboard-input/${branch}"
            echo "Restored read-only ${branch} input from artifact ${artifact_id}, successful run ${producer_run_id} attempt ${producer_run_attempt}."
          }

          restore_state_artifact \
            legislative \
            legislative-tracker-state \
            legislative_trade_tracker_v2.yml \
            "Legislative purchase tracker v2" \
            true
          restore_state_artifact \
            executive \
            executive-tracker-state \
            executive_trade_tracker.yml \
            "Executive purchase tracker" \
            true
          restore_state_artifact \
            ai \
            ai-analysis-state \
            ai_filing_analyst.yml \
            "AI filing analyst and paper portfolio" \
            true

      - name: Validate restored production inputs
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for branch in ("legislative", "executive"):
              root = Path("dashboard-input") / branch
              state = json.loads((root / "state.json").read_text())
              if not isinstance(state, dict) or not state.get("last_success_utc"):
                  raise SystemExit(f"{branch} state.json has no successful-state marker")
              required = ["filings.jsonl", "runs.jsonl", "pending-review.jsonl"]
              if branch == "legislative":
                  required.extend(["purchases.jsonl", "transactions.jsonl"])
              for name in required:
                  path = root / name
                  if not path.is_file():
                      raise SystemExit(f"Protected {branch} input is missing {name}")
                  for number, line in enumerate(path.read_text().splitlines(), 1):
                      if line.strip() and not isinstance(json.loads(line), dict):
                          raise SystemExit(f"{branch}/{name}:{number} is not a JSON object")
              if branch == "executive" and state.get("seen_trades"):
                  for name in ("purchases.jsonl", "transactions.jsonl"):
                      if not (root / name).is_file():
                          raise SystemExit(f"Executive state with seen trades is missing {name}")

          ai_root = Path("dashboard-input/ai")
          if (ai_root / "state.json").exists():
              ai_state = json.loads((ai_root / "state.json").read_text())
              if not isinstance(ai_state, dict) or not ai_state.get("last_success_utc"):
                  raise SystemExit("AI state.json has no successful-state marker")
              for name in ("analyses.jsonl", "runs.jsonl"):
                  path = ai_root / name
                  if not path.is_file():
                      raise SystemExit(f"Protected AI input is missing {name}")
                  for number, line in enumerate(path.read_text().splitlines(), 1):
                      if line.strip() and not isinstance(json.loads(line), dict):
                          raise SystemExit(f"ai/{name}:{number} is not a JSON object")
          print("Validated restored production inputs before simulation.")
          PY

      - name: Restore isolated simulation history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p simulation-output
          artifact_id=""
          producer_run_id=""
          producer_run_attempt=""
          producer_run_created_at=""
          producer_workflow_id=""
          consumer_sha="$(git rev-parse HEAD)"
          live_default_sha="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" \
              --jq '.object.sha'
          )"
          if [[ "$consumer_sha" != "$live_default_sha" ]]; then
            echo "The default branch advanced while this simulation was preparing; refusing stale-code execution." >&2
            exit 1
          fi
          list_artifacts_newest_first() {
            local requested_name="$1"
            local artifact_page=1
            local artifact_payload artifact_count
            while :; do
              artifact_payload="$(
                gh api --method GET \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/artifacts" \
                  -f name="$requested_name" \
                  -f per_page=100 \
                  -f page="$artifact_page"
              )"
              jq -r \
                '.artifacts[] | select(.expired == false) | [.id, .workflow_run.id, .created_at] | @tsv' \
                <<< "$artifact_payload"
              artifact_count="$(jq '.artifacts | length' <<< "$artifact_payload")"
              if (( artifact_count < 100 )); then
                break
              fi
              ((artifact_page += 1))
            done | LC_ALL=C sort -t $'\t' -k3,3r -k1,1nr
          }
          while IFS=$'\t' read -r candidate_artifact_id candidate_run_id candidate_created_at; do
            [[ -n "$candidate_artifact_id" && -n "$candidate_run_id" ]] || continue
            run_payload="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}"
            )"
            current_run_attempt="$(jq -r '.run_attempt // 1' <<< "$run_payload")"
            if [[ ! "$current_run_attempt" =~ ^[1-9][0-9]*$ ]]; then
              continue
            fi
            for ((candidate_attempt = current_run_attempt; candidate_attempt >= 1; candidate_attempt -= 1)); do
              attempt_payload="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/attempts/${candidate_attempt}"
              )"
              run_started_at="$(jq -r '.run_started_at // ""' <<< "$attempt_payload")"
              [[ -n "$run_started_at" ]] || continue
              if [[ "$candidate_created_at" < "$run_started_at" ]]; then
                continue
              fi
              next_attempt_started_at=""
              if (( candidate_attempt < current_run_attempt )); then
                next_attempt_started_at="$(
                  gh api \
                    -H "Accept: application/vnd.github+json" \
                    "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/attempts/$((candidate_attempt + 1))" \
                    --jq '.run_started_at // ""'
                )"
                [[ -n "$next_attempt_started_at" ]] || continue
                if [[ "$candidate_created_at" == "$next_attempt_started_at" || "$candidate_created_at" > "$next_attempt_started_at" ]]; then
                  continue
                fi
              fi

              run_name="$(jq -r '.name // ""' <<< "$attempt_payload")"
              run_path="$(jq -r '.path // ""' <<< "$attempt_payload")"
              run_path="${run_path%%@*}"
              run_branch="$(jq -r '.head_branch // ""' <<< "$attempt_payload")"
              run_conclusion="$(jq -r '.conclusion // ""' <<< "$attempt_payload")"
              run_attempt="$(jq -r '.run_attempt // ""' <<< "$attempt_payload")"
              run_repository_id="$(jq -r '.repository.id // ""' <<< "$attempt_payload")"
              run_head_sha="$(jq -r '.head_sha // ""' <<< "$attempt_payload")"
              if [[ \
                "$run_name" == 'Run $10K portfolio simulator' && \
                "$run_path" == ".github/workflows/filing_simulation.yml" && \
                "$run_branch" == "$DEFAULT_BRANCH" && \
                "$run_conclusion" == "success" && \
                "$run_attempt" == "$candidate_attempt" && \
                "$run_repository_id" == "$GITHUB_REPOSITORY_ID" && \
                -n "$run_head_sha" \
              ]]; then
                successful_simulate_jobs="$(
                  gh api \
                    -H "Accept: application/vnd.github+json" \
                    "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/attempts/${candidate_attempt}/jobs?per_page=100" \
                    --jq '[.jobs[] | select(.name == "simulate" and .conclusion == "success")] | length'
                )"
                compare_status="$(
                  gh api \
                    -H "Accept: application/vnd.github+json" \
                    "/repos/${GITHUB_REPOSITORY}/compare/${run_head_sha}...${consumer_sha}" \
                    --jq '.status'
                )"
                if (( successful_simulate_jobs > 0 )) && [[ "$compare_status" == "ahead" || "$compare_status" == "identical" ]]; then
                  artifact_id="$candidate_artifact_id"
                  producer_run_id="$candidate_run_id"
                  producer_run_attempt="$candidate_attempt"
                  producer_run_created_at="$run_started_at"
                  producer_workflow_id="$(jq -r '.workflow_id // ""' <<< "$attempt_payload")"
                fi
              fi
              break
            done
            if [[ -n "$artifact_id" ]]; then
              break
            fi
          done < <(list_artifacts_newest_first simulation-state)
          if [[ -z "$artifact_id" ]]; then
            echo "No prior simulation-state artifact is available; starting an isolated simulation history."
            exit 0
          fi
          if [[ -z "$producer_run_attempt" || -z "$producer_run_created_at" || -z "$producer_workflow_id" ]]; then
            echo "Selected simulation-state artifact has incomplete workflow provenance." >&2
            exit 1
          fi
          successor_attempts=""
          successor_page=1
          while :; do
            successor_payload="$(
              gh api --method GET \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/${producer_workflow_id}/runs" \
                -f per_page=100 \
                -f page="$successor_page"
            )"
            page_count="$(jq '.workflow_runs | length' <<< "$successor_payload")"
            while IFS= read -r successor_run_id; do
              [[ -n "$successor_run_id" ]] || continue
              successor_run_payload="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${successor_run_id}"
              )"
              successor_run_attempt="$(jq -r '.run_attempt // 1' <<< "$successor_run_payload")"
              [[ "$successor_run_attempt" =~ ^[1-9][0-9]*$ ]] || continue
              for ((successor_attempt = 1; successor_attempt <= successor_run_attempt; successor_attempt += 1)); do
                if (( successor_run_id == producer_run_id && successor_attempt <= producer_run_attempt )); then
                  continue
                fi
                successor_attempt_payload="$(
                  gh api \
                    -H "Accept: application/vnd.github+json" \
                    "/repos/${GITHUB_REPOSITORY}/actions/runs/${successor_run_id}/attempts/${successor_attempt}"
                )"
                successor_name="$(jq -r '.name // ""' <<< "$successor_attempt_payload")"
                successor_path="$(jq -r '.path // ""' <<< "$successor_attempt_payload")"
                successor_path="${successor_path%%@*}"
                successor_branch="$(jq -r '.head_branch // ""' <<< "$successor_attempt_payload")"
                successor_conclusion="$(jq -r '.conclusion // ""' <<< "$successor_attempt_payload")"
                successor_payload_attempt="$(jq -r '.run_attempt // ""' <<< "$successor_attempt_payload")"
                successor_repository_id="$(jq -r '.repository.id // ""' <<< "$successor_attempt_payload")"
                successor_head_sha="$(jq -r '.head_sha // ""' <<< "$successor_attempt_payload")"
                if [[ \
                  "$successor_name" != 'Run $10K portfolio simulator' || \
                  "$successor_path" != ".github/workflows/filing_simulation.yml" || \
                  "$successor_branch" != "$DEFAULT_BRANCH" || \
                  "$successor_conclusion" != "success" || \
                  "$successor_payload_attempt" != "$successor_attempt" || \
                  "$successor_repository_id" != "$GITHUB_REPOSITORY_ID" || \
                  -z "$successor_head_sha" \
                ]]; then
                  continue
                fi
                successor_compare_status="$(
                  gh api \
                    -H "Accept: application/vnd.github+json" \
                    "/repos/${GITHUB_REPOSITORY}/compare/${successor_head_sha}...${consumer_sha}" \
                    --jq '.status'
                )"
                if [[ "$successor_compare_status" != "ahead" && "$successor_compare_status" != "identical" ]]; then
                  continue
                fi
                successful_simulate_jobs="$(
                  gh api \
                    -H "Accept: application/vnd.github+json" \
                    "/repos/${GITHUB_REPOSITORY}/actions/runs/${successor_run_id}/attempts/${successor_attempt}/jobs?per_page=100" \
                    --jq '[.jobs[] | select(.name == "simulate" and .conclusion == "success")] | length'
                )"
                if (( successful_simulate_jobs > 0 )); then
                  successor_attempts+="${successor_attempts:+$'\n'}${successor_run_id}/attempt-${successor_attempt}"
                  break 2
                fi
              done
            done < <(
              jq -r --argjson predecessor "$producer_run_id" --arg branch "$DEFAULT_BRANCH" \
                '.workflow_runs[] | select(.id >= $predecessor and .head_branch == $branch) | .id' \
                <<< "$successor_payload"
            )
            if [[ -n "$successor_attempts" ]]; then
              break
            fi
            if (( page_count == 0 || page_count < 100 )); then
              break
            fi
            oldest_run_id="$(jq '[.workflow_runs[].id] | min' <<< "$successor_payload")"
            if (( oldest_run_id <= producer_run_id )); then
              break
            fi
            ((successor_page += 1))
          done
          if [[ -n "$successor_attempts" ]]; then
            echo "Simulation history high-water violation at ${successor_attempts//$'\n'/, }; refusing to truncate, omit, or regress prior history." >&2
            exit 1
          fi

          temp_dir="$(mktemp -d)"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "${temp_dir}/state.zip"
          mkdir -p "${temp_dir}/unpacked"
          unzip -q "${temp_dir}/state.zip" -d "${temp_dir}/unpacked"
          result_file="$(find "${temp_dir}/unpacked" -type f -name simulation-result.json -print -quit)"
          if [[ -z "$result_file" ]]; then
            echo "Artifact ${artifact_id} (simulation-state) contains no simulation-result.json." >&2
            exit 1
          fi
          history_file="$(find "${temp_dir}/unpacked" -type f -name simulation-runs.jsonl -print -quit)"
          if [[ -z "$history_file" || "$(dirname "$history_file")" != "$(dirname "$result_file")" ]]; then
            echo "Artifact ${artifact_id} (simulation-state) has no colocated simulation-runs.jsonl." >&2
            exit 1
          fi
          python - "$result_file" "$history_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text())
          history = [
              json.loads(line)
              for line in Path(sys.argv[2]).read_text().splitlines()
              if line.strip()
          ]
          if not isinstance(result, dict) or not history or history[-1] != result:
              raise SystemExit("Restored simulation history is empty or inconsistent with its result")
          if not all(isinstance(record, dict) for record in history):
              raise SystemExit("Restored simulation history contains a non-object record")
          PY
          cp -R "$(dirname "$result_file")/." simulation-output/
          echo "Restored isolated simulation history from artifact ${artifact_id}, successful run ${producer_run_id} attempt ${producer_run_attempt}."

      - name: Record simulation predecessor history
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("simulation-output/simulation-runs.jsonl")
          data = path.read_bytes() if path.is_file() else b""
          Path("/tmp/simulation-predecessor.json").write_text(
              json.dumps(
                  {
                      "byte_length": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n"
          )
          PY

      - name: Run isolated filing simulation
        id: simulation
        shell: bash
        env:
          AS_OF: ${{ steps.parameters.outputs.as_of }}
          SEED_INPUT: ${{ inputs.seed }}
          TRADE_ID_INPUT: ${{ inputs.trade_id }}
        run: |
          set -euo pipefail
          args=(
            --legislative-dir dashboard-input/legislative
            --executive-dir dashboard-input/executive
            --ai-dir dashboard-input/ai
            --output-dir simulation-output
            --as-of "$AS_OF"
          )
          if [[ -n "$SEED_INPUT" ]]; then
            args+=(--seed "$SEED_INPUT")
          fi
          if [[ -n "$TRADE_ID_INPUT" ]]; then
            args+=(--trade-id "$TRADE_ID_INPUT")
          fi
          python scripts/run_filing_simulation.py "${args[@]}"
          {
            echo "### Run \$10K portfolio simulator"
            echo
            echo "- Starting capital: \$10,000.00"
            echo "- Goal value: \$20,000.00"
            echo "- As of: \`${AS_OF}\`"
            echo "- Production tracker artifacts: read-only"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate isolated simulation state
        shell: bash
        run: |
          set -euo pipefail
          test -s simulation-output/simulation-result.json
          test -s simulation-output/simulation-runs.jsonl
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          result = json.loads(Path("simulation-output/simulation-result.json").read_text())
          history_path = Path("simulation-output/simulation-runs.jsonl")
          history = history_path.read_bytes()
          predecessor = json.loads(Path("/tmp/simulation-predecessor.json").read_text())
          prior_size = int(predecessor["byte_length"])
          if (
              len(history) < prior_size
              or hashlib.sha256(history[:prior_size]).hexdigest() != predecessor["sha256"]
          ):
              raise SystemExit("Simulation history did not preserve its exact predecessor prefix")
          appended = [
              json.loads(line)
              for line in history[prior_size:].decode("utf-8").splitlines()
              if line.strip()
          ]
          if len(appended) != 1 or appended[0] != result:
              raise SystemExit("Simulation history must append exactly the current result")
          lines = [
              json.loads(line)
              for line in history.decode("utf-8").splitlines()
              if line.strip()
          ]
          if not isinstance(result, dict) or not lines or lines[-1] != result:
              raise SystemExit("Latest simulation result is not the final history record")
          print(f"Validated {len(lines)} isolated simulation run record(s).")
          PY

      - name: Record notification isolation in simulation state
        if: ${{ success() && steps.simulation.outcome == 'success' }}
        shell: bash
        env:
          PUSHOVER_STATUS: not_requested
          EMAIL_STATUS: not_requested
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path("simulation-output/simulation-result.json")
          history_path = Path("simulation-output/simulation-runs.jsonl")
          result = json.loads(result_path.read_text())
          pushover = os.environ.get("PUSHOVER_STATUS") or "not_requested"
          email = os.environ.get("EMAIL_STATUS") or "not_requested"
          result["notification"] = {"pushover": pushover, "email": email}
          result["notification_status"] = f"Pushover: {pushover}; email: {email}"
          result.setdefault("safety", {})["alerts_sent"] = "sent" in {pushover, email}
          result_path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          history = [
              json.loads(line)
              for line in history_path.read_text().splitlines()
              if line.strip()
          ]
          if not history:
              raise SystemExit("Simulation history is empty")
          history[-1] = result
          history_path.write_text(
              "".join(json.dumps(row, sort_keys=True, separators=(",", ":")) + "\n" for row in history)
          )
          PY

      - name: Upload isolated simulation state
        if: ${{ success() && steps.simulation.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: simulation-state
          path: simulation-output
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
