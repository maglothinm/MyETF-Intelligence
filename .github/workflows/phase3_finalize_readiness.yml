name: Phase 3 finalize readiness

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase3_finalize_readiness.yml"

permissions:
  contents: read
  id-token: write

jobs:
  finalize:
    if: github.repository_id == '1349678672' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_ID: project-38008d5f-4918-46e6-920
      PROJECT_NUMBER: "497412818801"
      REGION: us-central1
      STATE_BUCKET: project-38008d5f-4918-46e6-920-polititrack-tfstate
      WIF_PROVIDER: projects/497412818801/locations/global/workloadIdentityPools/polititrack-github-phase3/providers/phase3-main
      DEPLOYER_SERVICE_ACCOUNT: polititrack-phase3-deployer@project-38008d5f-4918-46e6-920.iam.gserviceaccount.com
      ADMIN_JOB: polititrack-admin
      WEB_SERVICE: polititrack-web
      SQL_INSTANCE: polititrack-runtime-v2
      LOG_BUCKET: _Default
      LOG_VIEW: _Default
      LOG_LOCATION: global
      ONESHOT_MARKER: phase3-acceptance/finalize-readiness-v1.claimed
      ACCEPTANCE_OBJECT: phase3-acceptance/final/phase3-acceptance.json
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v7

      - name: Authenticate as constrained Phase 3 deployer
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Reconcile private routing and prove Phase 3 acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase3-finalize
          cd phase3-finalize
          member="serviceAccount:${DEPLOYER_SERVICE_ACCOUNT}"
          marker_uri="gs://${STATE_BUCKET}/${ONESHOT_MARKER}"
          acceptance_uri="gs://${STATE_BUCKET}/${ACCEPTANCE_OBJECT}"
          claim_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          cleanup_temporary_access() {
            set +e
            gcloud logging views remove-iam-policy-binding "${LOG_VIEW}" \
              --bucket "${LOG_BUCKET}" \
              --location "${LOG_LOCATION}" \
              --project "${PROJECT_ID}" \
              --member "${member}" \
              --role roles/logging.viewAccessor \
              --quiet >/dev/null 2>&1
            gcloud projects remove-iam-policy-binding "${PROJECT_ID}" \
              --member "${member}" \
              --role roles/logging.admin \
              --condition=None \
              --quiet >/dev/null 2>&1
            gcloud run jobs remove-iam-policy-binding "${ADMIN_JOB}" \
              --project "${PROJECT_ID}" \
              --region "${REGION}" \
              --member "${member}" \
              --role roles/run.jobsExecutorWithOverrides \
              --quiet >/dev/null 2>&1
          }
          trap cleanup_temporary_access EXIT

          actual_number="$(gcloud projects describe "${PROJECT_ID}" --format='value(projectNumber)')"
          [[ "${actual_number}" == "${PROJECT_NUMBER}" ]] || { echo "Immutable project boundary mismatch." >&2; exit 1; }
          if gcloud storage ls "${marker_uri}" >/dev/null 2>&1; then
            echo "Phase 3 readiness finalizer marker already exists; refusing duplicate execution." >&2
            exit 1
          fi
          printf 'claimed_at=%s\nworkflow_run=%s\nsource_revision=%s\n' "${claim_time}" "${GITHUB_RUN_ID}" "${GITHUB_SHA}" > oneshot-marker.txt
          gcloud storage cp oneshot-marker.txt "${marker_uri}" >/dev/null

          assert_schedulers_paused() {
            for scheduler in polititrack-legislative polititrack-executive polititrack-ai polititrack-dashboard polititrack-vault-lifecycle; do
              state="$(gcloud scheduler jobs describe "${scheduler}" --project "${PROJECT_ID}" --location "${REGION}" --format='value(state)')"
              [[ "${state}" == "PAUSED" ]] || { echo "Scheduler ${scheduler} is not paused." >&2; exit 1; }
            done
          }
          assert_schedulers_paused

          gcloud sql instances describe "${SQL_INSTANCE}" --project "${PROJECT_ID}" --format=json > sql-before.json
          jq -e '.settings.ipConfiguration.ipv4Enabled == false and any(.ipAddresses[]?; .type == "PRIVATE")' sql-before.json >/dev/null || {
            echo "Cloud SQL is not private-only with a private address." >&2
            exit 1
          }

          container_from_file() {
            jq -c 'first(.. | objects | select(has("containers")) | .containers[0])' "$1"
          }
          private_ip_from_container() {
            jq -r '[.env[]? | select(.name == "PRIVATE_IP") | .value][0] // empty'
          }

          gcloud run jobs describe "${ADMIN_JOB}" --project "${PROJECT_ID}" --region "${REGION}" --format=json > admin-before.json
          admin_container="$(container_from_file admin-before.json)"
          [[ "$(jq -c '.command // []' <<<"${admin_container}")" == '["python"]' ]] || { echo "Unexpected admin command baseline." >&2; exit 1; }
          [[ "$(jq -c '.args // []' <<<"${admin_container}")" == '["-m","runtime_v2","init-db","--with-vault"]' ]] || { echo "Unexpected admin argument baseline." >&2; exit 1; }

          # Terraform already declares PRIVATE_IP=true. Reconcile only that observed deployment drift.
          runtime_jobs=(polititrack-admin polititrack-legislative polititrack-executive polititrack-ai polititrack-dashboard)
          : > private-ip-reconciliation.txt
          for job in "${runtime_jobs[@]}"; do
            file="${job}-before.json"
            gcloud run jobs describe "${job}" --project "${PROJECT_ID}" --region "${REGION}" --format=json > "${file}"
            container="$(container_from_file "${file}")"
            current="$(private_ip_from_container <<<"${container}")"
            if [[ "${current,,}" != "true" ]]; then
              gcloud run jobs update "${job}" \
                --project "${PROJECT_ID}" \
                --region "${REGION}" \
                --update-env-vars=PRIVATE_IP=true \
                --quiet >/dev/null
              printf '%s corrected from %q to true\n' "${job}" "${current}" >> private-ip-reconciliation.txt
            else
              printf '%s already true\n' "${job}" >> private-ip-reconciliation.txt
            fi
          done

          gcloud run services describe "${WEB_SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format=json > web-before.json
          web_container="$(container_from_file web-before.json)"
          web_private="$(private_ip_from_container <<<"${web_container}")"
          if [[ "${web_private,,}" != "true" ]]; then
            gcloud run services update "${WEB_SERVICE}" \
              --project "${PROJECT_ID}" \
              --region "${REGION}" \
              --update-env-vars=PRIVATE_IP=true \
              --quiet >/dev/null
            printf '%s corrected from %q to true\n' "${WEB_SERVICE}" "${web_private}" >> private-ip-reconciliation.txt
          else
            printf '%s already true\n' "${WEB_SERVICE}" >> private-ip-reconciliation.txt
          fi

          for job in "${runtime_jobs[@]}"; do
            gcloud run jobs describe "${job}" --project "${PROJECT_ID}" --region "${REGION}" --format=json > "${job}-after.json"
            container="$(container_from_file "${job}-after.json")"
            [[ "$(private_ip_from_container <<<"${container}" | tr '[:upper:]' '[:lower:]')" == "true" ]] || {
              echo "${job} still lacks PRIVATE_IP=true after reconciliation." >&2
              exit 1
            }
          done
          gcloud run services describe "${WEB_SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format=json > web-after.json
          web_after_container="$(container_from_file web-after.json)"
          [[ "$(private_ip_from_container <<<"${web_after_container}" | tr '[:upper:]' '[:lower:]')" == "true" ]] || {
            echo "${WEB_SERVICE} still lacks PRIVATE_IP=true after reconciliation." >&2
            exit 1
          }

          admin_after_container="$(container_from_file polititrack-admin-after.json)"
          [[ "$(jq -c '.command // []' <<<"${admin_after_container}")" == '["python"]' ]] || { echo "Admin command changed during reconciliation." >&2; exit 1; }
          [[ "$(jq -c '.args // []' <<<"${admin_after_container}")" == '["-m","runtime_v2","init-db","--with-vault"]' ]] || { echo "Admin args changed during reconciliation." >&2; exit 1; }
          assert_schedulers_paused

          cleanup_temporary_access
          gcloud run jobs add-iam-policy-binding "${ADMIN_JOB}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --member "${member}" \
            --role roles/run.jobsExecutorWithOverrides \
            --quiet >/dev/null
          gcloud projects add-iam-policy-binding "${PROJECT_ID}" \
            --member "${member}" \
            --role roles/logging.admin \
            --condition=None \
            --quiet >/dev/null
          gcloud logging views add-iam-policy-binding "${LOG_VIEW}" \
            --bucket "${LOG_BUCKET}" \
            --location "${LOG_LOCATION}" \
            --project "${PROJECT_ID}" \
            --member "${member}" \
            --role roles/logging.viewAccessor \
            --quiet >/dev/null

          logging_ready=false
          for attempt in $(seq 1 15); do
            if gcloud logging read 'resource.type="cloud_run_job"' --project "${PROJECT_ID}" --limit=1 --format=json >/dev/null 2> logging-ready-error.txt; then
              logging_ready=true
              break
            fi
            echo "Log-view IAM not effective yet (attempt ${attempt}/15)."
            sleep 10
          done
          [[ "${logging_ready}" == "true" ]] || { cat logging-ready-error.txt >&2 || true; echo "Cloud Logging access did not propagate." >&2; exit 1; }

          set +e
          gcloud run jobs execute "${ADMIN_JOB}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --args=-m,runtime_v2,status \
            --wait \
            --format=json > execute-result.json 2> execute-error.txt
          execute_rc=$?
          set -e

          status_execution="$(gcloud run jobs describe "${ADMIN_JOB}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.latestCreatedExecution.name)')"
          [[ -n "${status_execution}" ]] || { echo "Could not resolve the status execution name." >&2; exit 1; }
          gcloud run jobs executions describe "${status_execution}" --project "${PROJECT_ID}" --region "${REGION}" --format=json > status-execution.json
          status_container="$(container_from_file status-execution.json)"
          [[ "$(jq -c '.command // []' <<<"${status_container}")" == '["python"]' ]] || { echo "Status execution did not use python." >&2; exit 1; }
          [[ "$(jq -c '.args // []' <<<"${status_container}")" == '["-m","runtime_v2","status"]' ]] || { echo "Latest execution is not the bounded status probe." >&2; exit 1; }
          start_time="$(jq -r '.status.startTime // empty' status-execution.json)"
          [[ -n "${start_time}" && "${start_time}" > "${claim_time}" ]] || { echo "Status execution predates this finalizer." >&2; exit 1; }

          status_found=false
          for attempt in $(seq 1 20); do
            gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${ADMIN_JOB}\" AND resource.labels.location=\"${REGION}\" AND labels.\"run.googleapis.com/execution_name\"=\"${status_execution}\"" \
              --project "${PROJECT_ID}" \
              --order=asc \
              --limit=300 \
              --format=json > status-logs.json
            jq -c '[.[] | .textPayload? | select(type == "string") | fromjson? | select(type == "object" and has("heads") and has("latest_runs"))][0] // empty' status-logs.json > status.json
            if [[ -s status.json ]]; then
              status_found=true
              break
            fi
            sleep 5
          done
          if [[ "${execute_rc}" -ne 0 ]]; then
            cat execute-error.txt >&2 || true
            jq -r '.[] | .textPayload? // empty' status-logs.json >&2 || true
            echo "Current read-only status execution failed." >&2
            exit 1
          fi
          jq -e 'any(.status.conditions[]?; .type == "Completed" and .status == "True")' status-execution.json >/dev/null || {
            echo "Current status execution did not complete successfully." >&2
            exit 1
          }
          [[ "${status_found}" == "true" ]] || { echo "Current status execution produced no durable-state JSON." >&2; exit 1; }

          cleanup_temporary_access
          trap - EXIT
          project_policy="$(gcloud projects get-iam-policy "${PROJECT_ID}" --format=json)"
          if jq -e --arg member "${member}" '[.bindings[]? | select(.role == "roles/logging.admin") | .members[]?] | any(. == $member)' <<<"${project_policy}" >/dev/null; then
            echo "Temporary Logging Admin remains." >&2
            exit 1
          fi
          view_policy="$(gcloud logging views get-iam-policy "${LOG_VIEW}" --bucket "${LOG_BUCKET}" --location "${LOG_LOCATION}" --project "${PROJECT_ID}" --format=json)"
          if jq -e --arg member "${member}" '[.bindings[]? | select(.role == "roles/logging.viewAccessor") | .members[]?] | any(. == $member)' <<<"${view_policy}" >/dev/null; then
            echo "Temporary log-view accessor remains." >&2
            exit 1
          fi
          admin_policy="$(gcloud run jobs get-iam-policy "${ADMIN_JOB}" --project "${PROJECT_ID}" --region "${REGION}" --format=json)"
          if jq -e --arg member "${member}" '[.bindings[]? | select(.role == "roles/run.jobsExecutorWithOverrides") | .members[]?] | any(. == $member)' <<<"${admin_policy}" >/dev/null; then
            echo "Temporary admin execution authority remains." >&2
            exit 1
          fi

          assert_schedulers_paused
          gcloud sql instances describe "${SQL_INSTANCE}" --project "${PROJECT_ID}" --format=json > sql-after.json
          jq -e '.settings.ipConfiguration.ipv4Enabled == false and any(.ipAddresses[]?; .type == "PRIVATE")' sql-after.json >/dev/null || { echo "Cloud SQL private boundary changed." >&2; exit 1; }
          web_policy="$(gcloud run services get-iam-policy "${WEB_SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format=json)"
          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers")' <<<"${web_policy}" >/dev/null; then
            echo "Runtime v2 web service has public allUsers access." >&2
            exit 1
          fi

          gcloud run jobs describe "${ADMIN_JOB}" --project "${PROJECT_ID}" --region "${REGION}" --format=json > admin-final.json
          admin_final_container="$(container_from_file admin-final.json)"
          [[ "$(jq -c '.command // []' <<<"${admin_final_container}")" == '["python"]' ]] || { echo "Admin command changed after status override." >&2; exit 1; }
          [[ "$(jq -c '.args // []' <<<"${admin_final_container}")" == '["-m","runtime_v2","init-db","--with-vault"]' ]] || { echo "Admin args changed after status override." >&2; exit 1; }
          [[ "$(private_ip_from_container <<<"${admin_final_container}" | tr '[:upper:]' '[:lower:]')" == "true" ]] || { echo "Admin private routing was not retained." >&2; exit 1; }

          python ../deploy/runtime-v2/validate_phase3_status.py \
            --status status.json \
            --status-execution "${status_execution}" \
            --source-revision "${GITHUB_SHA}" \
            --output phase3-acceptance.json

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('phase3-acceptance.json')
          receipt = json.loads(path.read_text(encoding='utf-8'))
          receipt.update({
              'private_ip_environment_reconciled': True,
              'runtime_jobs_private_ip_verified': [
                  'polititrack-admin',
                  'polititrack-legislative',
                  'polititrack-executive',
                  'polititrack-ai',
                  'polititrack-dashboard',
              ],
              'web_private_ip_verified': True,
          })
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          Path('phase3-acceptance.sha256').write_text(digest + '  phase3-acceptance.json\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          print(f'phase3_acceptance_sha256={digest}')
          PY
          gcloud storage cp phase3-acceptance.json "${acceptance_uri}" >/dev/null
          remote_digest="$(gcloud storage cat "${acceptance_uri}" | sha256sum | awk '{print $1}')"
          local_digest="$(awk '{print $1}' phase3-acceptance.sha256)"
          [[ "${remote_digest}" == "${local_digest}" ]] || { echo "Private acceptance receipt round-trip digest mismatch." >&2; exit 1; }

      - name: Upload Phase 3 final acceptance receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase3-final-readiness
          path: |
            phase3-finalize/phase3-acceptance.json
            phase3-finalize/phase3-acceptance.sha256
            phase3-finalize/status.json
            phase3-finalize/status-execution.json
            phase3-finalize/private-ip-reconciliation.txt
            phase3-finalize/oneshot-marker.txt
          if-no-files-found: warn
          retention-days: 90
