name: Issue 121 CI compatibility patch

on:
  push:
    branches:
      - codex/issue-121-ai-analyst-recovery

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.repository_id == '1349678672' &&
      github.ref_name == 'codex/issue-121-ai-analyst-recovery' &&
      github.run_attempt == 1 &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          ref: codex/issue-121-ai-analyst-recovery
          fetch-depth: 0

      - name: Apply intentional compatibility updates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          hardened = Path('scripts/ai_filing_analyst_hardened.py')
          text = hardened.read_text(encoding='utf-8')
          replacements = []

          replacements.append((
              'MAX_STRUCTURED_OUTPUT_ATTEMPTS = 2\n',
              'MAX_STRUCTURED_OUTPUT_ATTEMPTS = 3\n',
              'structured-output attempt constant',
          ))

          class_anchor = '\n'.join([
              '        self.diagnostics = tuple(dict(item) for item in diagnostics)',
              '',
              '',
              '@dataclass(frozen=True)',
          ])
          class_replacement = '\n'.join([
              '        self.diagnostics = tuple(dict(item) for item in diagnostics)',
              '',
              '',
              'class CandidateDeliveryRejected(legacy.AnalystError):',
              '    """The provider definitely did not accept the candidate alert."""',
              '',
              '',
              'class CandidateDeliveryUncertain(legacy.AnalystError):',
              '    """The provider may have accepted the candidate alert."""',
              '',
              '',
              '@dataclass(frozen=True)',
          ])
          replacements.append((class_anchor, class_replacement, 'delivery exception classes'))

          helper_anchor = '\n'.join([
              'def _checkpoint_result(',
              '    config: legacy.AnalystConfig,',
              '    result: AnalystRunResult,',
              ') -> None:',
              '    _result_metadata(result)',
              '    legacy.write_json(config.result_path, asdict(result))',
              '',
              '',
              'def _deliver_pending_candidate_alerts(',
          ])
          helper_replacement = '\n'.join([
              'def _checkpoint_result(',
              '    config: legacy.AnalystConfig,',
              '    result: AnalystRunResult,',
              ') -> None:',
              '    _result_metadata(result)',
              '    legacy.write_json(config.result_path, asdict(result))',
              '',
              '',
              'def _send_candidate_email_with_evidence(',
              '    config: legacy.AnalystConfig, alert: Mapping[str, str]',
              ') -> bool:',
              '    """Send Gmail while distinguishing rejection from unknown acceptance."""',
              '',
              '    address = config.gmail_address.strip()',
              '    password = config.gmail_app_password.strip()',
              '    if not address and not password:',
              '        return False',
              '    if not address or not password:',
              '        raise FatalAnalystConfigurationError(',
              '            "Gmail candidate alert credentials are incomplete"',
              '        )',
              '',
              '    message = legacy.EmailMessage()',
              '    message["Subject"] = str(alert.get("title") or "PolitiTrack candidate")[:250]',
              '    message["From"] = address',
              '    message["To"] = address',
              '    message.set_content(str(alert.get("message") or ""))',
              '    timeout = max(float(item) for item in config.request_timeout)',
              '    submission_possible = False',
              '    try:',
              '        with legacy.smtplib.SMTP_SSL(',
              '            "smtp.gmail.com", 465, timeout=timeout',
              '        ) as server:',
              '            server.login(address, password)',
              '            submission_possible = True',
              '            server.send_message(message)',
              '    except Exception as exc:',
              '        detail = _safe_error(exc, config)',
              '        failure = f"Gmail candidate alert failed: {type(exc).__name__}: {detail}"',
              '        if submission_possible:',
              '            raise CandidateDeliveryUncertain(failure) from exc',
              '        raise CandidateDeliveryRejected(failure) from exc',
              '    return True',
              '',
              '',
              'def _deliver_pending_candidate_alerts(',
          ])
          replacements.append((helper_anchor, helper_replacement, 'evidenced Gmail sender'))

          replacements.append((
              '                    accepted = legacy._send_candidate_email(config, alert)\n',
              '                    accepted = _send_candidate_email_with_evidence(config, alert)\n',
              'Gmail sender call',
          ))

          catch_anchor = '\n'.join([
              '            except Exception as exc:  # External acceptance is now uncertain.',
              '                channel_errors[channel] = (',
              '                    f"{type(exc).__name__}: {_safe_error(exc, config)}"',
              '                )',
              '                delivery["channel_errors"] = channel_errors',
              '                legacy.save_state(state_path, state)',
              '                result.delivery_uncertain_count += 1',
              '                result.errors.append(',
              '                    f"Candidate alert delivery {delivery_id}/{channel}: "',
              '                    f"{type(exc).__name__}: {_safe_error(exc, config)}"',
              '                )',
              '                _checkpoint_result(config, result)',
              '                return',
          ])
          catch_replacement = '\n'.join([
              '            except CandidateDeliveryRejected as exc:',
              '                channel_errors[channel] = (',
              '                    f"{type(exc).__name__}: {_safe_error(exc, config)}"',
              '                )',
              '                delivery["channel_errors"] = channel_errors',
              '                legacy.save_state(state_path, state)',
              '                result.warnings.append(',
              '                    f"Candidate alert delivery {delivery_id}/{channel} was "',
              '                    f"rejected before acceptance and remains pending: "',
              '                    f"{_safe_error(exc, config)}"',
              '                )',
              '                _checkpoint_result(config, result)',
              '                continue',
              '            except FatalAnalystConfigurationError as exc:',
              '                channel_errors[channel] = (',
              '                    f"{type(exc).__name__}: {_safe_error(exc, config)}"',
              '                )',
              '                delivery["channel_errors"] = channel_errors',
              '                legacy.save_state(state_path, state)',
              '                result.errors.append(',
              '                    f"Candidate alert delivery {delivery_id}/{channel}: "',
              '                    f"{type(exc).__name__}: {_safe_error(exc, config)}"',
              '                )',
              '                _checkpoint_result(config, result)',
              '                return',
              '            except Exception as exc:  # External acceptance is now uncertain.',
              '                channel_errors[channel] = (',
              '                    f"{type(exc).__name__}: {_safe_error(exc, config)}"',
              '                )',
              '                delivery["channel_errors"] = channel_errors',
              '                legacy.save_state(state_path, state)',
              '                result.delivery_uncertain_count += 1',
              '                result.errors.append(',
              '                    f"Candidate alert delivery {delivery_id}/{channel}: "',
              '                    f"{type(exc).__name__}: {_safe_error(exc, config)}"',
              '                )',
              '                _checkpoint_result(config, result)',
              '                return',
          ])
          replacements.append((catch_anchor, catch_replacement, 'delivery rejection handling'))

          for old, new, label in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'{label} anchor changed unexpectedly: {text.count(old)}')
              text = text.replace(old, new)
          hardened.write_text(text, encoding='utf-8')

          tests = Path('tests/test_ai_filing_analyst.py')
          lines = tests.read_text(encoding='utf-8').splitlines(keepends=True)
          insert_after: list[int] = []
          for index, line in enumerate(lines):
              if 'return SimpleNamespace(' not in line:
                  continue
              window = lines[index:index + 30]
              if not any('output_text=' in candidate for candidate in window):
                  continue
              id_offset = next(
                  (offset for offset, candidate in enumerate(window) if candidate.lstrip().startswith('id=')),
                  None,
              )
              if id_offset is None:
                  continue
              absolute = index + id_offset
              if absolute + 1 < len(lines) and lines[absolute + 1].lstrip().startswith('status='):
                  continue
              insert_after.append(absolute)
          if len(insert_after) < 5:
              raise SystemExit(f'expected at least five legacy response fixtures, found {len(insert_after)}')
          for absolute in reversed(insert_after):
              indent = lines[absolute][: len(lines[absolute]) - len(lines[absolute].lstrip())]
              lines.insert(absolute + 1, f'{indent}status="completed",\n')
          text = ''.join(lines)

          old_quota = '\n'.join([
              '    assert result.success is False',
              '    assert result.attempted_count == 1',
              '    assert calls["count"] == 1',
              '    assert len(result.errors) == 1',
              '    assert "quota" in result.errors[0].casefold()',
              '    assert any(',
              '        "remaining ai analyses were not attempted"',
              '        in item.casefold()',
              '        for item in result.warnings',
              '    )',
              '',
          ])
          new_quota = '\n'.join([
              '    assert result.success is True',
              '    assert result.run_status == "degraded"',
              '    assert result.state_publishable is True',
              '    assert result.attempted_count == 1',
              '    assert calls["count"] == 1',
              '    assert result.errors == []',
              '    assert len(result.deferred_candidates) == 2',
              '    assert result.deferred_candidates[0]["reason"] == "openai_quota_unavailable"',
              '    assert result.deferred_candidates[1]["reason"] == "not_attempted_after_openai_quota"',
              '    assert any(',
              '        "remaining ai analyses were deferred"',
              '        in item.casefold()',
              '        for item in result.warnings',
              '    )',
              '',
          ])
          if text.count(old_quota) != 1:
              raise SystemExit('legacy quota expectation block changed unexpectedly')
          tests.write_text(text.replace(old_quota, new_quota), encoding='utf-8')

          hardened_tests = Path('tests/test_ai_filing_analyst_hardened.py')
          text = hardened_tests.read_text(encoding='utf-8')
          malformed_old = 'factory = _Factory([_response("{"), _response("{")])\n'
          malformed_new = 'factory = _Factory([_response("{"), _response("{"), _response("{")])\n'
          if text.count(malformed_old) != 1:
              raise SystemExit('malformed-output fixture anchor changed unexpectedly')
          text = text.replace(malformed_old, malformed_new)
          if text.count('    assert len(caught.value.diagnostics) == 2\n') != 1:
              raise SystemExit('malformed-output diagnostic expectation changed unexpectedly')
          hardened_tests.write_text(
              text.replace(
                  '    assert len(caught.value.diagnostics) == 2\n',
                  '    assert len(caught.value.diagnostics) == 3\n',
              ),
              encoding='utf-8',
          )

          scheduler = Path('tests/test_scheduler_evidence.py')
          text = scheduler.read_text(encoding='utf-8')
          scheduler_old = '\n'.join([
              '        assert "collect_workflow_evidence.py" in text',
              '        assert f"--guard-branch {branch}" in text',
              '        assert text.index("--guard-branch") < text.index(f"- name: {spec[\'step\']}")',
              '',
          ])
          scheduler_new = '\n'.join([
              '        if branch == "ai":',
              '            assert "ai_retry_guard.py" in text',
              '            assert "--producer-run" in text',
              '            assert "--producer-attempt" in text',
              '            assert text.index("ai_retry_guard.py") < text.index(',
              '                f"- name: {spec[\'step\']}"',
              '            )',
              '        else:',
              '            assert "collect_workflow_evidence.py" in text',
              '            assert f"--guard-branch {branch}" in text',
              '            assert text.index("--guard-branch") < text.index(',
              '                f"- name: {spec[\'step\']}"',
              '            )',
              '',
          ])
          if text.count(scheduler_old) != 1:
              raise SystemExit('scheduler retry-guard assertion block changed unexpectedly')
          scheduler.write_text(text.replace(scheduler_old, scheduler_new), encoding='utf-8')
          PY
          python -m py_compile scripts/ai_filing_analyst_hardened.py
          git diff --check

      - name: Run focused and compatibility tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements-ai.txt pytest==9.0.2
          python -m pytest -q \
            tests/test_ai_filing_analyst.py \
            tests/test_ai_filing_analyst_hardened.py \
            tests/test_ai_retry_guard.py \
            tests/test_validate_ai_publication.py \
            tests/test_scheduler_evidence.py

      - name: Commit patch without mutating this workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/issue-121-ai-analyst-recovery
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/codex/issue-121-ai-analyst-recovery)"
          git checkout HEAD -- .github/workflows/issue121_ci_compat_patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/ai_filing_analyst_hardened.py \
            tests/test_ai_filing_analyst.py \
            tests/test_ai_filing_analyst_hardened.py \
            tests/test_scheduler_evidence.py
          git diff --cached --quiet && { echo 'Compatibility patch produced no changes.' >&2; exit 1; }
          git commit -m 'Align AI hardening with full compatibility suite (#121)'
          git push origin HEAD:codex/issue-121-ai-analyst-recovery
